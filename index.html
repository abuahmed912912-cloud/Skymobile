<head>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --sky-primary: #0a3d62;
            --sky-accent: #00a8ff;
            --sky-gradient: linear-gradient(135deg, #0c2461 0%, #0a3d62 50%, #00a8ff 100%);
            --font-current: 'Cairo', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-current); transition: font-family 0.2s ease; }

        body { 
            background: var(--sky-gradient);
            background-attachment: fixed;
            color: #2d3436; 
            padding: 15px 10px; 
            min-height: 100vh;
        }

        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        
        .brand-header { 
            text-align: center; 
            margin-bottom: 20px; 
            padding-bottom: 15px; 
            border-bottom: 2px dashed #00a8ff; 
        }
        .brand-logo {
            width: 90px;
            height: auto;
            margin-bottom: 8px;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.15));
            cursor: pointer;
            user-select: none;
        }
        .brand-header h1 { color: #0c2461; font-size: 22px; font-weight: 700; }
        .brand-header p { font-size: 13px; color: #00a8ff; font-weight: bold; }

        .client-input-card { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 12px 15px; border-radius: 12px; margin-bottom: 12px; }
        .client-input-card label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 13px; color: #0c2461; }
        .client-input-card input, .client-input-card select { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: #fff; }

        .top-action-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-custom-action { flex: 1; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 13px; border: none; cursor: pointer; text-align: center; color: white; }
        .btn-reset-default { background-color: #e74c3c; }
        .btn-change-font { background-color: #f39c12; }

        .font-indicator { text-align: center; font-size: 11px; color: #0a3d62; margin-top: -8px; margin-bottom: 12px; font-weight: bold; }

        .categories-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-chip { background: #fff; border: 1px solid #cbd5e1; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; color: #475569; }
        .cat-chip.active { background: #0a3d62; color: #fff; border-color: #0a3d62; }

        .templates-preview-scroll { 
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; min-height: 100px; -webkit-overflow-scrolling: touch;
        }
        
        .thumb-card { 
            flex: 0 0 80px; height: 100px; border-radius: 10px; overflow: hidden; border: 2px solid #cbd5e1; cursor: pointer; background: #e2e8f0; position: relative;
        }
        .thumb-card.selected { border-color: #00a8ff; box-shadow: 0 0 10px rgba(0,168,255,0.6); transform: scale(1.03); }
        .thumb-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .preview-box { background: #fff; border: 2px dashed #00a8ff; padding: 12px; border-radius: 14px; margin-top: 15px; }
        #canvasContainer { position: relative; width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 15px; background: #f8fafc; }
        #previewCanvas { width: 100%; height: auto; display: block; }

        .external-actions-section { margin-top: 15px; padding-top: 15px; border-top: 2px solid #f1f5f9; }
        .action-links { display: flex; flex-direction: column; gap: 10px; }
        .link-btn { display: block; width: 100%; padding: 13px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 14px; text-align: center; color: white; border: none; cursor: pointer; }
        .download-img-btn { background-color: #00a8ff; }
        .whatsapp-share-btn { background-color: #25d366; }
        .copy-link-btn { background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .store-link-btn { background-color: #0a3d62; }
        .whatsapp-channel-btn { background-color: #128c7e; }

        .client-credits-footer { margin-top: 20px; padding-top: 12px; border-top: 1px solid #e2e8f0; text-align: center; font-size: 12px; color: #64748b; font-weight: 600; }

        .admin-header { background: var(--sky-gradient); color: white; padding: 20px; border-radius: 14px; text-align: center; margin-bottom: 20px; }
        .admin-card { background: #fff; border: 1px solid #e2e8f0; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #495057; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 10px; font-size: 14px; }
        .btn-main { background: var(--sky-gradient); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .sub-img-list { font-size: 13px; color: #555; margin: 8px 0; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .btn-copy { background-color: #00a8ff; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .btn-delete { background-color: #e74c3c; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .btn-exit-admin { background-color: #e74c3c; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNwIUGqA2dm5Mrx5S06LIEGPJ_VgW3eFc",
            authDomain: "sky-mobile-8e245.firebaseapp.com",
            databaseURL: "https://sky-mobile-8e245-default-rtdb.firebaseio.com",
            projectId: "sky-mobile-8e245",
            messagingSenderId: "1066510361417",
            appId: "1:1066510361417:web:a5e17c7f3c8e267b1d3098"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentAdminPass = "sky2026"; 

        let globalLinks = {
            appUrl: 'https://play.google.com/store/apps/details?id=com.skymobile.app',
            whatsappUrl: 'https://whatsapp.com/channel/YOUR_CHANNEL_LINK'
        };

        const fontList = [
            { name: ' (Cairo)', family: "'Cairo', sans-serif" },
            { name: ' (Tajawal)', family: "'Tajawal', sans-serif" },
            { name: ' (Almarai)', family: "'Almarai', sans-serif" },
            { name: ' (Alexandria)', family: "'Alexandria', sans-serif" },
            { name: ' (Changa)', family: "'Changa', sans-serif" }
        ];
        let currentFontIndex = parseInt(localStorage.getItem('sky_font_idx') || '0');

        let categories = [{ id: 'cat_wifi_networks', name: '   ' }];
        let designs = [];
        let networkCodes = []; 
        let imageCache = {}; 
        let activeCategory = 'all'; 
        let currentDesignId = null;
        let loadedBaseImage = null;
        let renderDebounceTimer = null;
        let logoClickCounter = 0;
        let logoClickTimer = null;

        window.onload = function() {
            applyFontToBody();
            listenToCloudData();
        };

        function applyFontToBody() {
            const fontObj = fontList[currentFontIndex];
            document.documentElement.style.setProperty('--font-current', fontObj.family);
            const fontIndicator = document.getElementById('currentFontName');
            if (fontIndicator) fontIndicator.innerText = fontObj.name;
        }

        function listenToCloudData() {
            db.ref('sky_data').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.categories) {
                        const fetchedCats = Object.values(data.categories);
                        if (!fetchedCats.some(c => c.id === 'cat_wifi_networks')) {
                            fetchedCats.unshift({ id: 'cat_wifi_networks', name: '   ' });
                        }
                        categories = fetchedCats;
                    }
                    if (data.designs) designs = Object.values(data.designs);
                    if (data.links) globalLinks = data.links;
                    if (data.adminPass) currentAdminPass = data.adminPass;
                    if (data.networks) networkCodes = Object.values(data.networks);
                }
                checkViewState();
            });
        }

        function checkViewState() {
            const container = document.getElementById('mainContainer');
            const isAdminMode = sessionStorage.getItem('sky_in_admin_mode') === 'true';
            const isAuth = sessionStorage.getItem('sky_admin_authenticated') === 'true';

            if (isAdminMode) {
                if (isAuth) {
                    renderAdminPanel(container);
                } else {
                    renderLoginForm(container);
                }
            } else {
                renderClientPanel(container);
            }
        }

        function handleSecretLogoClick() {
            logoClickCounter++;
            clearTimeout(logoClickTimer);

            if (logoClickCounter >= 5) {
                logoClickCounter = 0;
                sessionStorage.setItem('sky_in_admin_mode', 'true');
                checkViewState();
            } else {
                logoClickTimer = setTimeout(() => {
                    logoClickCounter = 0;
                }, 1500);
            }
        }

        function renderLoginForm(container) {
            container.innerHTML = `
                <div class="admin-header">
                    <h2>    </h2>
                    <p>     </p>
                </div>
                <div class="form-group">
                    <label> :</label>
                    <input type="password" id="adminPassInput" placeholder="  ">
                </div>
                <button class="btn-main" onclick="verifyPassword()"> </button>
                <div style="text-align: center; margin-top: 15px;">
                    <button onclick="exitAdminMode()" style="background:none; border:none; color:#00a8ff; cursor:pointer; font-size:13px; font-weight:bold;">   </button>
                </div>
            `;
        }

        function verifyPassword() {
            const pass = document.getElementById('adminPassInput').value.trim();
            if (pass === currentAdminPass) {
                sessionStorage.setItem('sky_admin_authenticated', 'true');
                checkViewState();
            } else { 
                alert('    !'); 
            }
        }

        function exitAdminMode() {
            sessionStorage.removeItem('sky_in_admin_mode');
            sessionStorage.removeItem('sky_admin_authenticated');
            checkViewState();
        }

        function renderClientPanel(container) {
            const urlParams = new URLSearchParams(window.location.search);
            const designId = urlParams.get('id');

            let currentDesign = null;
            if (designId) {
                currentDesign = designs.find(d => d.id == designId);
                if (currentDesign && currentDesign.categoryId) activeCategory = currentDesign.categoryId;
            } 
            
            if (!currentDesign) {
                let filtered = getFilteredDesigns();
                currentDesign = filtered[0] || designs[0] || { id: '', title: ' ', image: '' };
            }

            currentDesignId = currentDesign.id;

            let categoriesHtml = `<div class="cat-chip ${activeCategory==='all'?'active':''}" id="chip_all" onclick="filterByCategory('all')">  (${designs.length})</div>`;
            categories.forEach(cat => {
                const count = designs.filter(d => d.categoryId === cat.id).length;
                categoriesHtml += `<div class="cat-chip ${activeCategory===cat.id?'active':''}" id="chip_${cat.id}" onclick="filterByCategory('${cat.id}')">${cat.name} (${count})</div>`;
            });

            let networksOptionsHtml = `<option value="" data-name="">   </option>`;
            networkCodes.forEach(net => {
                networksOptionsHtml += `<option value="${net.code}" data-name="${net.name}">${net.name} - (: ${net.code})</option>`;
            });

            container.innerHTML = `
                <header class="brand-header">
                    <svg class="brand-logo" onclick="handleSecretLogoClick()" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M40 50 C 70 10, 130 10, 160 50" stroke="#00a8ff" stroke-width="12" stroke-linecap="round"/>
                        <rect x="150" y="20" width="8" height="8" fill="#00a8ff"/>
                        <rect x="162" y="20" width="8" height="8" fill="#00a8ff"/>
                        <rect x="162" y="32" width="8" height="8" fill="#00a8ff"/>
                        <text x="50%" y="90" text-anchor="middle" fill="#0c2461" font-size="38" font-weight="900" font-family="Arial">SKY</text>
                        <text x="50%" y="115" text-anchor="middle" fill="#00a8ff" font-size="16" font-weight="bold" letter-spacing="3">MOBILE</text>
                        <text x="50%" y="145" text-anchor="middle" fill="#0c2461" font-size="20" font-weight="bold"> </text>
                    </svg>
                    <h1>   </h1>
                    <p style="color:#0c2461; font-weight:800; font-size:15px; margin-top:5px; background:rgba(0,168,255,0.15); display:inline-block; padding:4px 12px; border-radius:15px;">       </p>
                </header>

                <div class="top-action-bar">
                    <button class="btn-custom-action btn-reset-default" onclick="resetDefaultData()">  </button>
                    <button class="btn-custom-action btn-change-font" onclick="changeCustomFont()">  </button>
                </div>
                <div class="font-indicator"> : <span id="currentFontName">${fontList[currentFontIndex].name}</span></div>

                <div class="categories-scroll">${categoriesHtml}</div>

                <div class="templates-preview-scroll" id="templatesScrollContainer"></div>

                <div class="client-input-card">
                    <label>   :</label>
                    <select id="cNetSelect" onchange="applySelectedNetworkCode()" style="margin-bottom:8px;">
                        ${networksOptionsHtml}
                    </select>
                    
                    <label>      (    ):</label>
                    <input type="text" id="cNetCode" placeholder=": 102" oninput="autoMatchNetworkCode()" style="margin-bottom:8px;">

                    <label> :</label>
                    <input type="text" id="cNetName" placeholder=":  " oninput="debouncedDraw()">
                </div>

                <div class="client-input-card">
                    <label>     :</label>
                    <input type="text" id="cShop" placeholder="     " oninput="debouncedDraw()">
                </div>

                <div class="client-input-card">
                    <label>  :</label>
                    <input type="text" id="cAddress" placeholder="  (:  - )" oninput="debouncedDraw()">
                </div>

                <div class="client-input-card">
                    <label>   / :</label>
                    <input type="text" id="cPhone" value="738328251" placeholder="  " oninput="debouncedDraw()">
                </div>

                <div class="preview-box">
                    <div id="canvasContainer">
                        <canvas id="previewCanvas"></canvas>
                    </div>

                    <div class="external-actions-section">
                        <div class="action-links">
                            <button class="link-btn download-img-btn" onclick="downloadImage()">    </button>
                            <button class="link-btn whatsapp-share-btn" onclick="shareToWhatsApp()">    </button>
                            <button class="link-btn copy-link-btn" onclick="copyDirectLink()">    </button>
                            
                            <a href="${globalLinks.appUrl}" target="_blank" class="link-btn store-link-btn">      </a>
                            <a href="${globalLinks.whatsappUrl}" target="_blank" class="link-btn whatsapp-channel-btn">    </a>
                        </div>
                    </div>
                </div>

                <div class="client-credits-footer">
                     :   ( ) — : 738328251
                </div>
            `;

            renderClientThumbnails(currentDesignId);
            if (currentDesign && currentDesign.image) loadSelectedDesign(currentDesign);
        }

        function autoMatchNetworkCode() {
            const codeInput = document.getElementById('cNetCode');
            const nameInput = document.getElementById('cNetName');
            const selectEl = document.getElementById('cNetSelect');
            if(!codeInput) return;

            const typedCode = codeInput.value.trim();
            if (typedCode) {
                const matchedNet = networkCodes.find(n => n.code == typedCode);
                if (matchedNet) {
                    if (nameInput) nameInput.value = matchedNet.name;
                    if (selectEl) selectEl.value = matchedNet.code;
                }
            }
            debouncedDraw();
        }

        function applySelectedNetworkCode() {
            const selectEl = document.getElementById('cNetSelect');
            const codeInput = document.getElementById('cNetCode');
            const nameInput = document.getElementById('cNetName');
            
            if (selectEl && selectEl.selectedIndex > 0) {
                const selectedOpt = selectEl.options[selectEl.selectedIndex];
                if (codeInput) codeInput.value = selectEl.value;
                if (nameInput) nameInput.value = selectedOpt.getAttribute('data-name') || "";
                debouncedDraw();
            }
        }

        function filterByCategory(catId) {
            activeCategory = catId;
            document.querySelectorAll('.cat-chip').forEach(chip => chip.classList.remove('active'));
            const targetChip = document.getElementById('chip_' + catId);
            if(targetChip) targetChip.classList.add('active');

            let filteredDesigns = getFilteredDesigns();
            if (filteredDesigns.length > 0) {
                renderClientThumbnails(filteredDesigns[0].id);
                loadSelectedDesign(filteredDesigns[0]);
            } else {
                renderClientThumbnails(null);
                loadedBaseImage = null;
                const canvas = document.getElementById('previewCanvas');
                if(canvas) {
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
        }

        function getFilteredDesigns() {
            if (activeCategory === 'all') return designs;
            return designs.filter(d => d.categoryId === activeCategory);
        }

        function renderClientThumbnails(selectedId) {
            const scrollBox = document.getElementById('templatesScrollContainer');
            if(!scrollBox) return;
            scrollBox.innerHTML = '';

            let list = getFilteredDesigns();

            list.forEach(item => {
                const isSelected = item.id == selectedId;
                const div = document.createElement('div');
                div.className = `thumb-card ${isSelected ? 'selected' : ''}`;
                div.onclick = () => {
                    currentDesignId = item.id;
                    renderClientThumbnails(item.id);
                    loadSelectedDesign(item);
                };
                div.innerHTML = `<img src="${item.image}" alt="${item.title}" loading="lazy">`;
                scrollBox.appendChild(div);
            });
        }

        function loadSelectedDesign(designObj) {
            if(!designObj || !designObj.image) return;

            if (imageCache[designObj.image] && imageCache[designObj.image].complete) {
                loadedBaseImage = imageCache[designObj.image];
                drawFinalImage();
            } else {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = function() {
                    imageCache[designObj.image] = img;
                    loadedBaseImage = img;
                    drawFinalImage();
                };
                img.src = designObj.image;
            }
        }

        function debouncedDraw() {
            clearTimeout(renderDebounceTimer);
            renderDebounceTimer = setTimeout(drawFinalImage, 80);
        }

        function drawFinalImage() {
            if (!loadedBaseImage) return;
            const canvas = document.getElementById('previewCanvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');

            const shopName = document.getElementById('cShop')?.value.trim() || "";
            const address = document.getElementById('cAddress')?.value.trim() || "";
            const phone = document.getElementById('cPhone')?.value.trim() || "";
            const netName = document.getElementById('cNetName')?.value.trim() || "";
            const netCode = document.getElementById('cNetCode')?.value.trim() || "";

            const hasFooterData = shopName || address || phone;
            const footerHeight = hasFooterData ? Math.max(90, loadedBaseImage.height * 0.14) : 0;

            canvas.width = loadedBaseImage.width;
            canvas.height = loadedBaseImage.height + footerHeight;

            const selectedFontFamily = fontList[currentFontIndex].family;

            // 1.   
            ctx.drawImage(loadedBaseImage, 0, 0, loadedBaseImage.width, loadedBaseImage.height);

            // 2.   
            const topBadgeHeight = loadedBaseImage.height * 0.06;
            ctx.fillStyle = "rgba(12, 36, 97, 0.92)";
            ctx.fillRect(0, 0, canvas.width, topBadgeHeight);
            
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#ffffff";
            ctx.font = `bold ${topBadgeHeight * 0.55}px ${selectedFontFamily}`;
            ctx.fillText("       ", canvas.width / 2, topBadgeHeight / 2);

            // 3.  :          
            if (netName || netCode) {
                const netBadgeWidth = canvas.width; //      
                const netBadgeHeight = loadedBaseImage.height * 0.095; //  
                const netX = 0;
                const netY = loadedBaseImage.height - netBadgeHeight - 10;

                ctx.fillStyle = "rgba(12, 36, 97, 0.96)";
                ctx.strokeStyle = "#00a8ff";
                ctx.lineWidth = 3;

                //     
                ctx.beginPath();
                ctx.roundRect(netX, netY, netBadgeWidth, netBadgeHeight, netBadgeHeight / 2);
                ctx.fill();
                ctx.stroke();

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                let mainText = "";
                if (netName && netCode) {
                    mainText = ` : ${netName}  |   : (${netCode})`;
                } else if (netName) {
                    mainText = ` : ${netName}`;
                } else if (netCode) {
                    mainText = `   : (${netCode})`;
                }

                //     ( )
                ctx.fillStyle = "#ffffff";
                ctx.font = `bold ${netBadgeHeight * 0.35}px ${selectedFontFamily}`;
                ctx.fillText(mainText, canvas.width / 2, netY + (netBadgeHeight * 0.33));

                //   (  )
                ctx.fillStyle = "#00a8ff";
                ctx.font = `bold ${netBadgeHeight * 0.32}px ${selectedFontFamily}`;
                ctx.fillText("        ", canvas.width / 2, netY + (netBadgeHeight * 0.72));
            }

            // 4.       
            if (hasFooterData) {
                const footerY = loadedBaseImage.height;

                const grad = ctx.createLinearGradient(0, footerY, canvas.width, canvas.height);
                grad.addColorStop(0, '#0c2461');
                grad.addColorStop(1, '#00a8ff');
                ctx.fillStyle = grad;
                ctx.fillRect(0, footerY, canvas.width, footerHeight);

                ctx.fillStyle = '#f39c12';
                ctx.fillRect(0, footerY, canvas.width, 4);

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                if (shopName) {
                    const shopFontSize = footerHeight * 0.30;
                    ctx.font = `bold ${shopFontSize}px ${selectedFontFamily}`;
                    ctx.fillStyle = "#ffffff";
                    
                    const shopY = (address || phone) ? footerY + (footerHeight * 0.32) : footerY + (footerHeight * 0.50);
                    ctx.fillText(shopName, canvas.width / 2, shopY);
                }

                const subDetails = [
                    address ? " " + address : "",
                    phone ? " " + phone : ""
                ].filter(Boolean).join("  |  ");

                if (subDetails) {
                    const subFontSize = footerHeight * 0.22;
                    ctx.font = `${subFontSize}px ${selectedFontFamily}`;
                    ctx.fillStyle = "#f1c40f";

                    const subY = shopName ? footerY + (footerHeight * 0.70) : footerY + (footerHeight * 0.50);
                    ctx.fillText(subDetails, canvas.width / 2, subY);
                }
            }
        }

        function addNewNetworkCode() {

            const netId = 'net_' + Date.now();
            db.ref('sky_data/networks/' + netId).set({

        function handleDesignUpload() {
            const titleEl = document.getElementById('newDesignTitle');
            const catEl = document.getElementById('newDesignCat');
            const fileInput = document.getElementById('designFileInput');
            const urlInputEl = document.getElementById('designUrlInput');
            const status = document.getElementById('uploadStatus');

            const title = titleEl ? titleEl.value.trim() : "";
            const catId = catEl ? catEl.value : "";
            const urlInput = urlInputEl ? urlInputEl.value.trim() : "";

            if (!title) {
                alert("    !");
                return;
            }

            if (urlInput !== "") {
                saveDesignToDatabase(title, catId, urlInput);
                return;
            }

            if (fileInput && fileInput.files && fileInput.files.length > 0) {
                const file = fileInput.files[0];
                if(status) status.innerText = "     ...";

                const reader = new FileReader();
                reader.onload = function(e) {
                    saveDesignToDatabase(title, catId, e.target.result);
                };
                reader.onerror = function() {
                    alert("    !");
                    if(status) status.innerText = "";
                };
                reader.readAsDataURL(file);
            } else {
                alert("          !");
            }
        }

        function saveDesignToDatabase(title, catId, imageUrl) {
            const status = document.getElementById('uploadStatus');
            const newId = 'design_' + Date.now();

            const newDesign = {
                id: newId,
                title: title,
                categoryId: catId,
                image: imageUrl,
                createdAt: new Date().toISOString()
            };

            db.ref('sky_data/designs/' + newId).set(newDesign)
            .then(() => {
                designs.push(newDesign);
                alert("     !");
                if(status) status.innerText = "";

                if(document.getElementById('newDesignTitle')) document.getElementById('newDesignTitle').value = "";
                if(document.getElementById('designFileInput')) document.getElementById('designFileInput').value = "";
                if(document.getElementById('designUrlInput')) document.getElementById('designUrlInput').value = "";

                checkViewState();
            })
            .catch((error) => {
                alert("    : " + error.message);
                if(status) status.innerText = "";
            });
        }
