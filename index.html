<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سكاي موبايل - منصة التصاميم والخدمات الفورية</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://sky-mobile-8e245-default-rtdb.firebaseio.com" crossorigin>

    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', system-ui, -apple-system, sans-serif; }
        body { background-color: #0b132b; color: #e0e6ed; min-height: 100vh; padding: 12px; display: flex; justify-content: center; }
        
        .app-container { width: 100%; max-width: 520px; background: #1c2541; border-radius: 20px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #2a385b; position: relative; }
        
        .ticker-wrap { background: #0b132b; border-radius: 10px; padding: 6px 12px; margin-bottom: 12px; overflow: hidden; border: 1px solid #3a506b; font-size: 12px; color: #4cc9f0; text-align: center; font-weight: bold; white-space: nowrap; }
        .ticker-move { display: inline-block; animation: marquee 15s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .brand-header { text-align: center; margin-bottom: 15px; cursor: pointer; }
        .brand-logo-svg { max-width: 280px; width: 100%; height: auto; }

        .nav-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .nav-card { background: #2a385b; border: 1px solid #3a506b; border-radius: 14px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s ease; }
        .nav-card:hover { background: #3a506b; transform: translateY(-2px); }
        .nav-card .icon { font-size: 26px; margin-bottom: 6px; display: block; }
        .nav-card .title { font-size: 13px; font-weight: 700; color: #ffffff; }

        .back-home-btn { width: 100%; background: #3a506b; color: #fff; border: none; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; margin-bottom: 12px; text-align: center; }

        .section-frame { background: #111827; border: 1px solid #1f2937; padding: 14px; border-radius: 14px; margin-bottom: 14px; }
        .frame-title { font-size: 13px; font-weight: bold; color: #4cc9f0; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        
        .client-input-card { margin-bottom: 10px; }
        .client-input-card label { display: block; font-size: 11px; font-weight: 700; color: #a0aec0; margin-bottom: 4px; }
        .client-input-card input, .client-input-card select, .client-input-card textarea { width: 100%; padding: 10px 12px; background: #1c2541; border: 1px solid #3a506b; border-radius: 8px; color: #fff; font-size: 13px; outline: none; }
        .client-input-card input:focus, .client-input-card select:focus, .client-input-card textarea:focus { border-color: #4cc9f0; }

        .categories-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; }
        .cat-chip { background: #2a385b; color: #a0aec0; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; white-space: nowrap; cursor: pointer; border: 1px solid transparent; }
        .cat-chip.active { background: #4361ee; color: #fff; border-color: #4cc9f0; }

        .templates-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; min-height: 85px; }
        .thumb-card { flex: 0 0 65px; height: 85px; border-radius: 8px; overflow: hidden; border: 2px solid #3a506b; cursor: pointer; background: #0b132b; display: flex; align-items: center; justify-content: center; font-size: 10px; text-align: center; color: #fff; padding: 2px; }
        .thumb-card.selected { border-color: #4cc9f0; box-shadow: 0 0 8px rgba(76, 201, 240, 0.6); }
        .thumb-card img { width: 100%; height: 100%; object-fit: cover; }

        .preview-box { background: #0b132b; border: 1px solid #3a506b; padding: 12px; border-radius: 14px; text-align: center; }
        #canvasContainer { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 12px; background: #000; }
        #previewCanvas { width: 100%; height: auto; display: block; }

        .action-links { display: flex; flex-direction: column; gap: 8px; }
        .link-btn { width: 100%; padding: 11px; border-radius: 10px; font-weight: bold; font-size: 13px; text-align: center; color: #fff; border: none; cursor: pointer; text-decoration: none; display: block; }
        .download-img-btn { background: #4361ee; }
        .whatsapp-share-btn { background: #25d366; }
        .copy-design-btn { background: #4cc9f0; color: #0b132b; }
        .save-db-btn { background: #7209b7; }

        .faq-accordion { display: flex; flex-direction: column; gap: 8px; }
        .faq-item { background: #1c2541; border: 1px solid #3a506b; border-radius: 8px; padding: 10px; font-size: 12px; }
        .faq-item summary { font-weight: bold; color: #4cc9f0; cursor: pointer; }
        .faq-content { margin-top: 8px; color: #cbd5e1; line-height: 1.5; }

        .admin-header { background: #4361ee; color: #fff; padding: 12px; border-radius: 10px; text-align: center; margin-bottom: 12px; }
        .admin-card { background: #111827; border: 1px solid #1f2937; padding: 12px; border-radius: 10px; margin-bottom: 12px; }
        .admin-card h3 { font-size: 13px; color: #4cc9f0; margin-bottom: 8px; }
        .btn-main { width: 100%; background: #4361ee; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-exit-admin { width: 100%; background: #f72585; color: #fff; border: none; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .item-list-table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: right; margin-top: 8px; }
        .item-list-table th, .item-list-table td { padding: 6px; border-bottom: 1px solid #1f2937; color: #e0e6ed; }
        .btn-delete-item { background: #f72585; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; }

        .client-credits-footer { margin-top: 15px; text-align: center; font-size: 11px; color: #64748b; font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-container" id="mainContainer"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNwIUGqA2dm5Mrx5S06LIEGPJ_VgW3eFc",
            authDomain: "sky-mobile-8e245.firebaseapp.com",
            databaseURL: "https://sky-mobile-8e245-default-rtdb.firebaseio.com",
            projectId: "sky-mobile-8e245",
            storageBucket: "sky-mobile-8e245.firebasestorage.app",
            messagingSenderId: "1066510361417",
            appId: "1:1066510361417:web:a5e17c7f3c8e267b1d3098"
        };

        let db = null;
        let secretClickCount = 0;

        const AppState = {
            activeViewSection: 'grid_main',
            currentAdminPass: 'sky2026',
            globalLinks: {
                appUrl: 'https://skymobile-v6jp.vercel.app',
                whatsappUrl: 'https://whatsapp.com/channel',
                supportPhone: '738328251',
                tickerText: '📢 أهلاً بكم في منصة سكاي موبايل - صانع الإعلانات وبطاقات الخدمات الفورية'
            },
            categories: [
                { id: 'cat_net', name: '📶 كروت الشبكات' },
                { id: 'cat_pay', name: '💳 التسديد والدفع الإلكتروني' }
            ],
            networkCodes: [
                { name: 'شبكة الماهر نت', code: '6' },
                { name: 'شبكة الفرسان', code: '1025' },
                { name: 'شبكة العاصمة', code: '5011' }
            ],
            defaultDesigns: [
                { id: 'tpl_1787201890667', title: 'إعلان كروت الواي فاي', mode: 'square', isGenerated: true, categoryId: 'cat_net' },
                { id: 'ds_dyn_2', title: 'إعلان تسديد وسداد رصيد', mode: 'banner', isGenerated: true, categoryId: 'cat_pay' }
            ],
            designs: [],
            activeCategory: 'all',
            searchQuery: '',
            currentDesignId: 'tpl_1787201890667',
            imageCache: {},
            loadedBaseImage: null,
            isDynamicCanvasMode: true,
            renderDebounceTimer: null
        };

        (function preDetectUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const tplId = urlParams.get('id') || urlParams.get('tpl') || urlParams.get('design');
            if (tplId) {
                AppState.activeViewSection = 'view_designer';
                AppState.currentDesignId = tplId;
            } else if (urlParams.has('view')) {
                AppState.activeViewSection = urlParams.get('view');
            }
        })();

        document.addEventListener('DOMContentLoaded', () => {
            AppState.designs = [...AppState.defaultDesigns];
            checkViewState();
            initFirebaseConnection();
        });

        function initFirebaseConnection() {
            let attempts = 0;
            const timer = setInterval(() => {
                attempts++;
                if (typeof firebase !== 'undefined') {
                    clearInterval(timer);
                    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                    db = firebase.database();
                    syncCloudDataOnce();
                }
                if (attempts > 30) clearInterval(timer);
            }, 50);
        }

        function syncCloudDataOnce() {
            if (!db) return;
            
            if (AppState.currentDesignId) {
                db.ref(`sky_data/user_saved_designs/${AppState.currentDesignId}`).once('value').then(snap => {
                    const saved = snap.val();
                    if (saved) {
                        applySavedDesignState(saved);
                    }
                });
            }

            db.ref('sky_data').once('value').then(snapshot => {
                const data = snapshot.val();
                if (data) {
                    if (data.categories) AppState.categories = Object.values(data.categories);
                    if (data.designs) {
                        const cloudDesigns = Object.values(data.designs);
                        AppState.designs = [...AppState.defaultDesigns, ...cloudDesigns];
                    }
                    if (data.networks) AppState.networkCodes = Object.values(data.networks);
                    if (data.links) AppState.globalLinks = { ...AppState.globalLinks, ...data.links };
                    if (data.adminPass) AppState.currentAdminPass = data.adminPass;
                }
                checkViewState();
            }).catch(() => {});
        }

        function checkViewState() {
            const container = document.getElementById('mainContainer');
            const inAdminMode = sessionStorage.getItem('sky_in_admin_mode') === 'true';
            const isAuthenticated = sessionStorage.getItem('sky_admin_authenticated') === 'true';

            if (inAdminMode) {
                if (isAuthenticated) {
                    renderAdminPanel(container);
                } else {
                    renderLoginForm(container);
                }
            } else {
                renderClientDashboard(container);
            }
        }

        function handleSecretLogoClick() {
            secretClickCount++;
            if (secretClickCount >= 5) {
                secretClickCount = 0;
                sessionStorage.setItem('sky_in_admin_mode', 'true');
                checkViewState();
            }
        }

        function switchView(sectionId) {
            AppState.activeViewSection = sectionId;
            if (sectionId === 'view_wifi') {
                const netDesign = AppState.designs.find(d => d.categoryId === 'cat_net');
                if (netDesign) AppState.currentDesignId = netDesign.id;
            }
            checkViewState();
        }

        function renderClientDashboard(container) {
            let showBack = AppState.activeViewSection !== 'grid_main';
            let dynamicBodyHtml = '';

            let networksOptionsHtml = `<option value="">-- اختر الشبكة من القائمة --</option>` + 
                AppState.networkCodes.map(n => `<option value="${n.code}" data-name="${n.name}">${n.name} (كود: ${n.code})</option>`).join('');

            if (AppState.activeViewSection === 'grid_main') {
                dynamicBodyHtml = `
                    <div class="nav-grid">
                        <div class="nav-card" onclick="switchView('view_designer')">
                            <span class="icon">🎨</span>
                            <span class="title">مصمم الإعلانات (النقاط)</span>
                        </div>
                        <div class="nav-card" onclick="switchView('view_wifi')">
                            <span class="icon">📶</span>
                            <span class="title">صانع إعلانات الشبكات</span>
                        </div>
                        <div class="nav-card" onclick="switchView('view_faq')">
                            <span class="icon">🛠️</span>
                            <span class="title">الدعم وتصحيح المشاكل</span>
                        </div>
                        <a href="${AppState.globalLinks.appUrl}" target="_blank" class="nav-card" style="text-decoration:none;">
                            <span class="icon">📲</span>
                            <span class="title">تحميل التطبيق</span>
                        </a>
                    </div>`;
            } else if (AppState.activeViewSection === 'view_designer') {
                dynamicBodyHtml = `
                    <div class="categories-scroll" id="catChipsContainer"></div>
                    <div class="client-input-card">
                        <input type="text" placeholder="🔍 بحث في التصاميم..." oninput="handleSearchInput(this.value)">
                    </div>
                    <div class="templates-scroll" id="templatesScrollContainer"></div>
                    
                    <div class="section-frame">
                        <div class="frame-title"><span>📝 بيانات العميل والعبارة الترويجية</span></div>
                        <div class="client-input-card">
                            <label>اسم المحل / الصفحة / المركز:</label>
                            <input type="text" id="clientShopInput" placeholder="مثال: مركز البركة للخدمات الإلكترونية" oninput="debouncedDraw()">
                        </div>
                        <div class="client-input-card">
                            <label>العبارة الرئيسية على التصميم:</label>
                            <input type="text" id="clientPromoText" placeholder="مثال: شحن فورى لجميع الشبكات - خدمات متكاملة" oninput="debouncedDraw()">
                        </div>
                        <div class="client-input-card">
                            <label>العبارة التوضيحية التابعة:</label>
                            <input type="text" id="clientSubText" placeholder="مثال: متوفر لدينا كروت واي فاي وتسديد الفواتير" oninput="debouncedDraw()">
                        </div>
                        <div class="client-input-card">
                            <label>رقم هاتف التواصل والخدمة:</label>
                            <input type="text" id="clientPhoneInput" value="${AppState.globalLinks.supportPhone}" oninput="debouncedDraw()">
                        </div>
                    </div>

                    <div class="section-frame">
                        <div class="frame-title"><span>🎨 تخصيص الألوان</span></div>
                        <div class="client-input-card">
                            <label>لون الخلفية / الإطار:</label>
                            <input type="color" id="colBg" value="#0c2461" onchange="debouncedDraw()">
                        </div>
                        <div class="client-input-card">
                            <label>لون النص الرئيسي:</label>
                            <input type="color" id="colText1" value="#ffffff" onchange="debouncedDraw()">
                        </div>
                        <div class="client-input-card">
                            <label>لون النص الثانوي:</label>
                            <input type="color" id="colText2" value="#00a8ff" onchange="debouncedDraw()">
                        </div>
                    </div>

                    <div class="preview-box">
                        <div id="canvasContainer"><canvas id="previewCanvas"></canvas></div>
                        <div class="action-links">
                            <button class="link-btn download-img-btn" onclick="downloadImage()">📥 تحميل التصميم</button>
                            <button class="link-btn whatsapp-share-btn" onclick="shareToWhatsApp()">📱 مشاركة عبر الواتساب</button>
                            <button class="link-btn copy-design-btn" onclick="copyDesignLink()">📋 نسخ رابط القالب المباشر</button>
                            <button class="link-btn save-db-btn" onclick="saveDesignToCloud()">☁️ حفظ التصميم بالسحابة</button>
                        </div>
                    </div>`;
            } else if (AppState.activeViewSection === 'view_wifi') {
                dynamicBodyHtml = `
                    <div class="section-frame">
                        <div class="frame-title"><span>🎨 اختار قالب تصميم إعلان الشبكة</span></div>
                        <div class="templates-scroll" id="wifiTemplatesScrollContainer"></div>
                    </div>

                    <div class="section-frame">
                        <div class="frame-title"><span>📶 بيانات إعلان كروت الشبكة</span></div>
                        <div class="client-input-card">
                            <label>اختر من قائمة الشبكات المسجلة:</label>
                            <select id="networkSelect" onchange="syncNetworkSelection(this)">
                                ${networksOptionsHtml}
                            </select>
                        </div>
                        <div class="client-input-card">
                            <label>أو أدخل رقم / كود الشبكة مباشرة (سيجلب الاسم تلقائياً):</label>
                            <input type="text" id="netCodeInput" placeholder="مثال: 6" oninput="handleNetCodeAutoLookup(this.value)">
                        </div>
                        <div class="client-input-card">
                            <label>اسم الشبكة:</label>
                            <input type="text" id="netNameInput" placeholder="مثال: شبكة الماهر نت" oninput="debouncedDraw()">
                        </div>
                        <div class="client-input-card">
                            <label>رقم هاتف التواصل والتزويد:</label>
                            <input type="text" id="clientPhoneInput" placeholder="738328251" value="${AppState.globalLinks.supportPhone}" oninput="debouncedDraw()">
                        </div>
                    </div>
                    
                    <div class="section-frame">
                        <div class="frame-title"><span>🎨 تخصيص الألوان</span></div>
                        <div class="client-input-card">
                            <label>لون الخلفية / الإطار:</label>
                            <input type="color" id="colBg" value="#0c2461" onchange="debouncedDraw()">
                        </div>
                        <div class="client-input-card">
                            <label>لون النص الرئيسي:</label>
                            <input type="color" id="colText1" value="#ffffff" onchange="debouncedDraw()">
                        </div>
                        <div class="client-input-card">
                            <label>لون النص الثانوي:</label>
                            <input type="color" id="colText2" value="#00a8ff" onchange="debouncedDraw()">
                        </div>
                    </div>

                    <div class="preview-box">
                        <div id="canvasContainer"><canvas id="previewCanvas"></canvas></div>
                        <div class="action-links">
                            <button class="link-btn download-img-btn" onclick="downloadImage()">📥 تحميل إعلان الشبكة</button>
                            <button class="link-btn whatsapp-share-btn" onclick="shareToWhatsApp()">📱 مشاركة عبر الواتساب</button>
                            <button class="link-btn copy-design-btn" onclick="copyDesignLink()">📋 نسخ رابط الإعلان</button>
                        </div>
                    </div>`;
            } else if (AppState.activeViewSection === 'view_faq') {
                dynamicBodyHtml = `
                    <div class="section-frame">
                        <div class="frame-title"><span>🛠️ أسئلة وأجوبة حل المشاكل الفنية</span></div>
                        <div class="faq-accordion">
                            <details class="faq-item">
                                <summary>فشل عملية الشحن أو الدفع في التطبيق؟</summary>
                                <div class="faq-content">تأكد من توفر تغطية إنترنت جيدة، وفي حال خصم المبلغ دون وصول الخدمة، قم بتزويد الدعم الفني برقم العملية المرجعي وسيتم التحقق منها فوراً.</div>
                            </details>
                            <details class="faq-item">
                                <summary>كيف يمكنني ربط وتفعيل شبكة الواي فاي في التطبيق؟</summary>
                                <div class="faq-content">قم بالتواصل مع الإدارة عبر الواتساب لتزويدنا باسم الشبكة والكود الخاص بها لإدراجها ضمن القائمة المعتمدة في النظام.</div>
                            </details>
                            <details class="faq-item">
                                <summary>نسيت كلمة المرور أو تم قفل الحساب؟</summary>
                                <div class="faq-content">استخدم خيار "نسيت كلمة المرور" في شاشة الدخول أو تواصل مباشرة مع قسم الدعم الفني لإعادة تعيين بياناتك.</div>
                            </details>
                        </div>
                    </div>`;
            }

            container.innerHTML = `
                <div class="ticker-wrap"><div class="ticker-move">${AppState.globalLinks.tickerText}</div></div>
                <div class="brand-header">
                    <div class="brand-logo-wrapper" onclick="handleSecretLogoClick()">
                        <svg class="brand-logo-svg" viewBox="0 0 400 90" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#0c2461"/>
                                    <stop offset="50%" stop-color="#0a3d62"/>
                                    <stop offset="100%" stop-color="#00a8ff"/>
                                </linearGradient>
                            </defs>
                            <rect width="400" height="90" rx="15" fill="url(#skyGrad)"/>
                            <text x="200" y="42" font-family="'Cairo', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">سكاي موبايل</text>
                            <text x="200" y="68" font-family="'Cairo', sans-serif" font-weight="600" font-size="13" fill="#00a8ff" text-anchor="middle">SKY MOBILE SERVICES</text>
                        </svg>
                    </div>
                </div>
                ${showBack ? `<button class="back-home-btn" onclick="switchView('grid_main')">⬅ العودة للرئيسية</button>` : ''}
                ${dynamicBodyHtml}
                <div class="client-credits-footer">جميع الحقوق محفوظة © سكاي موبايل 2026</div>
            `;

            if (AppState.activeViewSection === 'view_designer') {
                renderCategoriesChips();
                renderClientThumbnails(AppState.currentDesignId);
                const targetDesign = AppState.designs.find(d => d.id == AppState.currentDesignId) || AppState.designs[0];
                if (targetDesign) loadSelectedDesign(targetDesign);
            } else if (AppState.activeViewSection === 'view_wifi') {
                renderWifiThumbnails(AppState.currentDesignId);
                const targetDesign = AppState.designs.find(d => d.id == AppState.currentDesignId) || AppState.designs[0];
                if (targetDesign) loadSelectedDesign(targetDesign);
            }
        }

        function handleNetCodeAutoLookup(val) {
            const codeClean = val.trim();
            const foundNet = AppState.networkCodes.find(n => n.code.toString().trim() === codeClean);
            
            const nameInput = document.getElementById('netNameInput');
            const selectEl = document.getElementById('networkSelect');
            
            if (foundNet) {
                if (nameInput) nameInput.value = foundNet.name;
                if (selectEl) selectEl.value = foundNet.code;
            } else {
                if (selectEl) selectEl.value = "";
            }
            debouncedDraw();
        }

        function handleSearchInput(val) {
            AppState.searchQuery = val.trim().toLowerCase();
            renderClientThumbnails(AppState.currentDesignId);
        }

        function renderCategoriesChips() {
            const container = document.getElementById('catChipsContainer');
            if (!container) return;
            let html = `<div class="cat-chip ${AppState.activeCategory === 'all' ? 'active' : ''}" onclick="filterCategory('all')">الكل</div>`;
            AppState.categories.forEach(c => {
                html += `<div class="cat-chip ${AppState.activeCategory === c.id ? 'active' : ''}" onclick="filterCategory('${c.id}')">${c.name}</div>`;
            });
            container.innerHTML = html;
        }

        function filterCategory(catId) {
            AppState.activeCategory = catId;
            renderCategoriesChips();
            renderClientThumbnails(AppState.currentDesignId);
        }

        function renderClientThumbnails(selectedId) {
            const container = document.getElementById('templatesScrollContainer');
            if (!container) return;
            let filtered = AppState.designs;
            if (AppState.activeCategory !== 'all') {
                filtered = filtered.filter(d => d.categoryId === AppState.activeCategory);
            }
            if (AppState.searchQuery) {
                filtered = filtered.filter(d => d.title.toLowerCase().includes(AppState.searchQuery));
            }

            container.innerHTML = '';
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = `thumb-card ${item.id == selectedId ? 'selected' : ''}`;
                card.onclick = () => {
                    AppState.currentDesignId = item.id;
                    renderClientThumbnails(item.id);
                    loadSelectedDesign(item);
                };
                if (item.isGenerated) {
                    card.innerHTML = `<span>${item.title}</span>`;
                } else {
                    card.innerHTML = `<img src="${item.image}" alt="${item.title}" loading="lazy">`;
                }
                container.appendChild(card);
            });
        }

        function renderWifiThumbnails(selectedId) {
            const container = document.getElementById('wifiTemplatesScrollContainer');
            if (!container) return;
            let wifiDesigns = AppState.designs.filter(d => d.categoryId === 'cat_net' || d.isGenerated);

            container.innerHTML = '';
            wifiDesigns.forEach(item => {
                const card = document.createElement('div');
                card.className = `thumb-card ${item.id == selectedId ? 'selected' : ''}`;
                card.onclick = () => {
                    AppState.currentDesignId = item.id;
                    renderWifiThumbnails(item.id);
                    loadSelectedDesign(item);
                };
                if (item.isGenerated) {
                    card.innerHTML = `<span>${item.title}</span>`;
                } else {
                    card.innerHTML = `<img src="${item.image}" alt="${item.title}" loading="lazy">`;
                }
                container.appendChild(card);
            });
        }

        function loadSelectedDesign(designObj) {
            if (designObj.isGenerated) {
                AppState.isDynamicCanvasMode = true;
                AppState.loadedBaseImage = null;
                debouncedDraw();
            } else {
                AppState.isDynamicCanvasMode = false;
                if (AppState.imageCache[designObj.image]) {
                    AppState.loadedBaseImage = AppState.imageCache[designObj.image];
                    debouncedDraw();
                } else {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.src = designObj.image;
                    img.onload = () => {
                        AppState.imageCache[designObj.image] = img;
                        AppState.loadedBaseImage = img;
                        debouncedDraw();
                    };
                }
            }
        }

        function syncNetworkSelection(selectEl) {
            const selectedOpt = selectEl.options[selectEl.selectedIndex];
            const netName = selectedOpt.getAttribute('data-name') || '';
            const netCode = selectEl.value || '';
            
            const nameInput = document.getElementById('netNameInput');
            const codeInput = document.getElementById('netCodeInput');
            
            if (nameInput) nameInput.value = netName;
            if (codeInput) codeInput.value = netCode;
            debouncedDraw();
        }

        function debouncedDraw() {
            clearTimeout(AppState.renderDebounceTimer);
            AppState.renderDebounceTimer = setTimeout(drawCanvas, 30);
        }

        function drawCanvas() {
            const canvas = document.getElementById('previewCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            const colBg = document.getElementById('colBg')?.value || '#0c2461';
            const colText1 = document.getElementById('colText1')?.value || '#ffffff';
            const colText2 = document.getElementById('colText2')?.value || '#00a8ff';

            const currentObj = AppState.designs.find(d => d.id == AppState.currentDesignId) || AppState.defaultDesigns[0];

            if (AppState.isDynamicCanvasMode || !AppState.loadedBaseImage) {
                const isSquare = currentObj.mode === 'square';
                canvas.width = 1000;
                canvas.height = isSquare ? 1000 : 600;

                // الخلفية
                ctx.fillStyle = colBg;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // الإطار
                ctx.strokeStyle = colText2;
                ctx.lineWidth = 12;
                ctx.strokeRect(18, 18, canvas.width - 36, canvas.height - 36);

                if (AppState.activeViewSection === 'view_wifi') {
                    const netName = document.getElementById('netNameInput')?.value || 'شبكة الواي فاي';
                    const netCode = document.getElementById('netCodeInput')?.value || '';
                    const phoneVal = document.getElementById('clientPhoneInput')?.value || AppState.globalLinks.supportPhone;

                    // رسم شريط أفقـي أنيق بالمنتصف الأعلى لاسم الشبكة والكود
                    const badgeWidth = 720;
                    const badgeHeight = 90;
                    const badgeX = (canvas.width - badgeWidth) / 2;
                    const badgeY = 90;

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                    ctx.beginPath();
                    ctx.roundRect(badgeX, badgeY, badgeWidth, badgeHeight, 16);
                    ctx.fill();
                    ctx.strokeStyle = colText2;
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // نص اسم الشبكة مع رقمها في شريط أنيق موحد
                    ctx.textAlign = 'center';
                    ctx.fillStyle = colText1;
                    ctx.font = 'bold 38px Cairo';
                    const fullNetTitle = netCode ? `${netName}  |  رقم الشبكة: ${netCode}` : netName;
                    ctx.fillText(fullNetTitle, canvas.width / 2, badgeY + 58);

                    // أسفل التصميم: معلومات التواصل والتطبيق
                    ctx.fillStyle = colText2;
                    ctx.font = 'bold 32px Cairo';
                    ctx.fillText(`للتواصل والتزويد: ${phoneVal}`, canvas.width / 2, canvas.height - 110);

                    ctx.fillStyle = '#4cc9f0';
                    ctx.font = 'bold 28px Cairo';
                    ctx.fillText('يمكنكم شراء كروت الشبكة عبر تطبيق سكاي موبايل', canvas.width / 2, canvas.height - 55);

                } else {
                    const shopName = document.getElementById('clientShopInput')?.value || 'مركز الخدمة للشحن الإلكتروني';
                    const promoText = document.getElementById('clientPromoText')?.value || 'شحن فورى وسداد كافة الشبكات والخدمات';
                    const subText = document.getElementById('clientSubText')?.value || 'يمن موبايل - سبأفون - يو - واي - فواتير';
                    const phoneVal = document.getElementById('clientPhoneInput')?.value || AppState.globalLinks.supportPhone;

                    ctx.textAlign = 'center';
                    ctx.fillStyle = colText2;
                    ctx.font = 'bold 44px Cairo';
                    ctx.fillText(shopName, canvas.width / 2, 130);

                    ctx.fillStyle = '#f72585';
                    ctx.font = 'bold 30px Cairo';
                    ctx.fillText('نقطة بيع معتمد لتطبيق سكاي موبايل', canvas.width / 2, 195);

                    ctx.fillStyle = colText1;
                    ctx.font = 'bold 34px Cairo';
                    ctx.fillText(promoText, canvas.width / 2, 290);

                    ctx.fillStyle = '#4cc9f0';
                    ctx.font = '26px Cairo';
                    ctx.fillText(subText, canvas.width / 2, 360);

                    ctx.fillStyle = colText1;
                    ctx.font = 'bold 32px Cairo';
                    ctx.fillText(`للتواصل والتسديد: ${phoneVal}`, canvas.width / 2, canvas.height - 60);
                }

            } else {
                // رسم القوالب المرفوعة كصورة من لوحة التحكم
                const img = AppState.loadedBaseImage;
                canvas.width = img.naturalWidth || 1000;
                canvas.height = img.naturalHeight || 600;

                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                if (AppState.activeViewSection === 'view_wifi') {
                    const netName = document.getElementById('netNameInput')?.value || 'شبكة الواي فاي';
                    const netCode = document.getElementById('netCodeInput')?.value || '';
                    const phoneVal = document.getElementById('clientPhoneInput')?.value || AppState.globalLinks.supportPhone;

                    const bannerHeight = 85;
                    ctx.fillStyle = 'rgba(11, 19, 43, 0.88)';
                    ctx.fillRect(0, canvas.height - bannerHeight, canvas.width, bannerHeight);

                    ctx.fillStyle = '#00a8ff';
                    ctx.fillRect(0, canvas.height - bannerHeight, canvas.width, 3);

                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 22px Cairo';
                    const fullLabel = netCode ? `${netName} (رقم الشبكة: ${netCode})` : netName;
                    ctx.fillText(fullLabel, canvas.width / 2, canvas.height - 50);

                    ctx.fillStyle = '#4cc9f0';
                    ctx.font = 'bold 18px Cairo';
                    ctx.fillText(`للتواصل والتزويد: ${phoneVal} - متوفرة عبر تطبيق سكاي موبايل`, canvas.width / 2, canvas.height - 18);

                } else {
                    const shopName = document.getElementById('clientShopInput')?.value;
                    const phoneVal = document.getElementById('clientPhoneInput')?.value || AppState.globalLinks.supportPhone;

                    if (shopName) {
                        const bannerHeight = 85;
                        ctx.fillStyle = 'rgba(11, 19, 43, 0.82)';
                        ctx.fillRect(0, canvas.height - bannerHeight, canvas.width, bannerHeight);

                        ctx.fillStyle = '#00a8ff';
                        ctx.fillRect(0, canvas.height - bannerHeight, canvas.width, 3);

                        ctx.textAlign = 'center';
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 22px Cairo';
                        ctx.fillText(`${shopName}  |  للتواصل: ${phoneVal}`, canvas.width / 2, canvas.height - 48);

                        ctx.fillStyle = '#f72585';
                        ctx.font = 'bold 21px Cairo';
                        ctx.fillText('نقطة بيع معتمد لتطبيق سكاي موبايل', canvas.width / 2, canvas.height - 16);
                    }
                }
            }
        }

        function downloadImage() {
            const canvas = document.getElementById('previewCanvas');
            if (!canvas) return;
            const link = document.createElement('a');
            link.download = `sky_design_${AppState.currentDesignId}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function shareToWhatsApp() {
            const text = encodeURIComponent(`شاهد هذا التصميم من منصة سكاي موبايل:\n${window.location.origin}${window.location.pathname}?id=${AppState.currentDesignId}`);
            window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
        }

        function copyDesignLink() {
            const shareableUrl = `${window.location.origin}${window.location.pathname}?id=${AppState.currentDesignId}`;
            navigator.clipboard.writeText(shareableUrl).then(() => {
                alert('تم نسخ رابط القالب المباشر بنجاح!');
            });
        }

        function saveDesignToCloud() {
            if (!db) return alert('جارٍ الاتصال بالسحابة... يرجى الانتظار');
            const designRef = db.ref('sky_data/user_saved_designs').push();
            const payload = {
                baseDesignId: AppState.currentDesignId,
                clientShop: document.getElementById('clientShopInput')?.value || '',
                clientPromo: document.getElementById('clientPromoText')?.value || '',
                clientSub: document.getElementById('clientSubText')?.value || '',
                netName: document.getElementById('netNameInput')?.value || '',
                netCode: document.getElementById('netCodeInput')?.value || '',
                clientPhone: document.getElementById('clientPhoneInput')?.value || '',
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };
            designRef.set(payload).then(() => {
                const shareableUrl = `${window.location.origin}${window.location.pathname}?id=${designRef.key}`;
                navigator.clipboard.writeText(shareableUrl);
                alert(`تم حفظ التصميم بالسحابة بنجاح!\nتم نسخ الرابط المباشر:\n${shareableUrl}`);
            });
        }

        function applySavedDesignState(savedData) {
            setTimeout(() => {
                if (savedData.baseDesignId) AppState.currentDesignId = savedData.baseDesignId;
                
                const shopIn = document.getElementById('clientShopInput');
                const promoIn = document.getElementById('clientPromoText');
                const subIn = document.getElementById('clientSubText');
                const nameIn = document.getElementById('netNameInput');
                const codeIn = document.getElementById('netCodeInput');
                const phoneIn = document.getElementById('clientPhoneInput');

                if (shopIn && savedData.clientShop) shopIn.value = savedData.clientShop;
                if (promoIn && savedData.clientPromo) promoIn.value = savedData.clientPromo;
                if (subIn && savedData.clientSub) subIn.value = savedData.clientSub;
                if (nameIn && savedData.netName) nameIn.value = savedData.netName;
                if (codeIn && savedData.netCode) codeIn.value = savedData.netCode;
                if (phoneIn && savedData.clientPhone) phoneIn.value = savedData.clientPhone;
                
                debouncedDraw();
            }, 100);
        }

        function renderLoginForm(container) {
            container.innerHTML = `
                <div class="admin-header"><h2>🔐 تسجيل دخول الأدمن</h2></div>
                <div class="admin-card">
                    <div class="client-input-card">
                        <label>كلمة المرور:</label>
                        <input type="password" id="adminPassInput" placeholder="أدخل كلمة مرور الإدارة">
                    </div>
                    <button class="btn-main" onclick="processLogin()">دخول</button>
                    <button class="btn-exit-admin" style="margin-top:10px;" onclick="exitAdminView()">إلغاء والعودة</button>
                </div>`;
        }

        function processLogin() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === AppState.currentAdminPass) {
                sessionStorage.setItem('sky_admin_authenticated', 'true');
                checkViewState();
            } else {
                alert('كلمة المرور غير صحيحة!');
            }
        }

        function exitAdminView() {
            sessionStorage.removeItem('sky_in_admin_mode');
            sessionStorage.removeItem('sky_admin_authenticated');
            checkViewState();
        }

        function renderAdminPanel(container) {
            let designsRows = AppState.designs.map((d, index) => `
                <tr>
                    <td>${d.title}</td>
                    <td>${d.categoryId}</td>
                    <td><button class="btn-delete-item" onclick="deleteAdminDesign(${index})">حذف</button></td>
                </tr>`).join('');

            let netRows = AppState.networkCodes.map((n, index) => `
                <tr>
                    <td>${n.name}</td>
                    <td>${n.code}</td>
                    <td><button class="btn-delete-item" onclick="deleteAdminNetwork(${index})">حذف</button></td>
                </tr>`).join('');

            container.innerHTML = `
                <div class="admin-header"><h2>⚙️ لوحة تحكم الأدمن المتقدمة</h2></div>
                <button class="btn-exit-admin" onclick="exitAdminView()">🚪 الخروج من لوحة الأدمن</button>
                
                <div class="admin-card">
                    <h3>📢 إدارة الشريط الترويجي</h3>
                    <div class="client-input-card">
                        <label>نص الشريط المتحرك:</label>
                        <input type="text" id="admTickerInput" value="${AppState.globalLinks.tickerText}">
                    </div>
                    <button class="btn-main" onclick="saveAdminTicker()">حفظ الشريط الترويجي</button>
                </div>

                <div class="admin-card">
                    <h3>🔗 إدارة الروابط والدعم الفني</h3>
                    <div class="client-input-card">
                        <label>رابط تحميل التطبيق:</label>
                        <input type="text" id="admAppUrl" value="${AppState.globalLinks.appUrl}">
                    </div>
                    <div class="client-input-card">
                        <label>رابط قناة الواتساب:</label>
                        <input type="text" id="admWhatsappUrl" value="${AppState.globalLinks.whatsappUrl}">
                    </div>
                    <div class="client-input-card">
                        <label>رقم هاتف الدعم الفني:</label>
                        <input type="text" id="admSupportPhone" value="${AppState.globalLinks.supportPhone}">
                    </div>
                    <button class="btn-main" onclick="saveAdminLinks()">حفظ الروابط</button>
                </div>

                <div class="admin-card">
                    <h3>🔑 تغيير كلمة مرور الأدمن</h3>
                    <div class="client-input-card">
                        <label>كلمة المرور الجديدة:</label>
                        <input type="password" id="admNewPass" placeholder="أدخل كلمة المرور الجديدة">
                    </div>
                    <button class="btn-main" onclick="saveAdminPassword()">تحديث كلمة المرور</button>
                </div>

                <div class="admin-card">
                    <h3>🎨 إدارة قوالب التصاميم (إضافة)</h3>
                    <div class="client-input-card"><label>عنوان التصميم:</label><input type="text" id="admDesignTitle"></div>
                    <div class="client-input-card"><label>رابط الصورة المباشر:</label><input type="text" id="admDesignImg"></div>
                    <div class="client-input-card">
                        <label>القسم:</label>
                        <select id="admDesignCat">
                            ${AppState.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                        </select>
                    </div>
                    <button class="btn-main" onclick="addAdminDesign()">حفظ التصميم</button>
                </div>

                <div class="admin-card">
                    <h3>📋 قوالب التصاميم الحالية</h3>
                    <table class="item-list-table">
                        <thead><tr><th>العنوان</th><th>القسم</th><th>إجراء</th></tr></thead>
                        <tbody>${designsRows}</tbody>
                    </table>
                </div>

                <div class="admin-card">
                    <h3>📡 إضافة شبكة واي فاي جديدة</h3>
                    <div class="client-input-card"><label>اسم الشبكة:</label><input type="text" id="admNetName"></div>
                    <div class="client-input-card"><label>رقم/كود الشبكة:</label><input type="text" id="admNetCode"></div>
                    <button class="btn-main" onclick="addAdminNetwork()">إضافة الشبكة</button>
                </div>

                <div class="admin-card">
                    <h3>📡 الشبكات المسجلة</h3>
                    <table class="item-list-table">
                        <thead><tr><th>الاسم</th><th>الكود</th><th>إجراء</th></tr></thead>
                        <tbody>${netRows}</tbody>
                    </table>
                </div>`;
        }

        function saveAdminTicker() {
            const val = document.getElementById('admTickerInput').value.trim();
            if (!val) return alert('يرجى إدخال نص الشريط!');
            AppState.globalLinks.tickerText = val;
            if (db) db.ref('sky_data/links/tickerText').set(val);
            alert('تم حفظ الشريط الترويجي بنجاح!');
        }

        function saveAdminLinks() {
            const appUrl = document.getElementById('admAppUrl').value.trim();
            const whatsappUrl = document.getElementById('admWhatsappUrl').value.trim();
            const supportPhone = document.getElementById('admSupportPhone').value.trim();

            AppState.globalLinks.appUrl = appUrl;
            AppState.globalLinks.whatsappUrl = whatsappUrl;
            AppState.globalLinks.supportPhone = supportPhone;

            if (db) db.ref('sky_data/links').update({ appUrl, whatsappUrl, supportPhone });
            alert('تم حفظ الروابط بنجاح!');
        }

        function saveAdminPassword() {
            const newPass = document.getElementById('admNewPass').value.trim();
            if (!newPass) return alert('يرجى إدخال كلمة المرور الجديدة!');
            
            AppState.currentAdminPass = newPass;
            if (db) db.ref('sky_data/adminPass').set(newPass);
            alert('تم تغيير كلمة المرور بنجاح!');
            document.getElementById('admNewPass').value = '';
        }

        function addAdminDesign() {
            const title = document.getElementById('admDesignTitle').value;
            const image = document.getElementById('admDesignImg').value;
            const categoryId = document.getElementById('admDesignCat').value;
            if (!title || !image) return alert('يرجى ملء جميع الحقول!');

            const newObj = { id: `ds_${Date.now()}`, title, image, categoryId };
            AppState.designs.push(newObj);
            if (db) db.ref('sky_data/designs').set(AppState.designs.filter(d => !d.isGenerated));
            renderAdminPanel(document.getElementById('mainContainer'));
        }

        function deleteAdminDesign(index) {
            AppState.designs.splice(index, 1);
            if (db) db.ref('sky_data/designs').set(AppState.designs.filter(d => !d.isGenerated));
            renderAdminPanel(document.getElementById('mainContainer'));
        }

        function addAdminNetwork() {
            const name = document.getElementById('admNetName').value;
            const code = document.getElementById('admNetCode').value;
            if (!name || !code) return alert('يرجى ملء جميع الحقول!');

            AppState.networkCodes.push({ name, code });
            if (db) db.ref('sky_data/networks').set(AppState.networkCodes);
            renderAdminPanel(document.getElementById('mainContainer'));
        }

        function deleteAdminNetwork(index) {
            AppState.networkCodes.splice(index, 1);
            if (db) db.ref('sky_data/networks').set(AppState.networkCodes);
            renderAdminPanel(document.getElementById('mainContainer'));
        }
    </script>
</body>
</html>
