<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f0f2f5">
    <meta name="color-scheme" content="light">
    <title>سكاي موبايل - مصمم البطاقات</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        html, body { background-color: #f0f2f5 !important; color: #333; padding: 10px; margin: 0; min-height: 100vh; -webkit-text-size-adjust: 100%; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .admin-header { background: #007bff; color: white; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .admin-header h2 { font-size: 20px; }
        .top-nav-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-home { flex: 1; background-color: #28a745; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; font-size: 14px; display: inline-block; }
        .btn-logout { flex: 1; background-color: #ff4d4d; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; font-size: 14px; }
        .admin-tabs-bar { display: flex; gap: 5px; margin-bottom: 20px; background: #e9ecef; padding: 5px; border-radius: 12px; overflow-x: auto; }
        .tab-btn { flex: 1; min-width: 65px; background: transparent; border: none; padding: 10px 5px; border-radius: 8px; font-weight: bold; font-size: 11px; cursor: pointer; text-align: center; color: #495057; transition: 0.2s; white-space: nowrap; }
        .tab-btn.active { background: #007bff; color: white; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #495057; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 10px; font-size: 14px; background: #fff; }
        .btn-main { background-color: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-main:disabled { background-color: #6c757d; cursor: not-allowed; }
        .categories-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
        .cat-chip { background: #fff; border: 1px solid #ced4da; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; color: #495057; }
        .cat-chip.active { background: #007bff; color: #fff; border-color: #007bff; }
        .templates-preview-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; min-height: 95px; }
        .thumb-card { flex: 0 0 75px; height: 95px; border-radius: 8px; overflow: hidden; border: 2px solid #ced4da; cursor: pointer; background: #e9ecef; position: relative; }
        .thumb-card.selected { border-color: #007bff; transform: scale(1.03); }
        .thumb-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .dropzone-box { display: block; border: 2px dashed #007bff; background: #f8f9fa; padding: 20px 15px; border-radius: 12px; text-align: center; cursor: pointer; margin-bottom: 15px; font-size: 14px; font-weight: bold; color: #007bff; }
        .preview-box { background: #fff; border: 1px solid #e9ecef; padding: 15px; border-radius: 14px; margin-top: 15px; }
        #canvasContainer { position: relative; width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 15px; border: 1px solid #e9ecef; background: #000; text-align: center; }
        #previewCanvas { width: 100%; height: auto; display: block; }
        #outputImage { width: 100%; height: auto; display: none; border-radius: 10px; }
        .action-links { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .link-btn { display: block; width: 100%; padding: 13px; border-radius: 10px; font-weight: bold; font-size: 14px; text-align: center; color: white; border: none; cursor: pointer; text-decoration: none; }
        .download-img-btn { background-color: #007bff; }
        .copy-link-btn { background-color: #6f42c1; }
        .store-link-btn { background-color: #17a2b8; }
        .whatsapp-channel-btn { background-color: #128c7e; }
        .client-credits-footer { margin-top: 20px; padding-top: 12px; border-top: 1px solid #e9ecef; text-align: center; font-size: 12px; color: #6c757d; font-weight: 600; }
        .admin-card { background: #fff; border: 1px solid #e9ecef; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .sub-img-list { font-size: 13px; color: #555; margin: 8px 0; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .btn-delete { background-color: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .error-text { color: #dc3545; font-size: 12px; margin-top: 5px; display: none; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNwIUGqA2dm5Mrx5S06LIEGPJ_VgW3eFc",
            authDomain: "sky-mobile-8e245.firebaseapp.com",
            databaseURL: "https://sky-mobile-8e245-default-rtdb.firebaseio.com",
            projectId: "sky-mobile-8e245",
            storageBucket: "sky-mobile-8e245.firebasestorage.app",
            messagingSenderId: "1066510361417",
            appId: "1:1066510361417:web:a5e17c7f3c8e267b1d3098",
            measurementId: "G-PWC1MKDL56"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let masterPassword = "sky2026"; 

        let defaultCategories = [
            { id: 'cat_net', name: '📶 الشبكات' },
            { id: 'cat_events', name: '🎉 المناسبات' },
            { id: 'cat_custom', name: '⭐ تصاميم باسم العميل' },
            { id: 'cat_friday', name: '🕌 جمعة مباركة' }
        ];

        let categories = JSON.parse(localStorage.getItem('sky_cached_cats')) || defaultCategories;
        let designs = JSON.parse(localStorage.getItem('sky_cached_designs')) || [];
        
        const imageCache = {};

        let globalLinks = {
            appUrl: 'https://play.google.com/store/apps/details?id=com.skymobile.app',
            whatsappUrl: 'https://whatsapp.com/channel/YOUR_CHANNEL_LINK'
        };

        let activeAdminTab = 'templates'; 
        let activeCategory = 'all'; 
        let selectedDesignId = null;
        let uploadedImageBase64 = null;

        window.addEventListener('DOMContentLoaded', () => {
            preloadImagesInMemory();
            checkRoute();
        });

        db.ref('appData').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.categories) {
                    categories = Object.values(data.categories);
                    localStorage.setItem('sky_cached_cats', JSON.stringify(categories));
                }
                if (data.designs) {
                    designs = Object.values(data.designs);
                    localStorage.setItem('sky_cached_designs', JSON.stringify(designs));
                }
                if (data.links) globalLinks = data.links;
                if (data.masterPassword) masterPassword = data.masterPassword;
            }
            preloadImagesInMemory();
            checkRoute();
        });

        function preloadImagesInMemory() {
            designs.forEach(d => {
                if (d.image && !imageCache[d.id]) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.src = d.image;
                    imageCache[d.id] = img;
                }
            });
        }

        function checkRoute() {
            const container = document.getElementById('mainContainer');
            if (!container) return;

            const urlParams = new URLSearchParams(window.location.search);
            const isAdminRoute = urlParams.get('admin') === 'true' || window.location.search.includes('admin=true');
            const isPreviewRoute = urlParams.get('preview') === 'true';
            const isLogged = sessionStorage.getItem('sky_admin_logged') === 'true';

            if (isPreviewRoute) {
                renderClientPanel(container, true);
            } else if (isAdminRoute) {
                if (isLogged) {
                    renderAdminPanel(container);
                } else {
                    renderLoginBox(container);
                }
            } else {
                renderClientPanel(container, false);
            }
        }

        function renderLoginBox(container) {
            container.innerHTML = `
                <div class="admin-header">
                    <h2>🔑 تسجيل دخول الأدمن</h2>
                </div>
                <div class="form-group">
                    <label>أدخل كلمة المرور اللوحة:</label>
                    <input type="password" id="adminPassInput" placeholder="أدخل كلمة المرور هنا" onkeyup="if(event.key==='Enter') handleAdminLogin()">
                    <p class="error-text" id="loginError">كلمة المرور غير صحيحة، حاول مجدداً</p>
                </div>
                <button class="btn-main" onclick="handleAdminLogin()">دخول لوحة التحكم</button>
                <div style="text-align: center; margin-top: 15px;">
                    <a href="?" style="color: #007bff; text-decoration: none; font-size: 13px; font-weight: bold;">العودة لصفحة الزوار</a>
                </div>
            `;
        }

        function handleAdminLogin() {
            const passInput = document.getElementById('adminPassInput');
            const errorElem = document.getElementById('loginError');
            if (!passInput) return;

            const inputVal = passInput.value.trim();

            if (inputVal === masterPassword || inputVal === "sky2026") {
                sessionStorage.setItem('sky_admin_logged', 'true');
                renderAdminPanel(document.getElementById('mainContainer'));
            } else {
                if (errorElem) errorElem.style.display = 'block';
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('sky_admin_logged');
            window.location.href = "?admin=true";
        }

        function renderAdminPanel(container) {
            container.innerHTML = `
                <div class="top-nav-buttons">
                    <a href="?preview=true" class="btn-home">👁️ معاينة واجهة الزوار</a>
                    <button class="btn-logout" onclick="logoutAdmin()">🔒 تسجيل الخروج</button>
                </div>
                <div class="admin-header">
                    <h2>لوحة التحكم السحابية</h2>
                </div>
                
                <div class="admin-tabs-bar">
                    <button class="tab-btn ${activeAdminTab==='templates'?'active':''}" onclick="switchAdminTab('templates')">🖼️ التصاميم</button>
                    <button class="tab-btn ${activeAdminTab==='manage'?'active':''}" onclick="switchAdminTab('manage')">📂 إدارة</button>
                    <button class="tab-btn ${activeAdminTab==='cats'?'active':''}" onclick="switchAdminTab('cats')">📁 الأقسام</button>
                    <button class="tab-btn ${activeAdminTab==='settings'?'active':''}" onclick="switchAdminTab('settings')">🔑 كلمة المرور</button>
                </div>

                <div id="adminTabContent"></div>
            `;
            renderAdminTabContent();
        }

        function switchAdminTab(tab) {
            activeAdminTab = tab;
            renderAdminPanel(document.getElementById('mainContainer'));
        }

        function renderAdminTabContent() {
            const contentDiv = document.getElementById('adminTabContent');
            if (!contentDiv) return;

            if (activeAdminTab === 'templates') {
                let catOptions = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                contentDiv.innerHTML = `
                    <div class="admin-card">
                        <h3 style="font-size:16px; margin-bottom:12px;">إضافة تصميم جديد</h3>
                        <div class="form-group">
                            <label>اختر القسم:</label>
                            <select id="newDesignCat">${catOptions}</select>
                        </div>
                        <label class="dropzone-box" for="fileInput">
                            <span id="uploadStatusText">📁 اضغط هنا لاختيار صورة التصميم</span>
                            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImageFile(this)">
                        </label>
                        <button class="btn-main" id="btnSaveDesign" onclick="saveDesign()" disabled>💾 حفظ ونشر التصميم</button>
                    </div>
                `;
            } else if (activeAdminTab === 'manage') {
                let listHtml = designs.map(d => {
                    let cat = categories.find(c => c.id === d.categoryId);
                    return `
                        <div class="sub-img-list">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <img src="${d.image}" style="width:40px; height:40px; object-fit:cover; border-radius:6px;">
                                <span>${cat ? cat.name : 'بدون قسم'}</span>
                            </div>
                            <button class="btn-delete" onclick="deleteDesign('${d.id}')">حذف</button>
                        </div>
                    `;
                }).join('');
                contentDiv.innerHTML = `<div class="admin-card"><h3 style="font-size:16px; margin-bottom:12px;">التصاميم المرفوعة حالياً (${designs.length})</h3>${listHtml || '<p style="font-size:12px; color:#999;">لا توجد تصاميم مرفوعة حالياً</p>'}</div>`;
            } else if (activeAdminTab === 'cats') {
                let catList = categories.map(c => `
                    <div class="sub-img-list">
                        <span>${c.name}</span>
                        <button class="btn-delete" onclick="deleteCategory('${c.id}')">حذف</button>
                    </div>
                `).join('');
                contentDiv.innerHTML = `
                    <div class="admin-card">
                        <h3 style="font-size:16px; margin-bottom:12px;">إضافة قسم جديد</h3>
                        <div class="form-group">
                            <input type="text" id="newCatName" placeholder="اسم القسم">
                        </div>
                        <button class="btn-main" onclick="addCategory()">➕ إضافة القسم</button>
                    </div>
                    <div class="admin-card">
                        <h3 style="font-size:16px; margin-bottom:12px;">الأقسام الحالية</h3>
                        ${catList}
                    </div>
                `;
            } else if (activeAdminTab === 'settings') {
                contentDiv.innerHTML = `
                    <div class="admin-card">
                        <h3 style="font-size:16px; margin-bottom:12px;">تغيير كلمة مرور لوحة التحكم</h3>
                        <div class="form-group">
                            <input type="password" id="newMasterPass" placeholder="كلمة المرور الجديدة">
                        </div>
                        <button class="btn-main" onclick="changePassword()">💾 حفظ كلمة المرور</button>
                    </div>
                `;
            }
        }

        // 🛠️ دالة ضغط الصور فور الاختيار من المعرض
        function handleImageFile(input) {
            if (input.files && input.files[0]) {
                const statusText = document.getElementById('uploadStatusText');
                statusText.innerText = "⏳ جاري ضغط وتجهيز الصورة...";

                const file = input.files[0];
                const reader = new FileReader();

                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 1200; // الحد الأقصى للأبعاد لتصغير الحجم

                        if (width > maxDim || height > maxDim) {
                            if (width > height) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            } else {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // ضغط الصورة إلى صيغة JPEG بنسبة جودة 80%
                        uploadedImageBase64 = canvas.toDataURL('image/jpeg', 0.8);

                        statusText.innerText = "✅ تم تجهيز الصورة بنجاح! اضغط للحفظ";
                        document.getElementById('btnSaveDesign').disabled = false;
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // 🛠️ دالة الحفظ المحدثة مع معالجة الأخطاء
        function saveDesign() {
            if (!uploadedImageBase64) return;
            const catElem = document.getElementById('newDesignCat');
            const catId = catElem ? catElem.value : 'cat_custom';
            const id = 'design_' + Date.now();
            const newObj = { id: id, categoryId: catId, image: uploadedImageBase64 };

            const saveBtn = document.getElementById('btnSaveDesign');
            saveBtn.disabled = true;
            saveBtn.innerText = "⏳ جاري الرفع والنشر...";

            db.ref('appData/designs/' + id).set(newObj)
            .then(() => {
                alert("✅ تم رفع ونشر التصميم بنجاح!");
                uploadedImageBase64 = null;
                switchAdminTab('manage');
            })
            .catch((error) => {
                alert("❌ حدث خطأ في قاعدة البيانات: " + error.message);
                saveBtn.disabled = false;
                saveBtn.innerText = "💾 حفظ ونشر التصميم";
            });
        }

        function deleteDesign(id) {
            if (confirm("هل أنت تأكد من حذف هذا التصميم؟")) {
                db.ref('appData/designs/' + id).remove();
            }
        }

        function addCategory() {
            const val = document.getElementById('newCatName').value.trim();
            if (!val) return;
            const id = 'cat_' + Date.now();
            db.ref('appData/categories/' + id).set({ id: id, name: val }).then(() => {
                switchAdminTab('cats');
            });
        }

        function deleteCategory(id) {
            if (confirm("هل أنت تأكد من حذف هذا القسم؟")) {
                db.ref('appData/categories/' + id).remove();
            }
        }

        function changePassword() {
            const val = document.getElementById('newMasterPass').value.trim();
            if (!val) return;
            db.ref('appData/masterPassword').set(val).then(() => {
                alert("تم تغيير كلمة المرور بنجاح!");
            });
        }

        function renderClientPanel(container, isPreview = false) {
            let categoriesHtml = `<div class="cat-chip ${activeCategory==='all'?'active':''}" onclick="filterByCategory('all')">📂 الكل</div>`;
            categories.forEach(cat => {
                categoriesHtml += `<div class="cat-chip ${activeCategory===cat.id?'active':''}" onclick="filterByCategory('${cat.id}')">${cat.name}</div>`;
            });

            let adminNavHeader = isPreview ? 
                `<div style="margin-bottom:15px;"><a href="?admin=true" class="btn-home" style="display:block; background:#007bff; text-align:center;">🔙 العودة للوحة التحكم</a></div>` :
                `<div style="text-align: left; margin-bottom: 5px;"><a href="?admin=true" style="color:#888; font-size:11px; text-decoration:none;">لوحة التحكم 🔑</a></div>`;

            container.innerHTML = `
                ${adminNavHeader}
                <header style="text-align: center; margin-bottom: 15px; border-bottom: 2px solid #007bff; padding-bottom: 10px;">
                    <h1 style="color: #007bff; font-size: 20px;">🎨 مصمم البطاقات الفوري</h1>
                    <p style="font-size: 12px; color: #666;">سكاي موبايل</p>
                </header>

                <div class="categories-scroll">${categoriesHtml}</div>
                <div class="templates-preview-scroll" id="templatesScrollContainer"></div>

                <div class="form-group">
                    <label>اسم المحل أو الشبكة:</label>
                    <input type="text" id="cShop" placeholder="أكتب اسمك او اسم محلك" oninput="drawFinalImage()">
                </div>
                <div class="form-group">
                    <label>العنوان:</label>
                    <input type="text" id="cAddress" placeholder="أكتب عنوانك" oninput="drawFinalImage()">
                </div>
                <div class="form-group">
                    <label>رقم التواصل:</label>
                    <input type="text" id="cPhone" placeholder="أكتب رقمك" oninput="drawFinalImage()">
                </div>

                <div class="preview-box">
                    <div id="canvasContainer">
                        <canvas id="previewCanvas"></canvas>
                        <img id="outputImage" alt="التصميم">
                    </div>

                    <div class="action-links">
                        <button class="link-btn download-img-btn" id="dlBtn" onclick="downloadImage()">📥 تحميل وحفظ الصورة مباشرة</button>
                        <button class="link-btn copy-link-btn" id="copyBtn" onclick="copyDesignLink()">🔗 نسخ رابط هذا التصميم</button>
                        <a href="${globalLinks.appUrl}" target="_blank" class="link-btn store-link-btn">🛒 تطبيق سكاي موبايل</a>
                        <a href="${globalLinks.whatsappUrl}" target="_blank" class="link-btn whatsapp-channel-btn">💬 قناة الواتساب</a>
                    </div>
                </div>

                <div class="client-credits-footer">
                    تصميم وبرمجة: عبدالحميد سلطان (سكاي موبايل) — تواصل: 738328251
                </div>
            `;

            let urlParams = new URLSearchParams(window.location.search);
            let paramDesignId = urlParams.get('design');
            let filtered = getFilteredDesigns();

            let targetDesign = filtered.find(d => d.id === paramDesignId) || filtered[0];

            renderClientThumbnails(targetDesign ? targetDesign.id : null);

            if (targetDesign) {
                selectDesignInstant(targetDesign);
            }
        }

        function filterByCategory(catId) {
            activeCategory = catId;
            const isPreview = window.location.search.includes('preview=true');
            renderClientPanel(document.getElementById('mainContainer'), isPreview);
        }

        function getFilteredDesigns() {
            if (activeCategory === 'all') return designs;
            return designs.filter(d => d.categoryId === activeCategory);
        }

        function renderClientThumbnails(activeId) {
            const scrollContainer = document.getElementById('templatesScrollContainer');
            if (!scrollContainer) return;
            scrollContainer.innerHTML = '';

            const list = getFilteredDesigns();
            if (list.length === 0) {
                scrollContainer.innerHTML = '<p style="font-size:12px; color:#999; padding:10px;">لا توجد تصاميم في هذا القسم</p>';
                return;
            }

            list.forEach(des => {
                const isSelected = des.id === activeId ? 'selected' : '';
                const card = document.createElement('div');
                card.className = `thumb-card ${isSelected}`;
                card.onclick = () => {
                    renderClientThumbnails(des.id);
                    selectDesignInstant(des);
                };
                card.innerHTML = `<img src="${des.image}">`;
                scrollContainer.appendChild(card);
            });
        }

        function selectDesignInstant(des) {
            if (!des) return;
            selectedDesignId = des.id;

            if (imageCache[des.id] && imageCache[des.id].complete) {
                window.loadedBaseImage = imageCache[des.id];
                drawFinalImage();
            } else {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = function() {
                    imageCache[des.id] = img;
                    window.loadedBaseImage = img;
                    drawFinalImage();
                };
                img.src = des.image;
            }
        }

        function drawFinalImage() {
            const canvas = document.getElementById('previewCanvas');
            if (!canvas || !window.loadedBaseImage) return;
            const ctx = canvas.getContext('2d');

            canvas.width = window.loadedBaseImage.width;
            canvas.height = window.loadedBaseImage.height;
            ctx.drawImage(window.loadedBaseImage, 0, 0);

            // 1️⃣ رسم الإطار العلوي المتناسق (نقطة بيع معتمد)
            const topText = "نقطة بيع معتمد";
            const topFontSize = Math.max(14, Math.round(canvas.width * 0.035));
            ctx.font = `bold ${topFontSize}px 'Segoe UI', Tahoma, sans-serif`;

            const textMetrics = ctx.measureText(topText);
            const badgeWidth = textMetrics.width + 40;
            const badgeHeight = topFontSize + 16;
            const badgeX = (canvas.width - badgeWidth) / 2;
            const badgeY = 0; 

            ctx.save();
            ctx.fillStyle = '#007bff';
            
            ctx.beginPath();
            ctx.moveTo(badgeX, badgeY);
            ctx.lineTo(badgeX + badgeWidth, badgeY);
            ctx.lineTo(badgeX + badgeWidth, badgeY + badgeHeight - 10);
            ctx.quadraticCurveTo(badgeX + badgeWidth, badgeY + badgeHeight, badgeX + badgeWidth - 10, badgeY + badgeHeight);
            ctx.lineTo(badgeX + 10, badgeY + badgeHeight);
            ctx.quadraticCurveTo(badgeX, badgeY + badgeHeight, badgeX, badgeY + badgeHeight - 10);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(topText, canvas.width / 2, badgeY + (badgeHeight / 2));
            ctx.restore();

            // 2️⃣ رسم بيانات العميل السفلي (اسم المحل | الهاتف | العنوان)
            const shop = document.getElementById('cShop')?.value.trim() || '';
            const address = document.getElementById('cAddress')?.value.trim() || '';
            const phone = document.getElementById('cPhone')?.value.trim() || '';

            const details = [];
            if (shop) details.push("🏬 " + shop);
            if (phone) details.push("📞 " + phone);
            if (address) details.push("📍 " + address);

            const fullText = details.join('   |   ');
            if (fullText) {
                const fontSize = Math.max(16, Math.round(canvas.width * 0.032));
                const barHeight = Math.round(fontSize * 2.2);

                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, canvas.height - barHeight, canvas.width, barHeight);

                ctx.font = `bold ${fontSize}px 'Segoe UI', Tahoma, sans-serif`;
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(fullText, canvas.width / 2, canvas.height - (barHeight / 2));
                ctx.restore();
            }
        }

        function downloadImage() {
            const canvas = document.getElementById('previewCanvas');
            if (!canvas) return;
            const link = document.createElement('a');
            link.download = `sky-design-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function copyDesignLink() {
            if (!selectedDesignId) return;
            const link = `${window.location.origin}${window.location.pathname}?design=${selectedDesignId}`;
            navigator.clipboard.writeText(link).then(() => {
                alert("تم نسخ رابط التصميم بنجاح!");
            });
        }
    </script>
</body>
