<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سكاي موبايل - بوابة الخدمات والتصاميم</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>

    <style>
        :root {
            --sky-primary: #0c2461;
            --sky-secondary: #0a3d62;
            --sky-accent: #00a8ff;
            --sky-gradient: linear-gradient(135deg, #0c2461 0%, #0a3d62 50%, #00a8ff 100%);
            --shadow-soft: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body { 
            background: var(--sky-gradient);
            background-attachment: fixed;
            color: #2d3436; 
            padding: 10px 8px 25px 8px; 
            min-height: 100vh;
        }

        .ticker-wrap {
            width: 100%; background: rgba(12, 36, 97, 0.95); color: #00a8ff;
            padding: 6px 0; overflow: hidden; border-radius: 10px; margin-bottom: 12px;
            font-size: 12px; font-weight: bold; border: 1px solid rgba(0, 168, 255, 0.4);
        }
        .ticker-move { display: inline-block; white-space: nowrap; padding-right: 100%; animation: ticker 18s linear infinite; }
        @keyframes ticker { 0% { transform: translate3d(100%, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

        .container { 
            max-width: 650px; margin: 0 auto; background: rgba(255, 255, 255, 0.98); 
            padding: 16px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        
        .brand-header { text-align: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 2px dashed rgba(0, 168, 255, 0.3); }
        .brand-logo-wrapper { width: 100%; max-width: 280px; margin: 0 auto 6px auto; cursor: pointer; user-select: none; }
        .brand-logo-svg { width: 100%; height: auto; display: block; }

        .back-home-btn {
            display: inline-flex; align-items: center; gap: 6px; background: #0c2461; color: #fff;
            padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer;
            border: none; margin-bottom: 10px;
        }

        .services-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 15px; }
        .service-icon-card {
            background: #ffffff; border: 2px solid #e2e8f0; border-radius: 16px; padding: 16px 10px;
            text-align: center; cursor: pointer; box-shadow: var(--shadow-soft); transition: transform 0.2s;
        }
        .service-icon-card:active { transform: scale(0.98); }
        .service-icon-card .icon-wrapper {
            width: 48px; height: 48px; background: rgba(0, 168, 255, 0.1); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 8px auto; font-size: 22px;
        }
        .service-icon-card h3 { font-size: 14px; color: #0c2461; font-weight: 800; margin-bottom: 2px; }
        .service-icon-card p { font-size: 10px; color: #64748b; line-height: 1.3; }

        .search-filter-box { margin-bottom: 10px; }
        .search-filter-box input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 12px; outline: none; }

        .section-frame { background: #ffffff; border: 1px solid #e2e8f0; padding: 12px; border-radius: 14px; margin-bottom: 12px; box-shadow: var(--shadow-soft); }
        .section-frame.network-special { background: linear-gradient(135deg, #0c2461 0%, #0a3d62 100%); border: 1px solid #00a8ff; color: #ffffff; }
        
        .frame-title { font-size: 13px; font-weight: 700; color: #0c2461; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; }
        .section-frame.network-special .frame-title { color: #00a8ff; border-bottom-color: rgba(0, 168, 255, 0.3); }

        .client-input-card { margin-bottom: 8px; }
        .client-input-card label { display: block; margin-bottom: 4px; font-weight: 700; font-size: 11px; color: #0c2461; }
        .section-frame.network-special label { color: #e2e8f0; }
        .client-input-card input, .client-input-card select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; outline: none; background: #fff; }

        .color-compact-box { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 8px 10px; border-radius: 10px; margin-bottom: 12px; }
        .color-compact-box summary { font-size: 11px; font-weight: bold; color: #0c2461; cursor: pointer; user-select: none; }
        .colors-picker-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 8px; }
        .color-item { display: flex; align-items: center; justify-content: space-between; background: #ffffff; padding: 4px 8px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .color-item label { font-size: 10px; font-weight: bold; }
        .color-item input[type="color"] { width: 26px; height: 24px; border: none; cursor: pointer; background: transparent; padding: 0; }

        .categories-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-chip { background: #fff; border: 1px solid #cbd5e1; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; cursor: pointer; color: #475569; }
        .cat-chip.active { background: #0c2461; color: #fff; border-color: #0c2461; }

        .templates-preview-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px 2px; margin-bottom: 10px; min-height: 80px; }
        .thumb-card { flex: 0 0 70px; height: 80px; border-radius: 10px; overflow: hidden; border: 2px solid #cbd5e1; cursor: pointer; background: #e2e8f0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 9px; font-weight: bold; color: #0c2461; }
        .thumb-card.selected { border-color: #00a8ff; transform: scale(1.02); }
        .thumb-card img { width: 100%; height: 100%; object-fit: cover; }

        .preview-box { background: #fff; border: 2px dashed #00a8ff; padding: 10px; border-radius: 14px; margin-bottom: 12px; }
        #canvasContainer { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 10px; background: #f8fafc; }
        #previewCanvas { width: 100%; height: auto; display: block; }

        .action-links { display: flex; flex-direction: column; gap: 8px; }
        .link-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 10px; border-radius: 10px; font-weight: 700; font-size: 12px; border: none; cursor: pointer; color: white; text-decoration: none; }
        .download-img-btn { background: #00a8ff; }
        .whatsapp-share-btn { background: #25d366; }
        .copy-design-btn { background: #8e44ad; }
        .copy-link-btn { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .store-link-btn { background: #0a3d62; }
        .whatsapp-channel-btn { background: #128c7e; }

        .client-credits-footer { margin-top: 15px; padding-top: 10px; border-top: 1px solid #e2e8f0; text-align: center; font-size: 11px; color: #64748b; font-weight: 700; }
        .telecom-providers-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .provider-badge { background: #f8fafc; border: 1px solid #cbd5e1; padding: 8px 4px; border-radius: 8px; text-align: center; font-size: 11px; font-weight: bold; color: #0c2461; }

        /* Admin Styles */
        .admin-header { background: var(--sky-gradient); color: white; padding: 16px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
        .admin-card { background: #fff; border: 1px solid #e2e8f0; padding: 14px; border-radius: 12px; margin-bottom: 12px; }
        .admin-card h3 { font-size: 13px; color: #0c2461; margin-bottom: 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
        .btn-main { background: var(--sky-gradient); color: white; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-exit-admin { background-color: #e74c3c; color: white; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 12px; }
        .item-list-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
        .item-list-table th, .item-list-table td { border: 1px solid #dee2e6; padding: 6px; text-align: center; }
        .btn-delete-item { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div style="text-align: center; padding: 50px 0; color: #0c2461; font-weight: bold;">
            جاري تحميل البوابة... 🚀
        </div>
    </div>

    <script>
        // --- 1. CONFIG & STATE MANAGEMENT ---
        const firebaseConfig = {
            apiKey: "AIzaSyDNwIUGqA2dm5Mrx5S06LIEGPJ_VgW3eFc",
            authDomain: "sky-mobile-8e245.firebaseapp.com",
            databaseURL: "https://sky-mobile-8e245-default-rtdb.firebaseio.com",
            projectId: "sky-mobile-8e245",
            messagingSenderId: "1066510361417",
            appId: "1:1066510361417:web:a5e17c7f3c8e267b1d3098"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const AppState = {
            currentAdminPass: "sky2026",
            activeViewSection: 'grid_main',
            globalLinks: {
                appUrl: 'https://play.google.com/store/apps/details?id=com.skymobile.app',
                whatsappUrl: 'https://whatsapp.com/channel/YOUR_CHANNEL_LINK',
                supportPhone: '738328251'
            },
            defaultDesign: {
                id: 'design_wifi_canvas_dynamic',
                title: '🌐 قالب شبكي تفاعلي احترافي',
                categoryId: 'cat_wifi_networks',
                isGenerated: true,
                image: ''
            },
            categories: [{ id: 'cat_wifi_networks', name: '📶 تصاميم كروت الشبكات' }],
            designs: [],
            networkCodes: [],
            imageCache: {},
            activeCategory: 'all',
            currentDesignId: 'design_wifi_canvas_dynamic',
            loadedBaseImage: null,
            isDynamicCanvasMode: true,
            renderDebounceTimer: null,
            logoClickCounter: 0,
            logoClickTimer: null,
            searchQuery: ""
        };

        AppState.designs = [AppState.defaultDesign];

        // --- 2. INITIALIZATION & DATA FETCHING ---
        window.onload = function() {
            fetchCloudDataOptimized();
            checkUrlForSpecificDesign();
        };

        function checkUrlForSpecificDesign() {
            const params = new URLSearchParams(window.location.search);
            const designParam = params.get('design');
            if (designParam) {
                AppState.currentDesignId = designParam;
                AppState.activeViewSection = 'view_designer';
            }
        }

        function fetchCloudDataOptimized() {
            const cachedData = sessionStorage.getItem('sky_mobile_data_cache');
            if (cachedData) {
                try {
                    processFetchedData(JSON.parse(cachedData));
                    db.ref('sky_data').once('value').then(snap => {
                        sessionStorage.setItem('sky_mobile_data_cache', JSON.stringify(snap.val()));
                    });
                } catch (e) { fetchFromFirebase(); }
            } else {
                fetchFromFirebase();
            }
        }

        function fetchFromFirebase() {
            db.ref('sky_data').once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data) {
                    try { sessionStorage.setItem('sky_mobile_data_cache', JSON.stringify(data)); } catch(e) {}
                    processFetchedData(data);
                }
            });
        }

        function processFetchedData(data) {
            if (data.categories) {
                const fetchedCats = Object.values(data.categories);
                if (!fetchedCats.some(c => c.id === 'cat_wifi_networks')) {
                    fetchedCats.unshift({ id: 'cat_wifi_networks', name: '📶 تصاميم كروت الشبكات' });
                }
                AppState.categories = fetchedCats;
            }
            if (data.designs) {
                AppState.designs = [AppState.defaultDesign, ...Object.values(data.designs)];
            }
            if (data.links) AppState.globalLinks = { ...AppState.globalLinks, ...data.links };
            if (data.adminPass) AppState.currentAdminPass = data.adminPass;
            if (data.networks) AppState.networkCodes = Object.values(data.networks);
            
            checkViewState();
        }

        // --- 3. ROUTING & CONTROLLER ---
        function checkViewState() {
            const container = document.getElementById('mainContainer');
            const isAdminMode = sessionStorage.getItem('sky_in_admin_mode') === 'true';
            const isAuth = sessionStorage.getItem('sky_admin_authenticated') === 'true';

            if (isAdminMode) {
                if (isAuth) renderAdminPanel(container);
                else renderLoginForm(container);
            } else {
                renderClientPanel(container);
            }
        }

        function switchView(viewId) {
            AppState.activeViewSection = viewId;
            checkViewState();
        }

        function handleSecretLogoClick() {
            AppState.logoClickCounter++;
            clearTimeout(AppState.logoClickTimer);
            if (AppState.logoClickCounter >= 5) {
                AppState.logoClickCounter = 0;
                sessionStorage.setItem('sky_in_admin_mode', 'true');
                checkViewState();
            } else {
                AppState.logoClickTimer = setTimeout(() => { AppState.logoClickCounter = 0; }, 1500);
            }
        }

        // --- 4. RENDERERS (VIEW GENERATORS) ---
        function renderClientPanel(container) {
            let networksOptionsHtml = `<option value="" data-name="">اختر شبكتك المسجلة من القائمة</option>`;
            AppState.networkCodes.forEach(net => {
                networksOptionsHtml += `<option value="${net.code}" data-name="${net.name}">${net.name} - (رقم الشبكة: ${net.code})</option>`;
            });

            const showBack = AppState.activeViewSection !== 'grid_main';

            let dynamicBodyHtml = '';
            if (AppState.activeViewSection === 'grid_main') {
                dynamicBodyHtml = `
                    <div class="services-grid">
                        <div class="service-icon-card" onclick="switchView('view_designer')"><div class="icon-wrapper">🎨</div><h3>مصمم الإعلانات</h3><p>تخصيص القوالب وتصميم بطاقة نقطتك</p></div>
                        <div class="service-icon-card" onclick="switchView('view_telecom')"><div class="icon-wrapper">📱</div><h3>تسديد الباقات</h3><p>يمن موبايل، يو، سبأفون، يمن فورجي</p></div>
                        <div class="service-icon-card" onclick="switchView('view_wifi')"><div class="icon-wrapper">📶</div><h3>كروت الواي فاي</h3><p>تسديد واستخراج كروت الشبكات</p></div>
                        <div class="service-icon-card" onclick="switchView('view_support')"><div class="icon-wrapper">💬</div><h3>الدعم والروابط</h3><p>تحميل التطبيق وقناة الواتساب</p></div>
                    </div>`;
            } else if (AppState.activeViewSection === 'view_designer') {
                dynamicBodyHtml = `
                    <div class="search-filter-box"><input type="text" placeholder="🔍 ابحث عن تصميم..." oninput="handleSearchInput(this.value)"></div>
                    <div class="categories-scroll" id="catChipsContainer"></div>
                    <div class="templates-preview-scroll" id="templatesScrollContainer"></div>

                    <div class="preview-box">
                        <div id="canvasContainer"><canvas id="previewCanvas"></canvas></div>
                        <details class="color-compact-box">
                            <summary>🎨 اضغط هنا لتخصيص ألوان التصميم</summary>
                            <div class="colors-picker-grid">
                                <div class="color-item"><label>الهيدر:</label><input type="color" id="colBg" value="#0c2461" onchange="debouncedDraw()"></div>
                                <div class="color-item"><label>الرئيسي:</label><input type="color" id="colText1" value="#ffffff" onchange="debouncedDraw()"></div>
                                <div class="color-item"><label>الفرعي:</label><input type="color" id="colText2" value="#00a8ff" onchange="debouncedDraw()"></div>
                                <div class="color-item"><label>الإطار:</label><input type="color" id="colBorder" value="#00a8ff" onchange="debouncedDraw()"></div>
                            </div>
                        </details>
                        <div class="action-links">
                            <button class="link-btn download-img-btn" onclick="downloadImage()">📥 تحميل التصميم</button>
                            <button class="link-btn copy-design-btn" onclick="copyDesignLink()">🔗 نسخ رابط التصميم الحالي</button>
                            <button class="link-btn whatsapp-share-btn" onclick="shareToWhatsApp()">📱 مشاركة عبر الواتساب</button>
                        </div>
                    </div>

                    <div class="section-frame network-special">
                        <div class="frame-title">📶 خاص بأصحاب الشبكات</div>
                        <div class="client-input-card"><label>اختر الشبكة:</label><select id="cNetSelect" onchange="applySelectedNetworkCode()">${networksOptionsHtml}</select></div>
                        <div class="client-input-card"><label>رقم الشبكة بالتطبيق:</label><input type="text" id="cNetCode" placeholder="مثال: 102" oninput="autoMatchNetworkCode()"></div>
                        <div class="client-input-card"><label>اسم الشبكة:</label><input type="text" id="cNetName" placeholder="مثال: الفجر" oninput="debouncedDraw()"></div>
                    </div>

                    <div class="section-frame">
                        <div class="frame-title">📝 بياناتك التجارية للتصميم</div>
                        <div class="client-input-card"><label>🏪 اسم المحل / النقطة:</label><input type="text" id="cShop" placeholder="أدخل اسمك أو المحل" oninput="debouncedDraw()"></div>
                        <div class="client-input-card"><label>📍 العنوان:</label><input type="text" id="cAddress" placeholder="العنوان" oninput="debouncedDraw()"></div>
                        <div class="client-input-card"><label>📞 الهاتف:</label><input type="text" id="cPhone" value="${AppState.globalLinks.supportPhone}" oninput="debouncedDraw()"></div>
                    </div>`;
            } else if (AppState.activeViewSection === 'view_telecom') {
                dynamicBodyHtml = `
                    <div class="section-frame"><div class="frame-title">📱 خدمات تسديد الباقات والرصيد</div>
                        <div class="telecom-providers-grid">
                            <div class="provider-badge">🔴 يمن موبايل</div><div class="provider-badge">🟠 يو (YOU)</div><div class="provider-badge">🔵 سبأفون</div>
                            <div class="provider-badge">⚡ يمن فورجي</div><div class="provider-badge">☎️ الهاتف الأرضي</div><div class="provider-badge">🌐 النت الأرضي</div>
                        </div>
                        <a href="${AppState.globalLinks.appUrl}" target="_blank" class="link-btn store-link-btn" style="margin-top:15px;">🛒 افتح التطبيق للتسديد</a>
                    </div>`;
            } else if (AppState.activeViewSection === 'view_wifi') {
                let netsListHtml = AppState.networkCodes.map(n => `<div style="background:#f1f5f9; padding:6px 10px; border-radius:6px; font-size:11px; margin-bottom:4px; display:flex; justify-content:space-between;"><span>🌐 ${n.name}</span><strong>رقم الشبكة: ${n.code}</strong></div>`).join('');
                dynamicBodyHtml = `
                    <div class="section-frame network-special"><div class="frame-title">📶 إدارة وكروت شبكات الواي فاي</div>
                        <p style="font-size:11px; color:#e2e8f0; margin-bottom:10px;">يمكن للمشتركين تسديد كروت الشبكات بكتابة رقم الشبكة في التطبيق مباشرة.</p>
                        <div style="max-height:180px; overflow-y:auto; margin-bottom:12px; border:1px solid rgba(255,255,255,0.2); border-radius:8px; padding:6px; background:rgba(0,0,0,0.2);">
                            ${netsListHtml || '<p style="font-size:10px; text-align:center;">لا توجد شبكات مضافة حالياً</p>'}
                        </div>
                        <input type="text" id="reqNetNameView" placeholder="أدخل اسم شبكتك لإضافتها" style="margin-bottom:6px; width: 100%; padding: 8px; border-radius: 8px;">
                        <button onclick="sendNetworkAddRequestFromView()" style="width:100%; background:#25d366; color:white; border:none; padding:8px; border-radius:8px; font-weight:bold; cursor:pointer;">📲 طلب إضافة شبكتك عبر الواتساب</button>
                    </div>`;
            } else if (AppState.activeViewSection === 'view_support') {
                dynamicBodyHtml = `
                    <div class="section-frame"><div class="frame-title">💬 الدعم الفني والقنوات الرسمية</div>
                        <div class="action-links">
                            <a href="${AppState.globalLinks.appUrl}" target="_blank" class="link-btn store-link-btn">🛒 تحميل التطبيق من متجر بلاي</a>
                            <a href="${AppState.globalLinks.whatsappUrl}" target="_blank" class="link-btn whatsapp-channel-btn">💬 الانضمام لقناة الواتساب</a>
                            <button class="link-btn copy-link-btn" onclick="copyDirectLink()">🔗 نسخ رابط البوابة</button>
                        </div>
                    </div>`;
            }

            container.innerHTML = `
                <div class="ticker-wrap"><div class="ticker-move">🔥 أهلاً بكم في تطبيق سكاي موبايل! اختر الخدمة المطلوبة بأحد الأيقونات أدناه 🚀</div></div>
                <header class="brand-header">
                    <div class="brand-logo-wrapper" onclick="handleSecretLogoClick()" title="سكاي موبايل (5 نقرات للوحة التحكم)">
                        <svg class="brand-logo-svg" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0080FF"/><stop offset="100%" stop-color="#003399"/></linearGradient>
                                <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0052CC"/><stop offset="100%" stop-color="#002966"/></linearGradient>
                            </defs>
                            <path d="M 120,75 A 75,75 0 0,1 240,65" fill="none" stroke="url(#skyGrad)" stroke-width="12" stroke-linecap="round"/>
                            <rect x="248" y="52" width="10" height="10" fill="#0080FF" rx="1"/><rect x="262" y="52" width="10" height="10" fill="#0080FF" rx="1"/><rect x="255" y="65" width="10" height="10" fill="#0080FF" rx="1"/>
                            <text x="200" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="url(#skyGrad)" letter-spacing="-1">SKY</text>

        // --- 5. DESIGNER & CANVAS ENGINE ---
        function renderCategoryChips() {
            const container = document.getElementById('catChipsContainer');
            if (!container) return;
            let html = `<div class="cat-chip ${AppState.activeCategory==='all'?'active':''}" onclick="filterByCategory('all')">📁 الكل (${AppState.designs.length})</div>`;
            AppState.categories.forEach(cat => {
                const count = AppState.designs.filter(d => d.categoryId === cat.id).length;
                html += `<div class="cat-chip ${AppState.activeCategory===cat.id?'active':''}" onclick="filterByCategory('${cat.id}')">${cat.name} (${count})</div>`;
            });
            container.innerHTML = html;
        }

        function filterByCategory(catId) {
            AppState.activeCategory = catId;
            renderCategoryChips();
            let filtered = getFilteredDesigns();
            if (filtered.length > 0) {
                AppState.currentDesignId = filtered[0].id;
                renderClientThumbnails(filtered[0].id);
                loadSelectedDesign(filtered[0]);
            } else {
                renderClientThumbnails(null);
            }
        }

        function getFilteredDesigns() {
            let list = AppState.designs;
            if (AppState.activeCategory !== 'all') list = list.filter(d => d.categoryId === AppState.activeCategory);
            if (AppState.searchQuery) list = list.filter(d => d.title.toLowerCase().includes(AppState.searchQuery));
            return list;
        }

        function renderClientThumbnails(selectedId) {
            const scrollBox = document.getElementById('templatesScrollContainer');
            if(!scrollBox) return;
            scrollBox.innerHTML = '';
            let list = getFilteredDesigns();
            if (list.length === 0) {
                scrollBox.innerHTML = `<p style="font-size:11px; color:#64748b; padding:8px;">لا توجد تصاميم.</p>`;
                return;
            }
            list.forEach(item => {
                const isSelected = item.id == selectedId;
                const div = document.createElement('div');
                div.className = `thumb-card ${isSelected ? 'selected' : ''}`;
                div.onclick = () => {
                    AppState.currentDesignId = item.id;
                    renderClientThumbnails(item.id);
                    loadSelectedDesign(item);
                };
                div.innerHTML = item.isGenerated ? `🌐<br>قالب آلي` : `<img src="${item.image}" alt="${item.title}" loading="lazy" decoding="async">`;
                scrollBox.appendChild(div);
            });
        }

        function loadSelectedDesign(designObj) {
            if(!designObj) return;
            if (designObj.isGenerated) {
                AppState.isDynamicCanvasMode = true;
                AppState.loadedBaseImage = null;
                drawFinalImage();
                return;
            }
            AppState.isDynamicCanvasMode = false;
            if (AppState.imageCache[designObj.image] && AppState.imageCache[designObj.image].complete) {
                AppState.loadedBaseImage = AppState.imageCache[designObj.image];
                drawFinalImage();
            } else {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = function() {
                    AppState.imageCache[designObj.image] = img;
                    AppState.loadedBaseImage = img;
                    drawFinalImage();
                };
                img.src = designObj.image;
            }
        }

        function debouncedDraw() {
            clearTimeout(AppState.renderDebounceTimer);
            AppState.renderDebounceTimer = setTimeout(() => requestAnimationFrame(drawFinalImage), 40);
        }

        function drawFinalImage() {
            const canvas = document.getElementById('previewCanvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const shopName = document.getElementById('cShop')?.value.trim() || "";
            const address = document.getElementById('cAddress')?.value.trim() || "";
            const phone = document.getElementById('cPhone')?.value.trim() || "";
            const netName = document.getElementById('cNetName')?.value.trim() || "";
            const netCode = document.getElementById('cNetCode')?.value.trim() || "";

            const colBg = document.getElementById('colBg')?.value || "#0c2461";
            const colText1 = document.getElementById('colText1')?.value || "#ffffff";
            const colText2 = document.getElementById('colText2')?.value || "#00a8ff";
            const colBorder = document.getElementById('colBorder')?.value || "#00a8ff";
            const selectedFontFamily = "'Cairo', sans-serif";

            // 1. رسم الخلفية والقالب
            if (AppState.isDynamicCanvasMode || !AppState.loadedBaseImage) {
                canvas.width = 1000; canvas.height = 1000;
                
                const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                bgGrad.addColorStop(0, colBg);
                bgGrad.addColorStop(0.5, '#07183d');
                bgGrad.addColorStop(1, '#030b1e');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = "rgba(0, 168, 255, 0.05)";
                ctx.lineWidth = 1;
                for (let x = 0; x < canvas.width; x += 40) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                }
                for (let y = 0; y < canvas.height; y += 40) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                }

                ctx.strokeStyle = colBorder;
                ctx.lineWidth = 10;
                ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

                ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
                ctx.lineWidth = 2;
                ctx.strokeRect(32, 32, canvas.width - 64, canvas.height - 64);

                const centerX = canvas.width / 2;
                const centerY = canvas.height * 0.38;
                
                ctx.save();
                ctx.strokeStyle = colText2;
                ctx.lineWidth = 12;
                ctx.lineCap = "round";
                ctx.shadowColor = colText2;
                ctx.shadowBlur = 18;

                for (let r = 140; r >= 40; r -= 35) {
                    ctx.beginPath();
                    ctx.arc(centerX, centerY + 30, r, Math.PI * 1.22, Math.PI * 1.78);
                    ctx.stroke();
                }
                ctx.beginPath();
                ctx.arc(centerX, centerY + 35, 14, 0, Math.PI * 2);
                ctx.fillStyle = colText2;
                ctx.fill();
                ctx.restore();

                ctx.textAlign = "center";
                ctx.shadowColor = "rgba(0,0,0,0.6)";
                ctx.shadowBlur = 8;

                ctx.fillStyle = colText1;
                ctx.font = `900 48px ${selectedFontFamily}`;
                ctx.fillText("📶 خدمة إنترنت واي فاي فائقة السرعة", centerX, canvas.height * 0.53);

                const speedBadgeW = 560; const speedBadgeH = 50;
                ctx.fillStyle = "rgba(0, 168, 255, 0.2)";
                ctx.beginPath();
                ctx.roundRect(centerX - (speedBadgeW/2), canvas.height * 0.57, speedBadgeW, speedBadgeH, 25);
                ctx.fill();
                ctx.strokeStyle = colBorder;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = colText2;
                ctx.font = `800 24px ${selectedFontFamily}`;
                ctx.fillText("⚡ سرعة فائقة تصل إلى 100 ميجابايت/ثانية ⚡", centerX, canvas.height * 0.57 + 34);

                const features = [
                    { icon: "🚀", title: "تغطية ممتازة 5G" },
                    { icon: "🎮", title: "ثبات عالي للألعاب" },
                    { icon: "⚡", title: "تحميل غير محدود" },
                    { icon: "💳", title: "كروت شحن متوفرة" }
                ];

                const cardW = 210; const cardH = 80; const gap = 16;
                const startX = centerX - (cardW * 2 + gap * 1.5);
                const startY = canvas.height * 0.65;

                features.forEach((feat, index) => {
                    const x = startX + (index % 2) * (cardW + gap * 2) + 12;
                    const y = startY + Math.floor(index / 2) * (cardH + gap);

                    ctx.fillStyle = "rgba(255, 255, 255, 0.06)";
                    ctx.beginPath();
                    ctx.roundRect(x, y, cardW, cardH, 12);
                    ctx.fill();
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.textAlign = "right";
                    ctx.font = `900 30px ${selectedFontFamily}`;
                    ctx.fillText(feat.icon, x + cardW - 15, y + 50);

                    ctx.textAlign = "center";
                    ctx.fillStyle = "#ffffff";
                    ctx.font = `800 17px ${selectedFontFamily}`;
                    ctx.fillText(feat.title, x + (cardW / 2) - 10, y + 48);
                });

                const footerHeight = 135;
                const footerY = canvas.height - footerHeight - 20;

                ctx.fillStyle = "rgba(12, 36, 97, 0.95)";
                ctx.fillRect(20, footerY, canvas.width - 40, footerHeight);
                ctx.fillStyle = colBorder;
                ctx.fillRect(20, footerY, canvas.width - 40, 5);

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                const dispShop = shopName || "مركز الخدمات والاتصالات المعتمد";
                ctx.font = `900 34px ${selectedFontFamily}`;
                ctx.fillStyle = colText1;
                ctx.fillText(dispShop, centerX, footerY + 45);

                const subDetails = [address ? "📍 " + address : "📍 التغطية متوفرة في كافة الأرجاء", phone ? "📞 " + phone : "📞 " + AppState.globalLinks.supportPhone].filter(Boolean).join("  |  ");
                ctx.font = `800 22px ${selectedFontFamily}`;
                ctx.fillStyle = colText2;
                ctx.fillText(subDetails, centerX, footerY + 95);

            } else {
                const hasFooterData = shopName || address || phone;
                const footerHeight = hasFooterData ? Math.max(105, AppState.loadedBaseImage.height * 0.16) : 0;
                canvas.width = AppState.loadedBaseImage.width; canvas.height = AppState.loadedBaseImage.height + footerHeight;
                ctx.drawImage(AppState.loadedBaseImage, 0, 0, AppState.loadedBaseImage.width, AppState.loadedBaseImage.height);

                if (hasFooterData) {
                    const footerY = AppState.loadedBaseImage.height;
                    ctx.fillStyle = colBg; ctx.fillRect(0, footerY, canvas.width, footerHeight);
                    ctx.fillStyle = colBorder; ctx.fillRect(0, footerY, canvas.width, 5);
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";

                    if (shopName) {
                        ctx.font = `900 ${footerHeight * 0.36}px ${selectedFontFamily}`;
                        ctx.fillStyle = colText1;
                        ctx.fillText(shopName, canvas.width / 2, footerY + (footerHeight * 0.34));
                    }
                    const subDetails = [address ? "📍 " + address : "", phone ? "📞 " + phone : ""].filter(Boolean).join("  |  ");
                    if (subDetails) {
                        ctx.font = `800 ${footerHeight * 0.26}px ${selectedFontFamily}`;
                        ctx.fillStyle = colText2;
                        ctx.fillText(subDetails, canvas.width / 2, footerY + (footerHeight * 0.74));
                    }
                }
            }

            // 2. الشريط العلوي
            const topBadgeHeight = canvas.height * 0.065;
            ctx.fillStyle = colBg; ctx.fillRect(0, 0, canvas.width, topBadgeHeight);
            ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = colText1;
            ctx.font = `900 ${topBadgeHeight * 0.52}px ${selectedFontFamily}`;
            ctx.fillText("⭐ نقطة بيع معتمدة لتطبيق سكاي موبايل ⭐", canvas.width / 2, topBadgeHeight / 2);

            // 3. بالونة الواي فاي الدائرية المفتوحة التكيفية
            if (netName || netCode) {
                const diameter = canvas.width * 0.27; 
                const radius = diameter / 2;
                
                const centerX = canvas.width - radius - (canvas.width * 0.035);
                const centerY = topBadgeHeight + radius + (canvas.height * 0.025);

                ctx.save();
                ctx.shadowColor = "rgba(0,0,0,0.55)";
                ctx.shadowBlur = 15;
                ctx.shadowOffsetY = 6;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(12, 36, 97, 0.97)";
                ctx.fill();
                ctx.lineWidth = 5;
                ctx.strokeStyle = colBorder;
                ctx.stroke();
                ctx.restore();

                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius - 3, 0, Math.PI * 2);
                ctx.clip();

                const nameText = netName ? `📶 ${netName}` : "📶 الواي فاي";
                const labelText = "رقم الشبكة";
                const codeText = netCode ? `[ ${netCode} ]` : "[ -- ]";

                const maxAllowedWidth = diameter * 0.80;

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                let nameFontSize = radius * 0.25;
                ctx.font = `900 ${nameFontSize}px ${selectedFontFamily}`;
                while (ctx.measureText(nameText).width > maxAllowedWidth && nameFontSize > 8) {
                    nameFontSize -= 1;
                    ctx.font = `900 ${nameFontSize}px ${selectedFontFamily}`;
                }
                ctx.fillStyle = "#ffffff";
                ctx.fillText(nameText, centerX, centerY - (radius * 0.44));

                let labelFontSize = radius * 0.18;
                ctx.font = `800 ${labelFontSize}px ${selectedFontFamily}`;
                ctx.fillStyle = "#cbd5e1";
                ctx.fillText(labelText, centerX, centerY - (radius * 0.04));

                let codeFontSize = radius * 0.31;
                ctx.font = `900 ${codeFontSize}px ${selectedFontFamily}`;
                while (ctx.measureText(codeText).width > maxAllowedWidth && codeFontSize > 9) {
                    codeFontSize -= 1;
                    ctx.font = `900 ${codeFontSize}px ${selectedFontFamily}`;
                }
                ctx.fillStyle = colText2;
                ctx.fillText(codeText, centerX, centerY + (radius * 0.40));

                ctx.restore();
            }
        }

        // --- 6. UTILITIES & ACTIONS ---
        function autoMatchNetworkCode() {
            const codeInput = document.getElementById('cNetCode');
            const nameInput = document.getElementById('cNetName');
            const selectEl = document.getElementById('cNetSelect');
            if(!codeInput) return;
            const typedCode = codeInput.value.trim();
            if (typedCode) {
                const matched = AppState.networkCodes.find(n => n.code == typedCode);
                if (matched) {
                    if (nameInput) nameInput.value = matched.name;
                    if (selectEl) selectEl.value = matched.code;
                }
            }
            debouncedDraw();
        }

        function applySelectedNetworkCode() {
            const selectEl = document.getElementById('cNetSelect');
            const codeInput = document.getElementById('cNetCode');
            const nameInput = document.getElementById('cNetName');
            if (selectEl && selectEl.selectedIndex > 0) {
                const selectedOpt = selectEl.options[selectEl.selectedIndex];
                if (codeInput) codeInput.value = selectEl.value;
                if (nameInput) nameInput.value = selectedOpt.getAttribute('data-name') || "";
                debouncedDraw();
            }
        }

            AppState.searchQuery = val.trim().toLowerCase();
            let filtered = getFilteredDesigns();
            if (filtered.length > 0) {
                renderClientThumbnails(filtered[0].id);
                loadSelectedDesign(filtered[0]);
            }
        }

        // --- 8. ADMIN ACTIONS ---
        function saveGlobalLinks() {
            const appUrl = document.getElementById('admAppUrl').value.trim();
            const whatsappUrl = document.getElementById('admWaUrl').value.trim();

        function deleteNetwork(code) {
            if (confirm("تأكيد حذف الشبكة؟")) {
                db.ref('sky_data/networks').once('value').then(snap => {
                    const data = snap.val();
                    for(let key in data) {
                        if (data[key].code == code) {
                            db.ref('sky_data/networks/' + key).remove().then(() => {
                                sessionStorage.removeItem('sky_mobile_data_cache');
                                fetchCloudDataOptimized();
                            });
                            break;
                        }
                    }
                });
            }
        }

        let uploadedBase64Temp = "";
        function convertAndCompressImage(fileInput) {
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; let width = img.width; let height = img.height;
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                        uploadedBase64Temp = canvas.toDataURL('image/jpeg', 0.6);
                        document.getElementById('newDesignImageUrl').value = "تم ضغط الصورة بنجاح ✓";
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function addNewDesign() {
            const title = document.getElementById('newDesignTitle').value.trim();
            const categoryId = document.getElementById('newDesignCategory').value;
            let imageUrl = document.getElementById('newDesignImageUrl').value.trim();
            if (uploadedBase64Temp && imageUrl.includes("تم ضغط الصورة")) imageUrl = uploadedBase64Temp;
            if (!title || !imageUrl) return;
            const id = 'design_' + Date.now();
            db.ref('sky_data/designs/' + id).set({ id, title, categoryId, image: imageUrl, isGenerated: false }).then(() => {
                sessionStorage.removeItem('sky_mobile_data_cache');
                fetchCloudDataOptimized();
            });
        }
