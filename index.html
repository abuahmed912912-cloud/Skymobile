<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سكاي موبايل - بوابة الخدمات الإلكترونية والتصاميم</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;700&family=Almarai:wght@400;700&family=Cairo:wght@400;700;800&family=Changa:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --sky-primary: #0c2461;
            --sky-secondary: #0a3d62;
            --sky-accent: #00a8ff;
            --sky-gradient: linear-gradient(135deg, #0c2461 0%, #0a3d62 50%, #00a8ff 100%);
            --sky-card-bg: rgba(255, 255, 255, 0.96);
            --font-current: 'Cairo', sans-serif;
            --shadow-soft: 0 8px 20px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 12px 25px rgba(0, 168, 255, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-current); transition: all 0.2s ease; }

        body { 
            background: var(--sky-gradient);
            background-attachment: fixed;
            color: #2d3436; 
            padding: 10px 8px 25px 8px; 
            min-height: 100vh;
        }

        .ticker-wrap {
            width: 100%;
            background: rgba(12, 36, 97, 0.92);
            color: #00a8ff;
            padding: 6px 0;
            overflow: hidden;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid rgba(0, 168, 255, 0.4);
        }
        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            padding-right: 100%;
            animation: ticker 20s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translate3d(100%, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .container { 
            max-width: 650px; 
            margin: 0 auto; 
            background: var(--sky-card-bg); 
            backdrop-filter: blur(12px);
            padding: 16px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        
        .brand-header { 
            text-align: center; 
            margin-bottom: 12px; 
            padding-bottom: 10px; 
            border-bottom: 2px dashed rgba(0, 168, 255, 0.3); 
        }
        
        .brand-logo-wrapper {
            width: 100%;
            max-width: 280px;
            margin: 0 auto 6px auto;
            cursor: pointer;
            user-select: none;
        }
        .brand-logo-svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #0c2461;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin-bottom: 10px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }
        .service-icon-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: var(--shadow-soft);
        }
        .service-icon-card:hover { transform: translateY(-3px); border-color: #00a8ff; }
        .service-icon-card .icon-wrapper {
            width: 50px;
            height: 50px;
            background: rgba(0, 168, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px auto;
            font-size: 24px;
        }
        .service-icon-card h3 { font-size: 14px; color: #0c2461; font-weight: 800; margin-bottom: 2px; }
        .service-icon-card p { font-size: 10px; color: #64748b; line-height: 1.3; }

        .service-view-panel { display: none; }
        .service-view-panel.active { display: block; animation: fadeIn 0.25s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-filter-box { margin-bottom: 10px; }
        .search-filter-box input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 12px; outline: none; }

        .section-frame { background: #ffffff; border: 1px solid #e2e8f0; padding: 12px; border-radius: 14px; margin-bottom: 12px; box-shadow: var(--shadow-soft); }
        .section-frame.network-special { background: linear-gradient(135deg, #0c2461 0%, #0a3d62 100%); border: 1px solid #00a8ff; color: #ffffff; }
        
        .frame-title { font-size: 13px; font-weight: 700; color: #0c2461; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; }
        .section-frame.network-special .frame-title { color: #00a8ff; border-bottom-color: rgba(0, 168, 255, 0.3); }

        .client-input-card { margin-bottom: 8px; }
        .client-input-card label { display: block; margin-bottom: 4px; font-weight: 700; font-size: 11px; color: #0c2461; }
        .section-frame.network-special label { color: #e2e8f0; }
        .client-input-card input, .client-input-card select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; outline: none; background: #fff; }

        .color-compact-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 8px 10px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .color-compact-box summary { font-size: 11px; font-weight: bold; color: #0c2461; cursor: pointer; user-select: none; }
        .colors-picker-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 8px; }
        .color-item { display: flex; align-items: center; justify-content: space-between; background: #ffffff; padding: 4px 8px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .color-item label { font-size: 10px; font-weight: bold; }
        .color-item input[type="color"] { width: 26px; height: 24px; border: none; cursor: pointer; background: transparent; padding: 0; }

        .top-action-bar { display: flex; gap: 8px; margin-bottom: 10px; }
        .btn-custom-action { flex: 1; padding: 8px; border-radius: 10px; font-weight: bold; font-size: 11px; border: none; cursor: pointer; color: white; }
        .btn-reset-default { background: #e74c3c; }
        .btn-change-font { background: #f39c12; }

        .categories-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-chip { background: #fff; border: 1px solid #cbd5e1; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; cursor: pointer; color: #475569; }
        .cat-chip.active { background: #0c2461; color: #fff; border-color: #0c2461; }

        .templates-preview-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px 2px; margin-bottom: 10px; min-height: 80px; }
        .thumb-card { flex: 0 0 70px; height: 80px; border-radius: 10px; overflow: hidden; border: 2px solid #cbd5e1; cursor: pointer; background: #e2e8f0; position: relative; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 9px; font-weight: bold; color: #0c2461; }
        .thumb-card.selected { border-color: #00a8ff; transform: scale(1.04); box-shadow: var(--shadow-hover); }
        .thumb-card img { width: 100%; height: 100%; object-fit: cover; }

        .preview-box { background: #fff; border: 2px dashed #00a8ff; padding: 10px; border-radius: 14px; margin-bottom: 12px; }
        #canvasContainer { position: relative; width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 10px; background: #f8fafc; }
        #previewCanvas { width: 100%; height: auto; display: block; }

        .action-links { display: flex; flex-direction: column; gap: 8px; }
        .link-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 10px; border-radius: 10px; font-weight: 700; font-size: 12px; border: none; cursor: pointer; color: white; text-decoration: none; }
        .download-img-btn { background: #00a8ff; }
        .whatsapp-share-btn { background: #25d366; }
        .copy-design-btn { background: #8e44ad; }
        .copy-link-btn { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .store-link-btn { background: #0a3d62; }
        .whatsapp-channel-btn { background: #128c7e; }

        .client-credits-footer { margin-top: 15px; padding-top: 10px; border-top: 1px solid #e2e8f0; text-align: center; font-size: 11px; color: #64748b; font-weight: 700; }

        .telecom-providers-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .provider-badge { background: #f8fafc; border: 1px solid #cbd5e1; padding: 8px 4px; border-radius: 8px; text-align: center; font-size: 11px; font-weight: bold; color: #0c2461; }

        /* عناصر لوحة التحكم */
        .admin-header { background: var(--sky-gradient); color: white; padding: 16px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
        .admin-card { background: #fff; border: 1px solid #e2e8f0; padding: 14px; border-radius: 12px; margin-bottom: 12px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 4px; font-weight: 700; font-size: 11px; color: #495057; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 8px; font-size: 12px; }
        .btn-main { background: var(--sky-gradient); color: white; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-exit-admin { background-color: #e74c3c; color: white; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 12px; }
        .item-list-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
        .item-list-table th, .item-list-table td { border: 1px solid #dee2e6; padding: 6px; text-align: center; }
        .btn-delete-item { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNwIUGqA2dm5Mrx5S06LIEGPJ_VgW3eFc",
            authDomain: "sky-mobile-8e245.firebaseapp.com",
            databaseURL: "https://sky-mobile-8e245-default-rtdb.firebaseio.com",
            projectId: "sky-mobile-8e245",
            messagingSenderId: "1066510361417",
            appId: "1:1066510361417:web:a5e17c7f3c8e267b1d3098"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentAdminPass = "sky2026"; 
        let isInitialLoadDone = false;
        let activeViewSection = 'grid_main'; 

        let globalLinks = {
            appUrl: 'https://play.google.com/store/apps/details?id=com.skymobile.app',
            whatsappUrl: 'https://whatsapp.com/channel/YOUR_CHANNEL_LINK'
        };

        const fontList = [
            { name: 'القاهرة (Cairo)', family: "'Cairo', sans-serif" },
            { name: 'تجوال (Tajawal)', family: "'Tajawal', sans-serif" },
            { name: 'المرعي (Almarai)', family: "'Almarai', sans-serif" },
            { name: 'الإسكندرية (Alexandria)', family: "'Alexandria', sans-serif" },
            { name: 'تشانغا (Changa)', family: "'Changa', sans-serif" }
        ];
        let currentFontIndex = parseInt(localStorage.getItem('sky_font_idx') || '0');

        const DEFAULT_CANVAS_TEMPLATE = {
            id: 'design_wifi_canvas_dynamic',
            title: '🌐 قالب شبكي تفاعلي (مولد آلي)',
            categoryId: 'cat_wifi_networks',
            isGenerated: true,
            image: ''
        };

        let categories = [{ id: 'cat_wifi_networks', name: '📶 تصاميم كروت الشبكات' }];
        let designs = [DEFAULT_CANVAS_TEMPLATE];
        let networkCodes = []; 
        let imageCache = {}; 
        let activeCategory = 'all'; 
        let currentDesignId = DEFAULT_CANVAS_TEMPLATE.id;
        let loadedBaseImage = null;
        let isDynamicCanvasMode = true;
        let renderDebounceTimer = null;
        let logoClickCounter = 0;
        let logoClickTimer = null;
        let searchQuery = "";

        window.onload = function() {
            applyFontToBody();
            listenToCloudData();
            checkUrlForSpecificDesign();
        };

        function applyFontToBody() {
            const fontObj = fontList[currentFontIndex];
            document.documentElement.style.setProperty('--font-current', fontObj.family);
            const fontIndicator = document.getElementById('currentFontName');
            if (fontIndicator) fontIndicator.innerText = fontObj.name;
        }

        function checkUrlForSpecificDesign() {
            const params = new URLSearchParams(window.location.search);
            const designParam = params.get('design');
            if (designParam) {
                currentDesignId = designParam;
                activeViewSection = 'view_designer';
            }
        }

        function listenToCloudData() {
            db.ref('sky_data').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.categories) {
                        const fetchedCats = Object.values(data.categories);
                        if (!fetchedCats.some(c => c.id === 'cat_wifi_networks')) {
                            fetchedCats.unshift({ id: 'cat_wifi_networks', name: '📶 تصاميم كروت الشبكات' });
                        }
                        categories = fetchedCats;
                    }
                    if (data.designs) {
                        const cloudDesigns = Object.values(data.designs);
                        designs = [DEFAULT_CANVAS_TEMPLATE, ...cloudDesigns];
                    } else {
                        designs = [DEFAULT_CANVAS_TEMPLATE];
                    }
                    if (data.links) globalLinks = data.links;
                    if (data.adminPass) currentAdminPass = data.adminPass;
                    if (data.networks) networkCodes = Object.values(data.networks);
                }
                
                if (!isInitialLoadDone) {
                    checkViewState();
                    isInitialLoadDone = true;
                } else {
                    const isAdminMode = sessionStorage.getItem('sky_in_admin_mode') === 'true';
                    const isAuth = sessionStorage.getItem('sky_admin_authenticated') === 'true';
                    if (isAdminMode && isAuth) {
                        renderAdminPanel(document.getElementById('mainContainer'));
                    } else if (activeViewSection === 'view_designer') {
                        debouncedDraw();
                    }
                }
            });
        }

        function checkViewState() {
            const container = document.getElementById('mainContainer');
            const isAdminMode = sessionStorage.getItem('sky_in_admin_mode') === 'true';
            const isAuth = sessionStorage.getItem('sky_admin_authenticated') === 'true';

            if (isAdminMode) {
                if (isAuth) {
                    renderAdminPanel(container);
                } else {
                    renderLoginForm(container);
                }
            } else {
                renderClientPanel(container);
                if (activeViewSection === 'view_designer') {
                    switchView('view_designer');
                }
            }
        }

        function handleSecretLogoClick() {
            logoClickCounter++;
            clearTimeout(logoClickTimer);

            if (logoClickCounter >= 5) {
                logoClickCounter = 0;
                sessionStorage.setItem('sky_in_admin_mode', 'true');
                checkViewState();
            } else {
                logoClickTimer = setTimeout(() => { logoClickCounter = 0; }, 1500);
            }
        }

        function switchView(viewId) {
            activeViewSection = viewId;
            document.querySelectorAll('.service-view-panel').forEach(panel => panel.classList.remove('active'));
            
            if (viewId === 'grid_main') {
                document.getElementById('panel_grid_main').classList.add('active');
                document.getElementById('backHomeBtn').style.display = 'none';
            } else {
                document.getElementById('backHomeBtn').style.display = 'inline-flex';
                const targetPanel = document.getElementById('panel_' + viewId);
                if (targetPanel) targetPanel.classList.add('active');

                if (viewId === 'view_designer') {
                    let filtered = getFilteredDesigns();
                    let currentDesign = designs.find(d => d.id == currentDesignId) || filtered[0] || designs[0];
                    currentDesignId = currentDesign.id;
                    renderClientThumbnails(currentDesignId);
                    loadSelectedDesign(currentDesign);
                }
            }
        }

        function renderClientPanel(container) {
            let networksOptionsHtml = `<option value="" data-name="">اختر شبكتك المسجلة من القائمة</option>`;
            networkCodes.forEach(net => {
                networksOptionsHtml += `<option value="${net.code}" data-name="${net.name}">${net.name} - (رمز: ${net.code})</option>`;
            });

            container.innerHTML = `
                <div class="ticker-wrap">
                    <div class="ticker-move">
                        🔥 أهلاً بكم في تطبيق سكاي موبايل! اختر الخدمة المطلوبة بأحد الأيقونات أدناه 🚀
                    </div>
                </div>

                <header class="brand-header">
                    <div class="brand-logo-wrapper" onclick="handleSecretLogoClick()" title="سكاي موبايل (5 نقرات للوحة التحكم)">
                        <svg class="brand-logo-svg" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#0080FF"/>
                                    <stop offset="100%" stop-color="#003399"/>
                                </linearGradient>
                                <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#0052CC"/>
                                    <stop offset="100%" stop-color="#002966"/>
                                </linearGradient>
                            </defs>
                            <path d="M 120,75 A 75,75 0 0,1 240,65" fill="none" stroke="url(#skyGrad)" stroke-width="12" stroke-linecap="round"/>
                            <rect x="248" y="52" width="10" height="10" fill="#0080FF" rx="1"/>
                            <rect x="262" y="52" width="10" height="10" fill="#0080FF" rx="1"/>
                            <rect x="255" y="65" width="10" height="10" fill="#0080FF" rx="1"/>
                            <text x="200" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="url(#skyGrad)" letter-spacing="-1">SKY</text>
                            <line x1="125" y1="130" x2="155" y2="130" stroke="#003399" stroke-width="2"/>
                            <text x="200" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#003399" letter-spacing="4">MOBILE</text>
                            <line x1="245" y1="130" x2="275" y2="130" stroke="#003399" stroke-width="2"/>
                            <text x="200" y="172" text-anchor="middle" font-family="Cairo, sans-serif" font-weight="800" font-size="28" fill="#002966">سكاي موبايل</text>
                            <rect x="100" y="188" width="200" height="34" rx="17" fill="url(#pillGrad)"/>
                            <text x="200" y="210" text-anchor="middle" font-family="Cairo, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">لخدمات الرصيد والباقات</text>
                        </svg>
                    </div>
                </header>

                <button class="back-home-btn" id="backHomeBtn" style="display:none;" onclick="switchView('grid_main')">
                    🏠 العودة للقائمة الرئيسية
                </button>

                <div id="panel_grid_main" class="service-view-panel active">
                    <div class="services-grid">
                        <div class="service-icon-card" onclick="switchView('view_designer')">
                            <div class="icon-wrapper">🎨</div>
                            <h3>مصمم الإعلانات</h3>
                            <p>تخصيص القوالب وتصميم بطاقة نقطتك</p>
                        </div>
                        <div class="service-icon-card" onclick="switchView('view_telecom')">
                            <div class="icon-wrapper">📱</div>
                            <h3>تسديد الباقات</h3>
                            <p>يمن موبايل، يو، سبأفون، يمن فورجي</p>
                        </div>
                        <div class="service-icon-card" onclick="switchView('view_wifi')">
                            <div class="icon-wrapper">📶</div>
                            <h3>كروت الواي فاي</h3>
                            <p>تسديد واستخراج كروت الشبكات</p>
                        </div>
                        <div class="service-icon-card" onclick="switchView('view_support')">
                            <div class="icon-wrapper">💬</div>
                            <h3>الدعم والروابط</h3>
                            <p>تحميل التطبيق وقناة الواتساب</p>
                        </div>
                    </div>
                </div>

                <div id="panel_view_designer" class="service-view-panel">
                    <div class="top-action-bar">
                        <button class="btn-custom-action btn-reset-default" onclick="resetDefaultData()">↩ إرجاع الأصلي</button>
                        <button class="btn-custom-action btn-change-font" onclick="changeCustomFont()">🔤 تغيير الخط</button>
                    </div>

                    <div class="search-filter-box">
                        <input type="text" placeholder="🔍 ابحث عن تصميم..." oninput="handleSearchInput(this.value)">
                    </div>

                    <div class="categories-scroll" id="catChipsContainer"></div>
                    <div class="templates-preview-scroll" id="templatesScrollContainer"></div>

                    <div class="preview-box">
                        <div id="canvasContainer"><canvas id="previewCanvas"></canvas></div>
                        <details class="color-compact-box">
                            <summary>🎨 اضغط هنا لتخصيص ألوان التصميم</summary>
                            <div class="colors-picker-grid">
                                <div class="color-item"><label>الهيدر:</label><input type="color" id="colBg" value="#0c2461" onchange="debouncedDraw()"></div>
                                <div class="color-item"><label>الرئيسي:</label><input type="color" id="colText1" value="#ffffff" onchange="debouncedDraw()"></div>
                                <div class="color-item"><label>الفرعي:</label><input type="color" id="colText2" value="#00a8ff" onchange="debouncedDraw()"></div>
                                <div class="color-item"><label>الإطار:</label><input type="color" id="colBorder" value="#00a8ff" onchange="debouncedDraw()"></div>
                            </div>
                        </details>

                        <div class="action-links">
                            <button class="link-btn download-img-btn" onclick="downloadImage()">📥 تحميل التصميم</button>
                            <button class="link-btn copy-design-btn" onclick="copyDesignLink()">🔗 نسخ رابط التصميم الحالي</button>
                            <button class="link-btn whatsapp-share-btn" onclick="shareToWhatsApp()">📱 مشاركة عبر الواتساب</button>
                        </div>

        function renderCategoryChips() {
            const container = document.getElementById('catChipsContainer');
            if (!container) return;

            let html = `<div class="cat-chip ${activeCategory==='all'?'active':''}" id="chip_all" onclick="filterByCategory('all')">📁 الكل (${designs.length})</div>`;
            categories.forEach(cat => {
                const count = designs.filter(d => d.categoryId === cat.id).length;
                html += `<div class="cat-chip ${activeCategory===cat.id?'active':''}" id="chip_${cat.id}" onclick="filterByCategory('${cat.id}')">${cat.name} (${count})</div>`;
            });
            container.innerHTML = html;
        }

        function filterByCategory(catId) {
            activeCategory = catId;
            document.querySelectorAll('.cat-chip').forEach(chip => chip.classList.remove('active'));
            const target = document.getElementById('chip_' + catId);
            if(target) target.classList.add('active');

            let filtered = getFilteredDesigns();
            if (filtered.length > 0) {
                currentDesignId = filtered[0].id;
                renderClientThumbnails(filtered[0].id);
                loadSelectedDesign(filtered[0]);
            } else {
                renderClientThumbnails(null);
            }
        }

        function getFilteredDesigns() {
            let list = designs;
            if (activeCategory !== 'all') list = list.filter(d => d.categoryId === activeCategory);
            if (searchQuery) list = list.filter(d => d.title.toLowerCase().includes(searchQuery));
            return list;
        }

        function renderClientThumbnails(selectedId) {
            const scrollBox = document.getElementById('templatesScrollContainer');
            if(!scrollBox) return;
            scrollBox.innerHTML = '';

            let list = getFilteredDesigns();
            if (list.length === 0) {
                scrollBox.innerHTML = `<p style="font-size:11px; color:#64748b; padding:8px;">لا توجد تصاميم.</p>`;
                return;
            }

            list.forEach(item => {
                const isSelected = item.id == selectedId;
                const div = document.createElement('div');
                div.className = `thumb-card ${isSelected ? 'selected' : ''}`;
                div.onclick = () => {
                    currentDesignId = item.id;
                    renderClientThumbnails(item.id);
                    loadSelectedDesign(item);
                };

                if (item.isGenerated) {
                    div.innerHTML = `🌐<br>قالب آلي`;
                } else {
                    div.innerHTML = `<img src="${item.image}" alt="${item.title}">`;
                }
                scrollBox.appendChild(div);
            });
        }

        function loadSelectedDesign(designObj) {
            if(!designObj) return;

            if (designObj.isGenerated) {
                isDynamicCanvasMode = true;
                loadedBaseImage = null;
                drawFinalImage();
                return;
            }

            isDynamicCanvasMode = false;
            if (imageCache[designObj.image] && imageCache[designObj.image].complete) {
                loadedBaseImage = imageCache[designObj.image];
                drawFinalImage();
            } else {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = function() {
                    imageCache[designObj.image] = img;
                    loadedBaseImage = img;
                    drawFinalImage();
                };
                img.src = designObj.image;
            }
        }

        function debouncedDraw() {
            clearTimeout(renderDebounceTimer);
            renderDebounceTimer = setTimeout(drawFinalImage, 80);
        }

        function drawFinalImage() {
            const canvas = document.getElementById('previewCanvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');

            const shopName = document.getElementById('cShop')?.value.trim() || "";
            const address = document.getElementById('cAddress')?.value.trim() || "";
            const phone = document.getElementById('cPhone')?.value.trim() || "";
            const netName = document.getElementById('cNetName')?.value.trim() || "";
            const netCode = document.getElementById('cNetCode')?.value.trim() || "";

            const colBg = document.getElementById('colBg')?.value || "#0c2461";
            const colText1 = document.getElementById('colText1')?.value || "#ffffff";
            const colText2 = document.getElementById('colText2')?.value || "#00a8ff";
            const colBorder = document.getElementById('colBorder')?.value || "#00a8ff";

            const selectedFontFamily = fontList[currentFontIndex].family;

            if (isDynamicCanvasMode || !loadedBaseImage) {
                canvas.width = 800;
                canvas.height = 800;
                
                const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grad.addColorStop(0, colBg);
                grad.addColorStop(1, '#051937');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = colBorder;
                ctx.font = `bold 22px ${selectedFontFamily}`;
                ctx.textAlign = "center";
                ctx.fillText("⚡ شبكة إنترنت عالية السرعة ⚡", canvas.width / 2, canvas.height * 0.35);

                ctx.fillStyle = "#ffffff";
                ctx.font = `bold 36px ${selectedFontFamily}`;
                ctx.fillText("تغطية قوية • ثبات فائق • كروت متوفرة", canvas.width / 2, canvas.height * 0.45);
            } else {
                const hasFooterData = shopName || address || phone;
                const footerHeight = hasFooterData ? Math.max(90, loadedBaseImage.height * 0.14) : 0;

                canvas.width = loadedBaseImage.width;
                canvas.height = loadedBaseImage.height + footerHeight;

                ctx.drawImage(loadedBaseImage, 0, 0, loadedBaseImage.width, loadedBaseImage.height);

                if (hasFooterData) {
                    const footerY = loadedBaseImage.height;
                    ctx.fillStyle = colBg;
                    ctx.fillRect(0, footerY, canvas.width, footerHeight);

                    ctx.fillStyle = colBorder;
                    ctx.fillRect(0, footerY, canvas.width, 4);

                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";

                    if (shopName) {
                        ctx.font = `bold ${footerHeight * 0.30}px ${selectedFontFamily}`;
                        ctx.fillStyle = colText1;
                        ctx.fillText(shopName, canvas.width / 2, footerY + (footerHeight * 0.35));
                    }

                    const subDetails = [address ? "📍 " + address : "", phone ? "📞 " + phone : ""].filter(Boolean).join("  |  ");
                    if (subDetails) {
                        ctx.font = `${footerHeight * 0.22}px ${selectedFontFamily}`;
                        ctx.fillStyle = colText2;
                        ctx.fillText(subDetails, canvas.width / 2, footerY + (footerHeight * 0.72));
                    }
                }
            }

            const topBadgeHeight = canvas.height * 0.06;
            ctx.fillStyle = colBg;
            ctx.fillRect(0, 0, canvas.width, topBadgeHeight);
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = colText1;
            ctx.font = `bold ${topBadgeHeight * 0.55}px ${selectedFontFamily}`;
            ctx.fillText("⭐ نقطة بيع معتمد لتطبيق سكاي موبايل ⭐", canvas.width / 2, topBadgeHeight / 2);

            if (netName || netCode) {
                const netBadgeHeight = canvas.height * 0.10;
                const netBadgeWidth = canvas.width * 0.70;
                const netX = (canvas.width - netBadgeWidth) / 2;
                const netY = topBadgeHeight + 10;

                ctx.fillStyle = colBg;
                ctx.strokeStyle = colBorder;
                ctx.lineWidth = 3;
                ctx.fillRect(netX, netY, netBadgeWidth, netBadgeHeight);
                ctx.strokeRect(netX, netY, netBadgeWidth, netBadgeHeight);

                ctx.fillStyle = colText1;
                ctx.font = `bold ${netBadgeHeight * 0.35}px ${selectedFontFamily}`;
                ctx.fillText(netName ? `📶 ${netName}` : "", canvas.width / 2, netY + (netBadgeHeight * 0.32));

                ctx.fillStyle = colText2;
                ctx.font = `bold ${netBadgeHeight * 0.30}px ${selectedFontFamily}`;
                ctx.fillText(netCode ? `رمز الشبكة بالتطبيق: (${netCode})` : "", canvas.width / 2, netY + (netBadgeHeight * 0.72));
            }
        }

        function autoMatchNetworkCode() {
            const codeInput = document.getElementById('cNetCode');
            const nameInput = document.getElementById('cNetName');
            const selectEl = document.getElementById('cNetSelect');
            if(!codeInput) return;

            const typedCode = codeInput.value.trim();
            if (typedCode) {
                const matched = networkCodes.find(n => n.code == typedCode);
                if (matched) {
                    if (nameInput) nameInput.value = matched.name;
                    if (selectEl) selectEl.value = matched.code;
                }
            }
            debouncedDraw();
        }

        /* دالة تحويل الصور المرفوعة من الجهاز إلى Base64 */
        let uploadedBase64Temp = "";
        function convertImageToBase64(fileInput) {
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    uploadedBase64Temp = e.target.result;
                    document.getElementById('newDesignImageUrl').value = "تم رفع الصورة من الجهاز ✓";
                };
                reader.readAsDataURL(file);
            }
        }

        function addNewDesign() {
            const title = document.getElementById('newDesignTitle').value.trim();
            const categoryId = document.getElementById('newDesignCategory').value;
            let imageUrl = document.getElementById('newDesignImageUrl').value.trim();

            if (uploadedBase64Temp && imageUrl.includes("تم رفع الصورة")) {
                imageUrl = uploadedBase64Temp;
            }

            if (!title || !imageUrl) {
                alert("يرجى إدخال عنوان القالب ورابط الصورة أو اختيار ملف!");
                return;
            }

            const id = 'design_' + Date.now();
            db.ref('sky_data/designs/' + id).set({
                id: id,
                title: title,
                categoryId: categoryId,
                image: imageUrl,
                isGenerated: false
            }).then(() => {
                alert("✅ تم إضافة القالب بنجاح!");
                uploadedBase64Temp = "";
            });
        }

        function deleteDesign(id) {
            if (confirm("هل أنت تأكد من حذف هذا القالب؟")) {
                db.ref('sky_data/designs/' + id).remove();
            }
        }

        function addNewCategory() {
            const name = document.getElementById('newCategoryName').value.trim();
            if (!name) { alert("أدخل اسم القسم!"); return; }
            const id = 'cat_' + Date.now();
            db.ref('sky_data/categories/' + id).set({ id: id, name: name }).then(() => {
                alert("✅ تم إضافة القسم!");
            });
        }

        function deleteCategory(id) {
            if (confirm("هل أنت تأكد من حذف هذا القسم؟")) {
                db.ref('sky_data/categories/' + id).remove();
            }
        }

        function addNewNetwork() {
            const name = document.getElementById('newNetName').value.trim();
            const code = document.getElementById('newNetCode').value.trim();
            if (!name || !code) { alert("أدخل اسم الشبكة ورمزها!"); return; }
            const id = 'net_' + Date.now();
            db.ref('sky_data/networks/' + id).set({ id: id, name: name, code: code }).then(() => {
                alert("✅ تم تسجيل الشبكة!");
            });
        }

        function deleteNetwork(id) {
            if (confirm("هل تريد حذف هذه الشبكة؟")) {
                db.ref('sky_data/networks/' + id).remove();
            }
        }

        function saveGlobalLinks() {
            const appUrl = document.getElementById('linkAppUrl').value.trim();
            const whatsappUrl = document.getElementById('linkWhatsappUrl').value.trim();
            db.ref('sky_data/links').set({ appUrl: appUrl, whatsappUrl: whatsappUrl }).then(() => {
                alert("✅ تم تحديث الروابط الرسمية!");
            });
        }

        function changeAdminPassword() {
            const newPass = document.getElementById('newAdminPasswordInput').value.trim();
            if (newPass) {
                db.ref('sky_data/adminPass').set(newPass).then(() => {
                    alert("✅ تم تحديث كلمة السر بنجاح!");
                    currentAdminPass = newPass;
                });
            } else {
                alert("أدخل كلمة سر صالحة!");
            }
        }
    </script>
</body>
</html>
