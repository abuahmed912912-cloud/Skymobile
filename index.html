<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سكاي موبايل - مصمم البطاقات الفوري</title>
    
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://sky-mobile-8e245-default-rtdb.firebaseio.com" crossorigin>

    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f0f2f5; color: #333; padding: 10px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .admin-header { background: linear-gradient(135deg, #007bff, #0056b3); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .admin-header h2 { font-size: 22px; margin-bottom: 5px; }
        .admin-header p { font-size: 13px; opacity: 0.9; }

        .top-nav-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-home { flex: 1; background-color: #007bff; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-logout { flex: 1; background-color: #ff4d4d; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }

        .client-input-card { background: #f8f9fa; border: 1px solid #e2e8f0; padding: 12px 15px; border-radius: 12px; margin-bottom: 12px; }
        .client-input-card label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 13px; color: #0056b3; }
        .client-input-card input, .client-input-card select { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #fff; outline: none; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #495057; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 10px; font-size: 14px; background: #fff; }
        .btn-main { background-color: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; }

        .categories-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
        .cat-chip { background: #fff; border: 1px solid #ced4da; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; color: #495057; }
        .cat-chip.active { background: #007bff; color: #fff; border-color: #007bff; }

        .templates-preview-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; min-height: 100px; }
        .thumb-card { flex: 0 0 75px; height: 95px; border-radius: 8px; overflow: hidden; border: 2px solid #ced4da; cursor: pointer; background: #eee; }
        .thumb-card.selected { border-color: #007bff; box-shadow: 0 0 8px rgba(0,123,255,0.5); transform: scale(1.05); }
        .thumb-card img { width: 100%; height: 100%; object-fit: cover; }

        .preview-box { background: #fff; border: 2px dashed #007bff; padding: 15px; border-radius: 14px; margin-top: 15px; }
        #canvasContainer { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 15px; background: #222; text-align: center; }
        #previewCanvas { width: 100%; height: auto; display: block; }

        .external-actions-section { margin-top: 15px; padding-top: 15px; border-top: 2px solid #e9ecef; }
        .action-links { display: flex; flex-direction: column; gap: 10px; }
        .link-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 15px; text-align: center; color: white; border: none; cursor: pointer; }
        .download-img-btn { background-color: #007bff; }
        .whatsapp-share-btn { background-color: #25d366; }
        .copy-link-btn { background-color: #6c757d; }
        .app-download-btn { background-color: #17a2b8; }
        .whatsapp-channel-btn { background-color: #128c7e; }

        .client-credits-footer { margin-top: 20px; padding-top: 12px; border-top: 1px solid #e9ecef; text-align: center; font-size: 12px; color: #6c757d; font-weight: 600; }
        .admin-card { background: #fff; border: 1px solid #e9ecef; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .sub-img-list { font-size: 13px; color: #555; margin: 8px 0; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .btn-delete { background-color: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNwIUGqA2dm5Mrx5S06LIEGPJ_VgW3eFc",
            authDomain: "sky-mobile-8e245.firebaseapp.com",
            databaseURL: "https://sky-mobile-8e245-default-rtdb.firebaseio.com",
            projectId: "sky-mobile-8e245",
            storageBucket: "sky-mobile-8e245.firebasestorage.app",
            messagingSenderId: "1066510361417",
            appId: "1:1066510361417:web:a5e17c7f3c8e267b1d3098"
        };

        let db = null;
        let currentAdminPass = "sky2026";
        let globalLinks = { 
            appUrl: 'https://play.google.com/store/apps', 
            whatsappUrl: 'https://whatsapp.com/channel/0029VaXXXXXXXXXX' 
        };
        
        let defaultCategories = [
            { id: 'cat_net', name: '📶 الشبكات والخدمات' },
            { id: 'cat_pay', name: '💳 الدفع الإلكتروني' }
        ];

        let defaultDesigns = [
            { id: 'ds_1', title: 'قالب التسديد الشامل', image: 'https://via.placeholder.com/1080x1920/007bff/ffffff?text=Sky+Mobile+Pay', categoryId: 'cat_pay' },
            { id: 'ds_2', title: 'قالب كروت الشبكة', image: 'https://via.placeholder.com/1080x1920/0056b3/ffffff?text=Sky+Mobile+Net', categoryId: 'cat_net' }
        ];

        let categories = [...defaultCategories];
        let designs = [...defaultDesigns];
        let wifiNetworks = [];
        
        let selectedFont = "system-ui, -apple-system, sans-serif";
        let activeCategory = 'all'; 
        let currentDesignId = null;
        let loadedBaseImage = null;

        document.addEventListener('DOMContentLoaded', () => {
            checkRoute(); 
            initFirebaseFast();
        });

        function initFirebaseFast() {
            let attempts = 0;
            let checkFirebase = setInterval(() => {
                attempts++;
                if (typeof firebase !== 'undefined') {
                    clearInterval(checkFirebase);
                    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                    db = firebase.database();
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    const shareId = urlParams.get('share');
                    
                    if (shareId) {
                        loadSharedConfig(shareId);
                    } else {
                        fetchCloudDataOnce();
                    }
                }
                if (attempts > 30) { 
                    clearInterval(checkFirebase); 
                    updateUIElements(); 
                }
            }, 50);
        }

        function loadSharedConfig(shareId) {
            db.ref('sky_data/shares/' + shareId).once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data) {
                    currentDesignId = data.d || null;
                    fetchCloudDataOnce(() => {
                        if (document.getElementById('cShop')) document.getElementById('cShop').value = data.s || '';
                        if (document.getElementById('cAddress')) document.getElementById('cAddress').value = data.a || 'متوفر لدينا كافة الخدمات';
                        if (document.getElementById('cPhone')) document.getElementById('cPhone').value = data.p || '738328251';
                        drawFinalImage();
                    });
                } else {
                    fetchCloudDataOnce();
                }
            }).catch(() => fetchCloudDataOnce());
        }

        function fetchCloudDataOnce(callback) {
            if (!db) return;
            db.ref('sky_data').once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.categories) categories = Array.isArray(data.categories) ? data.categories : Object.values(data.categories);
                    if (data.designs) designs = Array.isArray(data.designs) ? data.designs : Object.values(data.designs);
                    if (data.links) globalLinks = { ...globalLinks, ...data.links };
                    if (data.adminPass) currentAdminPass = data.adminPass;
                    if (data.wifiNetworks) wifiNetworks = Array.isArray(data.wifiNetworks) ? data.wifiNetworks : Object.values(data.wifiNetworks);
                }
                updateUIElements();
                if (callback) callback();
            }).catch(() => {
                updateUIElements();
            });
        }

        function checkRoute() {
            const container = document.getElementById('mainContainer');
            const isAdminLoggedIn = sessionStorage.getItem('sky_admin_logged') === 'true';
            const urlParams = new URLSearchParams(window.location.search);

            if (isAdminLoggedIn) {
                renderAdminPanel(container);
            } else if (urlParams.has('admin')) {
                renderLoginBox(container);
            } else {
                renderClientPanel(container);
            }
        }

        function updateUIElements() {
            const container = document.getElementById('mainContainer');
            const isAdminLoggedIn = sessionStorage.getItem('sky_admin_logged') === 'true';
            const urlParams = new URLSearchParams(window.location.search);

            if (isAdminLoggedIn) {
                renderAdminPanel(container);
            } else if (!urlParams.has('admin')) {
                let targetDesign = designs.find(d => d.id == currentDesignId);
                if (!targetDesign && designs.length > 0) {
                    let filtered = getFilteredDesigns();
                    targetDesign = filtered[0] || designs[0];
                }

                if (targetDesign) {
                    currentDesignId = targetDesign.id;
                    renderClientThumbnails(targetDesign.id);
                    if (!loadedBaseImage || loadedBaseImage.src !== targetDesign.image) {
                        loadSelectedDesign(targetDesign);
                    }
                } else {
                    renderClientThumbnails(null);
                }
                
                const btnApp = document.getElementById('btnAppDownload');
                const btnWa = document.getElementById('btnWhatsappChannel');
                if(btnApp) btnApp.href = globalLinks.appUrl || '#';
                if(btnWa) btnWa.href = globalLinks.whatsappUrl || '#';
            }
        }

        function renderLoginBox(container) {
            container.innerHTML = `
                <div class="admin-header">
                    <h2>🔐 لوحة التحكم خاصة بالمدير فقط</h2>
                    <p>يرجى إدخال كلمة المرور للوصول</p>
                </div>
                <div class="form-group">
                    <label>كلمة المرور:</label>
                    <input type="password" id="adminPassInput" placeholder="أدخل كلمة المرور الحصرية">
                </div>
                <button class="btn-main" onclick="verifyPassword()">دخول الإدارة</button>
                <div style="text-align: center; margin-top: 15px;">
                    <a href="?" style="color: #007bff; text-decoration: none; font-size: 13px;">⬅ العودة لتصاميم العملاء</a>
                </div>
            `;
        }

        function verifyPassword() {
            const pass = document.getElementById('adminPassInput').value.trim();
            if (pass === currentAdminPass) {
                sessionStorage.setItem('sky_admin_logged', 'true');
                window.location.href = "?admin=true";
            } else { 
                alert('خطأ: كلمة المرور غير صحيحة!'); 
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('sky_admin_logged');
            window.location.href = "?";
        }

        function renderClientPanel(container) {
            let targetDesign = designs.find(d => d.id == currentDesignId);
            if (!targetDesign && designs.length > 0) {
                let filtered = getFilteredDesigns();
                targetDesign = filtered[0] || designs[0];
            }
            if (targetDesign) currentDesignId = targetDesign.id;

            let categoriesHtml = `<div class="cat-chip ${activeCategory==='all'?'active':''}" onclick="filterByCategory('all')">📂 الكل (${designs.length})</div>`;
            categories.forEach(cat => {
                const count = designs.filter(d => d.categoryId === cat.id).length;
                categoriesHtml += `<div class="cat-chip ${activeCategory===cat.id?'active':''}" onclick="filterByCategory('${cat.id}')">${cat.name} (${count})</div>`;
            });

            let wifiOptionsHtml = `<option value="">-- اختر شبكة الواي فاي (اختياري) --</option>` + wifiNetworks.map(net => `<option value="${net.id}">${net.name} ${net.code ? '(' + net.code + ')' : ''}</option>`).join('');

            container.innerHTML = `
                <header style="text-align: center; margin-bottom: 15px; border-bottom: 2px solid #007bff; padding-bottom: 10px;">
                    <h1 style="color: #007bff; font-size: 20px;">🎨 مصمم البطاقات الفوري - سكاي موبايل</h1>
                </header>

                <div class="categories-scroll" id="categoriesBox">${categoriesHtml}</div>

                <div class="templates-preview-scroll" id="templatesScrollContainer"></div>

                <div class="client-input-card">
                    <label>📶 اختر شبكة الواي فاي (إذا كنت صاحب شبكة):</label>
                    <select id="cWifiNet" onchange="toggleInputMode()">
                        ${wifiOptionsHtml}
                    </select>
                </div>

                <div id="normalClientFields">
                    <div class="client-input-card">
                        <label>🏪 اسم المحل / العميل:</label>
                        <input type="text" id="cShop" placeholder="أدخل الاسم هنا" oninput="drawFinalImage()">
                    </div>

                    <div class="client-input-card">
                        <label>📍 العنوان:</label>
                        <input type="text" id="cAddress" value="متوفر لدينا كافة الخدمات" oninput="drawFinalImage()">
                    </div>
                </div>

                <div class="client-input-card">
                    <label>📞 رقم الهاتف للتواصل:</label>
                    <input type="text" id="cPhone" value="738328251" oninput="drawFinalImage()">
                </div>

                <div class="preview-box">
                    <div id="canvasContainer">
                        <canvas id="previewCanvas"></canvas>
                    </div>

                    <div class="external-actions-section">
                        <div class="action-links">
                            <button class="link-btn download-img-btn" onclick="downloadImage()">📥 تحميل وحفظ الصورة</button>
                            <button class="link-btn whatsapp-share-btn" onclick="shareToWhatsApp()">📱 مشاركة عبر الواتساب</button>
                            <button class="link-btn copy-link-btn" onclick="copyDesignLink()">📋 نسخ رابط التصميم المختصر</button>
                            <a id="btnAppDownload" href="${globalLinks.appUrl}" target="_blank" rel="noopener noreferrer" class="link-btn app-download-btn">📲 تحميل تطبيق سكاي موبايل من المتجر</a>
                            <a id="btnWhatsappChannel" href="${globalLinks.whatsappUrl}" target="_blank" rel="noopener noreferrer" class="link-btn whatsapp-channel-btn">💬 الانضمام لقناة الواتساب الرسمية</a>
                        </div>
                    </div>
                </div>

                <div class="client-credits-footer">
                    جميع الحقوق محفوظة © سكاي موبايل
                </div>
            `;

            renderClientThumbnails(currentDesignId);
            if (targetDesign) loadSelectedDesign(targetDesign);
        }

        function toggleInputMode() {
            const wifiVal = document.getElementById('cWifiNet').value;
            const normalFields = document.getElementById('normalClientFields');
            if (wifiVal) {
                if (normalFields) normalFields.style.display = 'none';
            } else {
                if (normalFields) normalFields.style.display = 'block';
            }
            drawFinalImage();
        }

        function filterByCategory(catId) {
            activeCategory = catId;
            renderClientPanel(document.getElementById('mainContainer'));
        }

        function getFilteredDesigns() {
            if (activeCategory === 'all') return designs;
            return designs.filter(d => d.categoryId === activeCategory);
        }

        function renderClientThumbnails(selectedId) {
            const scrollBox = document.getElementById('templatesScrollContainer');
            if(!scrollBox) return;

            let displayDesigns = getFilteredDesigns();
            if (displayDesigns.length === 0) {
                scrollBox.innerHTML = '<p style="font-size: 13px; color: #777; padding: 10px; width:100%; text-align:center;">لا توجد قوالب مضافة حالياً في هذا القسم. يرجى إضافتها من لوحة التحكم.</p>';
                return;
            }

            scrollBox.innerHTML = '';
            displayDesigns.forEach(item => {
                const card = document.createElement('div');
                card.className = `thumb-card ${item.id == selectedId ? 'selected' : ''}`;
                card.onclick = () => {
                    currentDesignId = item.id;
                    renderClientThumbnails(item.id);
                    loadSelectedDesign(item);
                };
                card.innerHTML = `<img src="${item.image}" alt="${item.title}" loading="lazy">`;
                scrollBox.appendChild(card);
            });
        }

        function loadSelectedDesign(designObj) {
            if (!designObj || !designObj.image) return;
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = designObj.image;
            img.onload = function() {
                loadedBaseImage = img;
                drawFinalImage();
            };
            img.onerror = function() {
                console.error("تعذر تحميل صورة التصميم:", designObj.image);
            };
        }

        function drawEdgeBanner(ctx, x, y, w, h, fillColor, strokeColor) {
            ctx.beginPath();
            ctx.rect(x, y, w, h);
            ctx.fillStyle = fillColor;
            ctx.fill();
            if (strokeColor) {
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        function drawFinalImage() {
            const canvas = document.getElementById('previewCanvas');
            if (!canvas || !loadedBaseImage) return;

            const ctx = canvas.getContext('2d');
            const img = loadedBaseImage;

            canvas.width = img.naturalWidth || 1080;
            canvas.height = img.naturalHeight || 1920;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const shopText = document.getElementById('cShop')?.value.trim() || '';
            const addressText = document.getElementById('cAddress')?.value.trim() || 'متوفر لدينا كافة الخدمات';
            const phoneText = document.getElementById('cPhone')?.value.trim() || '';
            const selectedWifiId = document.getElementById('cWifiNet')?.value || '';

            if (selectedWifiId) {
                const netObj = wifiNetworks.find(n => n.id === selectedWifiId);
                if (netObj) {
                    const wifiText = `📶 شبكة: ${netObj.name} ${netObj.code ? '(' + netObj.code + ')' : ''}`;
                    const fontSize = Math.round(canvas.width * 0.045);
                    ctx.font = `bold ${fontSize}px ${selectedFont}`;
                    const boxWidth = canvas.width; 
                    const boxHeight = fontSize * 2.2;
                    
                    drawEdgeBanner(ctx, 0, 0, boxWidth, boxHeight, 'rgba(0, 30, 60, 0.95)', '#facc15');

                    ctx.fillStyle = '#facc15';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(wifiText, canvas.width / 2, boxHeight / 2);
                }

                const appBuyText = '💳 يمكنكم شراء كروت الشبكة عبر تطبيق سكاي موبايل';
                const appFontSize = Math.round(canvas.width * 0.038);
                ctx.font = `bold ${appFontSize}px ${selectedFont}`;
                const appBoxWidth = canvas.width; 
                const appBoxHeight = appFontSize * 2.2;
                const appBoxY = canvas.height - appBoxHeight; 

                drawEdgeBanner(ctx, 0, appBoxY, appBoxWidth, appBoxHeight, 'rgba(0, 30, 60, 0.95)', '#007bff');

                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(appBuyText, canvas.width / 2, appBoxY + (appBoxHeight / 2));

            } else {
                if (shopText) {
                    const shopFontSize = Math.round(canvas.width * 0.05);
                    ctx.font = `bold ${shopFontSize}px ${selectedFont}`;
                    const shopBoxW = canvas.width;
                    const shopBoxH = shopFontSize * 2.2;
                    const shopBoxX = 0;
                    const shopBoxY = 0;

                    drawEdgeBanner(ctx, shopBoxX, shopBoxY, shopBoxW, shopBoxH, 'rgba(0, 20, 40, 0.92)', '#007bff');

                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(shopText, canvas.width / 2, shopBoxY + (shopBoxH / 2));
                }

                const badgeText = '✔ نقطة بيع معتمد لتطبيق سكاي موبايل';
                const badgeFontSize = Math.round(canvas.width * 0.029); 
                ctx.font = `bold ${badgeFontSize}px ${selectedFont}`;
                const badgeMetrics = ctx.measureText(badgeText);
                
                const padX = 24, padY = 14;
                const badgeBoxW = badgeMetrics.width + (padX * 2);
                const badgeBoxH = badgeFontSize + (padY * 2);
                const badgeBoxX = 0; 
                const badgeBoxY = canvas.height - badgeBoxH; 

                drawEdgeBanner(ctx, badgeBoxX, badgeBoxY, badgeBoxW, badgeBoxH, 'rgba(0, 20, 40, 0.92)', '#facc15');
                
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(badgeText, badgeBoxX + padX, badgeBoxY + (badgeBoxH / 2));

                const addressString = '📍 ' + addressText;
                const addressFontSize = Math.round(canvas.width * 0.032);
                ctx.font = `bold ${addressFontSize}px ${selectedFont}`;
                const addrMetrics = ctx.measureText(addressString);

                const aPadX = 18, aPadY = 10;
                const addrBoxW = addrMetrics.width + (aPadX * 2);
                const addrBoxH = addressFontSize + (aPadY * 2);

                let phoneBoxW = 0, phoneBoxH = 0, phoneBoxY = 0;
                if (phoneText) {
                    const phoneFontSize = Math.round(canvas.width * 0.03);
                    ctx.font = `bold ${phoneFontSize}px ${selectedFont}`;
                    const phoneString = '📞 ' + phoneText;
                    const phoneMetrics = ctx.measureText(phoneString);

                    const pPadX = 20, pPadY = 10;
                    phoneBoxW = phoneMetrics.width + (pPadX * 2);
                    phoneBoxH = phoneFontSize + (pPadY * 2);
                    
                    const phoneBoxX = canvas.width - phoneBoxW; 
                    phoneBoxY = canvas.height - phoneBoxH;

                    drawEdgeBanner(ctx, phoneBoxX, phoneBoxY, phoneBoxW, phoneBoxH, 'rgba(0, 20, 40, 0.92)', '#facc15');

                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(phoneString, phoneBoxX + (phoneBoxW / 2), phoneBoxY + (phoneBoxH / 2));
                }

                const addrBoxX = canvas.width - addrBoxW;
                const addrBoxY = phoneText ? (phoneBoxY - addrBoxH) : (canvas.height - addrBoxH);

                drawEdgeBanner(ctx, addrBoxX, addrBoxY, addrBoxW, addrBoxH, 'rgba(0, 20, 40, 0.92)', 'rgba(255, 255, 255, 0.3)');

                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(addressString, addrBoxX + (addrBoxW / 2), addrBoxY + (addrBoxH / 2));
            }
        }

        function downloadImage() {
            const canvas = document.getElementById('previewCanvas');
            if (!canvas) return;
            const link = document.createElement('a');
            link.download = `sky_mobile_design_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function shareToWhatsApp() {
            alert('يرجى تحميل الصورة أولاً ثم إرسالها عبر تطبيق الواتساب.');
        }

        function copyDesignLink() {
            const shop = document.getElementById('cShop')?.value.trim() || '';
            const address = document.getElementById('cAddress')?.value.trim() || '';
            const phone = document.getElementById('cPhone')?.value.trim() || '';
            const designId = currentDesignId || '';

            const shortId = Math.random().toString(36).substring(2, 8);

            const shareData = {
                d: designId,
                s: shop,
                a: address,
                p: phone,
                created: Date.now()
            };

            if (db) {
                db.ref('sky_data/shares/' + shortId).set(shareData).then(() => {
                    const shortUrl = `${window.location.origin}${window.location.pathname}?share=${shortId}`;
                    navigator.clipboard.writeText(shortUrl).then(() => {
                        alert('تم نسخ الرابط المختصر بنجاح!\n\n' + shortUrl);
                    });
                }).catch(() => {
                    alert('حدث خطأ في الاتصال بالسحابة');
                });
            }
        }

                const catObj = categories.find(c => c.id === d.categoryId);

                    <div class="sub-img-list">
                        <span><b>${d.title}</b> (${catName})</span>
                        <button class="btn-delete" onclick="deleteDesign('${d.id}')">حذف</button>

            let categoriesListHtml = '';

                    <div class="sub-img-list">
                        <span><b>${c.name}</b></span>
                        <button class="btn-delete" onclick="deleteCategory('${c.id}')">حذف القسم</button>
                    </div>

            });

            let wifiListHtml = '';
            wifiNetworks.forEach(w => {
                wifiListHtml += `
                    <div class="sub-img-list">
                        <span><b>${w.name}</b> (${w.code})</span>
                        <button class="btn-delete" onclick="deleteWifi('${w.id}')">حذف</button>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="admin-header">
                    <h2>⚙️ لوحة تحكم الأدمن (خاصة بالمالك)</h2>
                </div>

                <div class="top-nav-buttons">
                    <a href="?" class="btn-home">🏠 العودة لتصاميم العملاء</a>
                    <button class="btn-logout" onclick="logoutAdmin()">🚪 خروج آمن</button>
                </div>

                <!-- قسم إدارة الروابط الخارجية المفعل -->
                <div class="admin-card" style="border: 2px solid #007bff;">
                    <h3>🔗 تعديل روابط المتجر والواتساب الرسمية</h3>
                    <div class="form-group" style="margin-top:10px;">
                        <label>رابط تحميل التطبيق المباشر (Google Play / APK):</label>
                        <input type="text" id="appUrlInput" value="${globalLinks.appUrl}" placeholder="ضع رابط التطبيق هنا">
                    </div>
                    <div class="form-group">
                        <label>رابط قناة الواتساب المباشر:</label>
                        <input type="text" id="whatsappUrlInput" value="${globalLinks.whatsappUrl}" placeholder="https://whatsapp.com/channel/...">
                    </div>
                    <button class="btn-main" onclick="saveGlobalLinks()">💾 حفظ الروابط وتحديث الموقع</button>
                </div>

                <!-- إدارة الأقسام -->
                <div class="admin-card">
                    <h3>📁 إضافة قسم تصاميم جديد</h3>
                    <div class="form-group" style="margin-top:10px;">
                        <label>اسم القسم (مع إيموجي):</label>
                        <input type="text" id="newCatName" placeholder="مثال: ⚡ عروض سريعة">
                    </div>
                    <button class="btn-main" onclick="addNewCategory()">➕ إضافة القسم بالسحابة</button>
                </div>

                <div class="admin-card">
                    <h3>قائمة الأقسام المتاحة (${categories.length})</h3>
                    ${categoriesListHtml || '<p style="font-size:12px; color:#888;">لا توجد أقسام</p>'}
                </div>

                <!-- إدارة القوالب -->
                <div class="admin-card">
                    <h3>🖼️ إضافة تصميم (قالب) جديد</h3>
                    <div class="form-group" style="margin-top:10px;">
                        <label>عنوان التصميم:</label>
                        <input type="text" id="newDesignTitle" placeholder="عنوان التصميم">
                    </div>
                    
                    <div class="form-group">
                        <label>📁 اختر صورة القالب من الاستديو / المعرض:</label>
                        <input type="file" id="newDesignFile" accept="image/*" onchange="handleImageFileUpload(event)" style="padding: 8px;">
                    </div>

                    <div class="form-group">
                        <label>أو ضع رابط الصورة المباشر (URL):</label>
                        <input type="text" id="newDesignImg" placeholder="https://...">
                    </div>

                    <div class="form-group">
                        <label>اختر القسم:</label>
                        <select id="newDesignCat">
                            ${categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                        </select>
                    </div>
                    <button class="btn-main" onclick="addNewDesign()">➕ إضافة وحفظ القالب بالسحابة</button>
                </div>

                <div class="admin-card">
                    <h3>إدارة القوالب الحالية (${designs.length})</h3>
                    ${designsListHtml || '<p style="font-size:12px; color:#888;">لا توجد تصاميم مسجلة</p>'}
                </div>

                <!-- إدارة الواي فاي -->
                <div class="admin-card">
                    <h3>📶 إضافة شبكة واي فاي جديدة</h3>
                    <div class="form-group" style="margin-top:10px;">
                        <label>اسم الشبكة:</label>
                        <input type="text" id="newWifiName" placeholder="مثال: شبكة العدالة نت">
                    </div>
                    <div class="form-group">
                        <label>رقم الشبكة (الكود):</label>
                        <input type="text" id="newWifiCode" placeholder="مثال: NW-105">
                    </div>
                    <button class="btn-main" onclick="addNewWifi()">➕ إضافة الشبكة للسحابة</button>
                </div>

                <div class="admin-card">
                    <h3>إدارة الشبكات المتاحة (${wifiNetworks.length})</h3>
                    ${wifiListHtml || '<p style="font-size:12px; color:#888;">لا توجد شبكات مضافة</p>'}
                </div>

                <div class="admin-card">
                    <h3>🔑 تغيير كلمة مرور الأدمن الحصرية</h3>
                    <div class="form-group" style="margin-top:10px;">
                        <label>كلمة المرور الجديدة:</label>
                        <input type="password" id="newAdminPass" placeholder="أدخل كلمة مرور جديدة قوية">
                    </div>
                    <button class="btn-main" onclick="saveAdminPassword()">تغيير كلمة السر</button>
                </div>
            `;
        }

        function handleImageFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    const maxDim = 1200;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.82);
                    const urlInput = document.getElementById('newDesignImg');
                    if (urlInput) urlInput.value = compressedBase64;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function addNewCategory() {
            const nameInput = document.getElementById('newCatName');
            const name = nameInput ? nameInput.value.trim() : '';
            if (!name) return alert('يرجى أدخال اسم القسم!');

            const newCat = { id: 'cat_' + Date.now(), name: name };
            categories.push(newCat);
            
            if (db) {
                db.ref('sky_data/categories').set(categories).then(() => {
                    alert('تمت إضافة القسم بنجاح!');
                    renderAdminPanel(document.getElementById('mainContainer'));
                }).catch(err => {
                    alert('خطأ في حفظ البيانات: ' + err.message);
                });
            } else {
                renderAdminPanel(document.getElementById('mainContainer'));
            }
        }

        function deleteCategory(id) {
            if (confirm('هل أنت متأكد من حذف هذا القسم؟')) {
                categories = categories.filter(c => c.id !== id);
                if (db) {
                    db.ref('sky_data/categories').set(categories).then(() => {
                        alert('تم حذف القسم!');
                        renderAdminPanel(document.getElementById('mainContainer'));
                    });
                } else {
                    renderAdminPanel(document.getElementById('mainContainer'));
                }
            }
        }

        function addNewWifi() {
            const nameInput = document.getElementById('newWifiName');
            const codeInput = document.getElementById('newWifiCode');
            const name = nameInput ? nameInput.value.trim() : '';
            const code = codeInput ? codeInput.value.trim() : '';
            if (!name) return alert('يرجى كتابة اسم الشبكة على الأقل!');

            const newWifi = { id: 'wifi_' + Date.now(), name: name, code: code };
            wifiNetworks.push(newWifi);

            if (db) {
                db.ref('sky_data/wifiNetworks').set(wifiNetworks).then(() => {
                    alert('تمت إضافة الشبكة بنجاح!');
                    renderAdminPanel(document.getElementById('mainContainer'));
                });
            } else {
                renderAdminPanel(document.getElementById('mainContainer'));
            }
        }

        function deleteWifi(id) {
            if (confirm('هل أنت متأكد من حذف هذه الشبكة؟')) {
                wifiNetworks = wifiNetworks.filter(w => w.id !== id);
                if (db) {
                    db.ref('sky_data/wifiNetworks').set(wifiNetworks).then(() => {
                        alert('تم الحذف!');
                        renderAdminPanel(document.getElementById('mainContainer'));
                    });
                } else {
                    renderAdminPanel(document.getElementById('mainContainer'));
                }

        function addNewDesign() {
            const titleInput = document.getElementById('newDesignTitle');
            const imgInput = document.getElementById('newDesignImg');
            const catSelect = document.getElementById('newDesignCat');

            const title = titleInput ? titleInput.value.trim() : '';
            const image = imgInput ? imgInput.value.trim() : '';
            const categoryId = catSelect ? catSelect.value : '';

            if (!title || !image) return alert('يرجى اختيار صورة من الاستديو أو إدخال عنوان ورابط الصورة!');

            const newDesign = { id: 'ds_' + Date.now(), title: title, image: image, categoryId: categoryId };
            designs.push(newDesign);

            if (db) {
                db.ref('sky_data/designs').set(designs).then(() => {
                    alert('تمت إضافة القالب وتحديث السحابة بنجاح!');
                    renderAdminPanel(document.getElementById('mainContainer'));
                }).catch(err => {
                    alert('حدث خطأ أثناء الحفظ بالسحابة: ' + err.message);

            } else {
                renderAdminPanel(document.getElementById('mainContainer'));

        }

        function deleteDesign(id) {
            if (confirm('هل أنت متأكد من حذف هذا القالب نهائياً؟')) {
                designs = designs.filter(d => d.id !== id);
                if (db) {
                    db.ref('sky_data/designs').set(designs).then(() => {
                        alert('تم حذف القالب وتحديث السحابة بنجاح!');
                        renderAdminPanel(document.getElementById('mainContainer'));
                    });
                } else {
                    renderAdminPanel(document.getElementById('mainContainer'));
                }
            }
        }

        function saveGlobalLinks() {
            const appUrl = document.getElementById('appUrlInput').value.trim();
            const whatsappUrl = document.getElementById('whatsappUrlInput').value.trim();
            globalLinks = { appUrl, whatsappUrl };

            if (db) {
                db.ref('sky_data/links').set(globalLinks).then(() => {
                    alert('تم حفظ الروابط بنجاح في السحابة!');
                    updateUIElements();
                });

                alert('تم الحفظ محلياً');
            }
        }

        function saveAdminPassword() {
            const newPass = document.getElementById('newAdminPass').value.trim();
            if (newPass) {
                currentAdminPass = newPass;
                if (db) {
                    db.ref('sky_data/adminPass').set(newPass).then(() => alert('تم تغيير كلمة مرور الأدمن بنجاح!'));
                }
            }
        }
    </script>
