<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سكاي موبايل - بوابة التصاميم والخدمات المتكاملة</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">

    <!-- تحميل المحركات السريعة بشكل مؤجل حتى لا تعطل فتح الصفحة إطلاقاً -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js" defer></script>

    <style>
        :root {
            --sky-primary: #0c2461;
            --sky-secondary: #0a3d62;
            --sky-accent: #00a8ff;
            --sky-gradient: linear-gradient(135deg, #0c2461 0%, #0a3d62 50%, #00a8ff 100%);
            --shadow-soft: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body { 
            background: var(--sky-gradient);
            background-attachment: fixed;
            color: #2d3436; 
            padding: 10px 8px 25px 8px; 
            min-height: 100vh;
        }

        .ticker-wrap {
            width: 100%; background: rgba(12, 36, 97, 0.95); color: #00a8ff;
            padding: 5px 0; overflow: hidden; border-radius: 8px; margin-bottom: 12px;
            font-size: 11px; font-weight: 700; border: 1px solid rgba(0, 168, 255, 0.4);
        }
        .ticker-move { display: inline-block; white-space: nowrap; padding-right: 100%; animation: ticker 18s linear infinite; }
        @keyframes ticker { 0% { transform: translate3d(100%, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

        .container { 
            max-width: 600px; margin: 0 auto; background: rgba(255, 255, 255, 0.98); 
            padding: 14px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            border: 1px solid rgba(255, 255, 255, 0.6);
            position: relative;
        }
        
        .brand-header { text-align: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px dashed rgba(0, 168, 255, 0.3); }
        .brand-logo-wrapper { width: 100%; max-width: 210px; margin: 0 auto 4px auto; cursor: pointer; user-select: none; }
        .brand-logo-svg { width: 100%; height: auto; display: block; }

        .nav-tabs-bar { display: flex; gap: 4px; margin-bottom: 12px; background: #f1f5f9; padding: 3px; border-radius: 10px; }
        .nav-tab-btn { flex: 1; padding: 7px 3px; border: none; background: transparent; font-size: 11px; font-weight: 700; color: #475569; border-radius: 7px; cursor: pointer; transition: 0.2s; text-align: center; }
        .nav-tab-btn.active { background: #0c2461; color: #fff; box-shadow: var(--shadow-soft); }

        .search-filter-box { margin-bottom: 10px; }
        .search-filter-box input { width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 11px; outline: none; }

        .section-frame { background: #ffffff; border: 1px solid #e2e8f0; padding: 10px; border-radius: 12px; margin-bottom: 10px; box-shadow: var(--shadow-soft); }
        .section-frame.network-special { background: linear-gradient(135deg, #0c2461 0%, #0a3d62 100%); border: 1px solid #00a8ff; color: #ffffff; }
        
        .frame-title { font-size: 12px; font-weight: 800; color: #0c2461; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 5px; }

        .client-input-card { margin-bottom: 8px; }
        .client-input-card label { display: block; margin-bottom: 3px; font-weight: 700; font-size: 11px; color: #0c2461; }
        .client-input-card input, .client-input-card select { width: 100%; padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 7px; font-size: 11px; outline: none; background: #fff; }

        .color-compact-box { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 6px 8px; border-radius: 8px; margin-bottom: 10px; }
        .color-compact-box summary { font-size: 11px; font-weight: 700; color: #0c2461; cursor: pointer; user-select: none; }
        .colors-picker-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 6px; }
        .color-item { display: flex; align-items: center; justify-content: space-between; background: #ffffff; padding: 3px 6px; border-radius: 5px; border: 1px solid #e2e8f0; }
        .color-item label { font-size: 10px; font-weight: 700; }
        .color-item input[type="color"] { width: 24px; height: 22px; border: none; cursor: pointer; background: transparent; padding: 0; }

        .categories-scroll { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-chip { background: #fff; border: 1px solid #cbd5e1; padding: 4px 10px; border-radius: 16px; font-size: 10px; font-weight: 700; white-space: nowrap; cursor: pointer; color: #475569; }
        .cat-chip.active { background: #0c2461; color: #fff; border-color: #0c2461; }

        .templates-preview-scroll { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px 2px; margin-bottom: 8px; min-height: 70px; }
        .thumb-card { flex: 0 0 60px; height: 70px; border-radius: 8px; overflow: hidden; border: 2px solid #cbd5e1; cursor: pointer; background: #e2e8f0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 9px; font-weight: 700; color: #0c2461; }
        .thumb-card.selected { border-color: #00a8ff; transform: scale(1.02); }
        .thumb-card img { width: 100%; height: 100%; object-fit: cover; }

        .preview-box { background: #fff; border: 1.5px dashed #00a8ff; padding: 8px; border-radius: 12px; margin-bottom: 10px; position: relative; }
        #canvasContainer { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 8px; background: #f8fafc; }
        #previewCanvas { width: 100%; height: auto; display: block; }

        .action-links { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
        .link-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 8px; border-radius: 8px; font-weight: 700; font-size: 11px; border: none; cursor: pointer; color: white; text-decoration: none; }
        .download-img-btn { background: #00a8ff; }
        .whatsapp-share-btn { background: #25d366; }
        .copy-design-btn { background: #8e44ad; }
        .copy-link-btn { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .store-link-btn { background: #0a3d62; }
        .whatsapp-channel-btn { background: #128c7e; }

        .client-credits-footer { margin-top: 12px; padding-top: 8px; border-top: 1px solid #e2e8f0; text-align: center; font-size: 10px; color: #64748b; font-weight: 700; }
        .telecom-providers-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
        .provider-badge { background: #f8fafc; border: 1px solid #cbd5e1; padding: 6px 4px; border-radius: 6px; text-align: center; font-size: 10px; font-weight: 700; color: #0c2461; }

        .network-floating-trigger {
            display: inline-flex; align-items: center; gap: 5px;
            background: linear-gradient(135deg, #0c2461 0%, #00a8ff 100%);
            color: #ffffff; padding: 6px 12px; border-radius: 20px;
            font-size: 10px; font-weight: 800; border: 1.5px solid #ffffff;
            cursor: pointer; box-shadow: 0 4px 12px rgba(0, 168, 255, 0.3);
            transition: all 0.25s ease-in-out; margin-bottom: 10px; width: fit-content;
            animation: pulseGlow 2s infinite;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(0, 168, 255, 0.5); }
            70% { box-shadow: 0 0 0 8px rgba(0, 168, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 168, 255, 0); }
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(12, 36, 97, 0.7); display: flex; align-items: center;
            justify-content: center; z-index: 99999; backdrop-filter: blur(4px);
        }
        .modal-card {
            background: #ffffff; border-radius: 16px; padding: 16px; width: 90%;
            max-width: 380px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); border: 1.5px solid #00a8ff;
            animation: modalPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalPop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* Admin Styles */
        .admin-header { background: var(--sky-gradient); color: white; padding: 12px; border-radius: 10px; text-align: center; margin-bottom: 12px; }
        .admin-header h2 { font-size: 14px; font-weight: 800; }
        .admin-card { background: #fff; border: 1px solid #e2e8f0; padding: 12px; border-radius: 10px; margin-bottom: 10px; }
        .admin-card h3 { font-size: 11px; font-weight: 800; color: #0c2461; margin-bottom: 8px; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
        .btn-main { background: var(--sky-gradient); color: white; border: none; padding: 8px; width: 100%; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 11px; }
        .btn-exit-admin { background-color: #e74c3c; color: white; border: none; padding: 8px; width: 100%; border-radius: 8px; font-weight: 700; cursor: pointer; margin-bottom: 10px; font-size: 11px; }
        .item-list-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 10px; }
        .item-list-table th, .item-list-table td { border: 1px solid #dee2e6; padding: 5px; text-align: center; }
        .btn-delete-item { background: #dc3545; color: white; border: none; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 9px; font-weight: 700; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <!-- يتم رسم الواجهة بالكامل من الكاش فوراً بكسر من الثانية -->
    </div>

    <!-- النافذة المنبثقة للتخصيص الكامل لشبكة الواي فاي -->
    <div id="networkConfigModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px;">
                <h4 style="font-size: 12px; color: #0c2461; font-weight: 800;">📶 تخصيص بيانات وخيارات الشبكة</h4>
                <button onclick="closeNetworkModal()" style="background: none; border: none; font-size: 16px; cursor: pointer; color: #64748b;">✖</button>
            </div>
            
            <div class="client-input-card">
                <label>اختر الشبكة المسجلة:</label>
                <select id="cNetSelect" onchange="applySelectedNetworkCode()">
                    <!-- يتم بناؤها ديناميكياً -->
                </select>
            </div>
            <div class="client-input-card">
                <label>رقم الشبكة بالتطبيق:</label>
                <input type="text" id="cNetCode" placeholder="مثال: 102" oninput="autoMatchNetworkCode()">
            </div>
            <div class="client-input-card">
                <label>اسم الشبكة:</label>
                <input type="text" id="cNetName" placeholder="مثال: الفجر" oninput="debouncedDraw()">
            </div>
            <div class="client-input-card">
                <label>شكل عرض بيانات الشبكة:</label>
                <select id="cNetStyle" onchange="debouncedDraw()">
                    <option value="default">الافتراضي (شريط طولي خلفية داكنة)</option>
                    <option value="bubble">دائري معلقة (بالونة دائرية في الزاوية)</option>
                    <option value="barcode">رمز شريطي (باركود احترافي)</option>
                </select>
            </div>

            <button onclick="closeNetworkModal()" class="btn-main" style="margin-top: 6px;">إغلاق وتطبيق التصميم</button>
        </div>
    </div>

    <script>
        // --- 1. CONFIG & STATE MANAGEMENT ---
        const firebaseConfig = {
            apiKey: "AIzaSyDNwIUGqA2dm5Mrx5S06LIEGPJ_VgW3eFc",
            authDomain: "sky-mobile-8e245.firebaseapp.com",
            databaseURL: "https://sky-mobile-8e245-default-rtdb.firebaseio.com",
            projectId: "sky-mobile-8e245",
            messagingSenderId: "1066510361417",
            appId: "1:1066510361417:web:a5e17c7f3c8e267b1d3098"
        };

        let db = null;

        const AppState = {
            currentAdminPass: "sky2026",
            activeTab: 'designer', // 'designer', 'telecom', 'wifi', 'support'
            globalLinks: {
                appUrl: 'https://play.google.com/store/apps/details?id=com.skymobile.app',
                whatsappUrl: 'https://whatsapp.com/channel/YOUR_CHANNEL_LINK',
                supportPhone: '738328251'
            },
            defaultDesign: {
                id: 'design_wifi_canvas_dynamic',
                title: '🌐 قالب شبكي تفاعلي احترافي',
                categoryId: 'cat_wifi_networks',
                isGenerated: true,
                image: ''
            },
            categories: [{ id: 'cat_wifi_networks', name: '📶 تصاميم كروت الشبكات' }],
            designs: [],
            networkCodes: [],
            imageCache: {},
            activeCategory: 'all',
            currentDesignId: 'design_wifi_canvas_dynamic',
            loadedBaseImage: null,
            isDynamicCanvasMode: true,
            renderDebounceTimer: null,
            logoClickCounter: 0,
            logoClickTimer: null,
            searchQuery: ""
        };

        AppState.designs = [AppState.defaultDesign];

        // --- 2. INITIALIZATION & FAST LOAD ---
        window.onload = function() {
            checkUrlForSpecificDesign();
            
            // فتح فوراً في أجزاء من الثانية من الكاش المحفوظ
            const cachedData = localStorage.getItem('sky_mobile_data_cache');
            if (cachedData) {
                try { processFetchedData(JSON.parse(cachedData)); } catch (e) { checkViewState(); }
            } else {
                checkViewState();
            }

            // الاتصال بـ Firebase في الخلفية
            initFirebaseAndSync();
        };

        function initFirebaseAndSync() {
            let checkFirebaseTimer = setInterval(() => {
                if (typeof firebase !== "undefined") {
                    clearInterval(checkFirebaseTimer);
                    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                    db = firebase.database();
                    fetchFromFirebase();
                }
            }, 50);
        }

        function resetNetworkInputs() {
            const netNameInput = document.getElementById('cNetName');
            const netCodeInput = document.getElementById('cNetCode');
            const netSelectInput = document.getElementById('cNetSelect');
            if (netNameInput) netNameInput.value = '';
            if (netCodeInput) netCodeInput.value = '';
            if (netSelectInput) netSelectInput.value = '';
        }

        function checkUrlForSpecificDesign() {
            const params = new URLSearchParams(window.location.search);
            const designParam = params.get('design');
            if (designParam) {
                AppState.currentDesignId = designParam;
                AppState.activeTab = 'designer';
            }
        }

        function fetchFromFirebase() {
            if (!db) return;
            db.ref('sky_data').once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data) {
                    try { localStorage.setItem('sky_mobile_data_cache', JSON.stringify(data)); } catch(e) {}
                    processFetchedData(data);
                }
            });
        }

        function processFetchedData(data) {
            if (data.categories) {
                const fetchedCats = Object.values(data.categories);
                if (!fetchedCats.some(c => c.id === 'cat_wifi_networks')) {
                    fetchedCats.unshift({ id: 'cat_wifi_networks', name: '📶 تصاميم كروت الشبكات' });
                }
                AppState.categories = fetchedCats;
            }
            if (data.designs) {
                AppState.designs = [AppState.defaultDesign, ...Object.values(data.designs)];
            }
            if (data.links) AppState.globalLinks = { ...AppState.globalLinks, ...data.links };
            if (data.adminPass) AppState.currentAdminPass = data.adminPass;
            if (data.networks) AppState.networkCodes = Object.values(data.networks);
            
            checkViewState();
        }

        // --- 3. ROUTING & CONTROLLER ---
        function checkViewState() {
            const container = document.getElementById('mainContainer');
            const isAdminMode = sessionStorage.getItem('sky_in_admin_mode') === 'true';
            const isAuth = sessionStorage.getItem('sky_admin_authenticated') === 'true';

            if (isAdminMode) {
                if (isAuth) renderAdminPanel(container);
                else renderLoginForm(container);
            } else {
                renderClientPanel(container);
            }
        }

        function switchTab(tabId) {
            AppState.activeTab = tabId;
            resetNetworkInputs();
            checkViewState();
        }

        function handleSecretLogoClick() {
            AppState.logoClickCounter++;
            clearTimeout(AppState.logoClickTimer);
            if (AppState.logoClickCounter >= 5) {
                AppState.logoClickCounter = 0;
                sessionStorage.setItem('sky_in_admin_mode', 'true');
                checkViewState();
            } else {
                AppState.logoClickTimer = setTimeout(() => { AppState.logoClickCounter = 0; }, 1500);
            }
        }

        // --- 4. RENDERERS (VIEW GENERATORS) ---
        function renderClientPanel(container) {
            let activeTabContent = '';

            if (AppState.activeTab === 'designer') {
                activeTabContent = `
                    <div class="search-filter-box"><input type="text" placeholder="🔍 ابحث عن تصميم..." oninput="handleSearchInput(this.value)"></div>
                    <div class="categories-scroll" id="catChipsContainer"></div>
                    
                    <button id="netFloatingTriggerBtn" class="network-floating-trigger" onclick="openNetworkModal()">
                        <span>🌐</span>
                        <span>تخصيص بيانات ورقم الشبكة</span>
                    </button>

                    <div class="templates-preview-scroll" id="templatesScrollContainer"></div>

                    <div class="preview-box">
                        <div id="canvasContainer"><canvas id="previewCanvas"></canvas></div>
                        <details class="color-compact-box">
                            <summary>🎨 اضغط هنا لتخصيص ألوان التصميم</summary>
                            <div class="colors-picker-grid">
                                <div class="color-item"><label>الهيدر:</label><input type="color" id="colBg" value="#0c2461" onchange="debouncedDraw()"></div>
                                <div class="color-item"><label>الرئيسي:</label><input type="color" id="colText1" value="#ffffff" onchange="debouncedDraw()"></div>
                                <div class="color-item"><label>الفرعي:</label><input type="color" id="colText2" value="#00a8ff" onchange="debouncedDraw()"></div>
                                <div class="color-item"><label>الإطار:</label><input type="color" id="colBorder" value="#00a8ff" onchange="debouncedDraw()"></div>
                            </div>
                        </details>
                    </div>

                    <div class="section-frame">
                        <div class="frame-title">📝 بياناتك التجارية للتصميم</div>
                        <div class="client-input-card"><label>🏪 اسم المحل / النقطة:</label><input type="text" id="cShop" placeholder="أدخل اسمك أو المحل" oninput="debouncedDraw()"></div>
                        <div class="client-input-card"><label>📍 العنوان:</label><input type="text" id="cAddress" placeholder="العنوان" oninput="debouncedDraw()"></div>
                        <div class="client-input-card"><label>📞 الهاتف:</label><input type="text" id="cPhone" value="${AppState.globalLinks.supportPhone}" oninput="debouncedDraw()"></div>
                        <div class="action-links">
                            <button class="link-btn download-img-btn" onclick="downloadImage()">📥 تحميل التصميم</button>
                            <button class="link-btn copy-design-btn" onclick="copyDesignLink()">🔗 نسخ رابط التصميم الحالي</button>
                            <button class="link-btn whatsapp-share-btn" onclick="shareToWhatsApp()">📱 مشاركة عبر الواتساب</button>
                        </div>
                    </div>`;
            } else if (AppState.activeTab === 'telecom') {
                activeTabContent = `
                    <div class="section-frame"><div class="frame-title">📱 خدمات تسديد الباقات والرصيد المباشر</div>
                        <p style="font-size:10px; color:#475569; margin-bottom:8px;">يمكنك تسديد جميع شبكات الاتصالات اليمنية عبر تطبيق سكاي موبايل بسرعة وسهولة:</p>
                        <div class="telecom-providers-grid">
                            <div class="provider-badge">🔴 يمن موبايل</div><div class="provider-badge">🟠 يو (YOU)</div><div class="provider-badge">🔵 سبأفون</div>
                            <div class="provider-badge">⚡ يمن فورجي</div><div class="provider-badge">☎️ الهاتف الأرضي</div><div class="provider-badge">🌐 النت الأرضي ADSL</div>
                        </div>
                        <a href="${AppState.globalLinks.appUrl}" target="_blank" class="link-btn store-link-btn" style="margin-top:12px;">🛒 فتح التطبيق للتسديد المباشر</a>
                    </div>`;
            } else if (AppState.activeTab === 'wifi') {
                let netsListHtml = AppState.networkCodes.map(n => `<div style="background:#ffffff; color:#0c2461; padding:6px 10px; border-radius:6px; font-size:10px; margin-bottom:5px; display:flex; justify-content:space-between; font-weight:bold; border:1px solid #00a8ff;"><span>🌐 ${n.name}</span><span>رقم التسديد: [ ${n.code} ]</span></div>`).join('');
                activeTabContent = `
                    <div class="section-frame network-special"><div class="frame-title">📶 إدارة وتسديد كروت الواي فاي</div>
                        <p style="font-size:10px; color:#e2e8f0; margin-bottom:8px;">دليل الشبكات المضافة للتسديد المباشر عبر التطبيق:</p>
                        <div style="max-height:180px; overflow-y:auto; margin-bottom:10px; border:1px solid rgba(255,255,255,0.2); border-radius:6px; padding:5px; background:rgba(0,0,0,0.2);">
                            ${netsListHtml || '<p style="font-size:9px; text-align:center;">لا توجد شبكات مضافة حالياً</p>'}
                        </div>
                        <div class="client-input-card">
                            <label style="color:#fff;">طلب إضافة شبكتك مجاناً:</label>
                            <input type="text" id="reqNetNameView" placeholder="أدخل اسم شبكتك لإضافتها">
                        </div>
                        <button onclick="sendNetworkAddRequestFromView()" style="width:100%; background:#25d366; color:white; border:none; padding:8px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:11px;">📲 طلب إضافة شبكتك عبر الواتساب</button>
                    </div>`;
            } else if (AppState.activeTab === 'support') {
                activeTabContent = `
                    <div class="section-frame"><div class="frame-title">💬 خدمات الدعم الفني والروابط الرسمية</div>

                            </defs>
                            <path d="M 120,75 A 75,75 0 0,1 240,65" fill="none" stroke="url(#skyGrad)" stroke-width="12" stroke-linecap="round"/>
                            <rect x="248" y="52" width="10" height="10" fill="#0080FF" rx="1"/><rect x="262" y="52" width="10" height="10" fill="#0080FF" rx="1"/><rect x="255" y="65" width="10" height="10" fill="#0080FF" rx="1"/>
                            <text x="200" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="url(#skyGrad)" letter-spacing="-1">SKY</text>

        // --- 5. DESIGNER & CANVAS ENGINE ---
        function renderCategoryChips() {
            const container = document.getElementById('catChipsContainer');
            if (!container) return;
            let html = `<div class="cat-chip ${AppState.activeCategory==='all'?'active':''}" onclick="filterByCategory('all')">📁 الكل (${AppState.designs.length})</div>`;
            AppState.categories.forEach(cat => {
                const count = AppState.designs.filter(d => d.categoryId === cat.id).length;
                html += `<div class="cat-chip ${AppState.activeCategory===cat.id?'active':''}" onclick="filterByCategory('${cat.id}')">${cat.name} (${count})</div>`;
            });
            container.innerHTML = html;
        }

        function filterByCategory(catId) {
            AppState.activeCategory = catId;
            resetNetworkInputs();
            renderCategoryChips();
            
            const miniFloatingBtn = document.getElementById('netFloatingTriggerBtn');
            if (miniFloatingBtn) {
                miniFloatingBtn.style.display = (catId === 'cat_wifi_networks') ? 'inline-flex' : 'none';
            }

            let filtered = getFilteredDesigns();
            if (filtered.length > 0) {
                AppState.currentDesignId = filtered[0].id;
                renderClientThumbnails(filtered[0].id);
                loadSelectedDesign(filtered[0]);
            } else {
                renderClientThumbnails(null);
            }
        }

        function getFilteredDesigns() {
            let list = AppState.designs;
            if (AppState.activeCategory !== 'all') list = list.filter(d => d.categoryId === AppState.activeCategory);
            if (AppState.searchQuery) list = list.filter(d => d.title.toLowerCase().includes(AppState.searchQuery));
            return list;
        }

        function renderClientThumbnails(selectedId) {
            const scrollBox = document.getElementById('templatesScrollContainer');
            if(!scrollBox) return;
            scrollBox.innerHTML = '';
            let list = getFilteredDesigns();
            if (list.length === 0) {
                scrollBox.innerHTML = `<p style="font-size:10px; color:#64748b; padding:6px;">لا توجد تصاميم.</p>`;
                return;
            }
            list.forEach(item => {
                const isSelected = item.id == selectedId;
                const div = document.createElement('div');
                div.className = `thumb-card ${isSelected ? 'selected' : ''}`;
                div.onclick = () => {
                    resetNetworkInputs();
                    AppState.currentDesignId = item.id;
                    renderClientThumbnails(item.id);
                    loadSelectedDesign(item);
                };
                div.innerHTML = item.isGenerated ? `🌐<br>قالب آلي` : `<img src="${item.image}" alt="${item.title}" loading="lazy" decoding="async">`;
                scrollBox.appendChild(div);
            });
        }

        function loadSelectedDesign(designObj) {
            if(!designObj) return;

            const miniFloatingBtn = document.getElementById('netFloatingTriggerBtn');
            if (miniFloatingBtn) {
                miniFloatingBtn.style.display = (designObj.categoryId === 'cat_wifi_networks' || AppState.activeCategory === 'cat_wifi_networks') ? 'inline-flex' : 'none';
            }

            if (designObj.isGenerated) {
                AppState.isDynamicCanvasMode = true;
                AppState.loadedBaseImage = null;
                drawFinalImage();
                return;
            }
            AppState.isDynamicCanvasMode = false;
            if (AppState.imageCache[designObj.image] && AppState.imageCache[designObj.image].complete) {
                AppState.loadedBaseImage = AppState.imageCache[designObj.image];
                drawFinalImage();
            } else {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = function() {
                    AppState.imageCache[designObj.image] = img;
                    AppState.loadedBaseImage = img;
                    drawFinalImage();
                };
                img.src = designObj.image;
            }
        }

        function debouncedDraw() {
            clearTimeout(AppState.renderDebounceTimer);
            AppState.renderDebounceTimer = setTimeout(() => requestAnimationFrame(drawFinalImage), 30);
        }

        function drawFinalImage() {
            const canvas = document.getElementById('previewCanvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const shopName = document.getElementById('cShop')?.value.trim() || "";
            const address = document.getElementById('cAddress')?.value.trim() || "";
            const phone = document.getElementById('cPhone')?.value.trim() || "";
            const netName = document.getElementById('cNetName')?.value.trim() || "";
            const netCode = document.getElementById('cNetCode')?.value.trim() || "";
            const styleType = document.getElementById('cNetStyle')?.value || "default";

            const colBg = document.getElementById('colBg')?.value || "#0c2461";
            const colText1 = document.getElementById('colText1')?.value || "#ffffff";
            const colText2 = document.getElementById('colText2')?.value || "#00a8ff";
            const colBorder = document.getElementById('colBorder')?.value || "#00a8ff";
            const selectedFontFamily = "'Cairo', sans-serif";

            if (AppState.isDynamicCanvasMode || !AppState.loadedBaseImage) {
                canvas.width = 1000; canvas.height = 1000;
                
                const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                bgGrad.addColorStop(0, colBg);
                bgGrad.addColorStop(0.5, '#07183d');
                bgGrad.addColorStop(1, '#030b1e');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = "rgba(0, 168, 255, 0.05)";
                ctx.lineWidth = 1;
                for (let x = 0; x < canvas.width; x += 40) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                }
                for (let y = 0; y < canvas.height; y += 40) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                }

                ctx.strokeStyle = colBorder;
                ctx.lineWidth = 8;
                ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

                ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(32, 32, canvas.width - 64, canvas.height - 64);

                const centerX = canvas.width / 2;
                const centerY = canvas.height * 0.38;
                
                ctx.save();
                ctx.strokeStyle = colText2;
                ctx.lineWidth = 10;
                ctx.lineCap = "round";
                ctx.shadowColor = colText2;
                ctx.shadowBlur = 14;

                for (let r = 120; r >= 35; r -= 30) {
                    ctx.beginPath();
                    ctx.arc(centerX, centerY + 25, r, Math.PI * 1.22, Math.PI * 1.78);
                    ctx.stroke();
                }
                ctx.beginPath();
                ctx.arc(centerX, centerY + 30, 12, 0, Math.PI * 2);
                ctx.fillStyle = colText2;
                ctx.fill();
                ctx.restore();

                ctx.textAlign = "center";
                ctx.shadowColor = "rgba(0,0,0,0.6)";
                ctx.shadowBlur = 6;

                ctx.fillStyle = colText1;
                ctx.font = `800 36px ${selectedFontFamily}`;
                ctx.fillText("📶 خدمة إنترنت واي فاي فائقة السرعة", centerX, canvas.height * 0.52);

                const speedBadgeW = 480; const speedBadgeH = 44;
                ctx.fillStyle = "rgba(0, 168, 255, 0.2)";
                ctx.beginPath();
                ctx.roundRect(centerX - (speedBadgeW/2), canvas.height * 0.56, speedBadgeW, speedBadgeH, 22);
                ctx.fill();
                ctx.strokeStyle = colBorder;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = colText2;
                ctx.font = `700 18px ${selectedFontFamily}`;
                ctx.fillText("⚡ سرعة فائقة تصل إلى 100 ميجابايت/ثانية ⚡", centerX, canvas.height * 0.56 + 28);

                const features = [
                    { icon: "🚀", title: "تغطية ممتازة 5G" },
                    { icon: "🎮", title: "ثبات عالي للألعاب" },
                    { icon: "⚡", title: "تحميل غير محدود" },
                    { icon: "💳", title: "كروت شحن متوفرة" }
                ];

                const cardW = 190; const cardH = 70; const gap = 14;
                const startX = centerX - (cardW * 2 + gap * 1.5);
                const startY = canvas.height * 0.64;

                features.forEach((feat, index) => {
                    const x = startX + (index % 2) * (cardW + gap * 2) + 10;
                    const y = startY + Math.floor(index / 2) * (cardH + gap);

                    ctx.fillStyle = "rgba(255, 255, 255, 0.06)";
                    ctx.beginPath();
                    ctx.roundRect(x, y, cardW, cardH, 10);
                    ctx.fill();
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    ctx.textAlign = "right";
                    ctx.font = `800 24px ${selectedFontFamily}`;
                    ctx.fillText(feat.icon, x + cardW - 12, y + 44);

                    ctx.textAlign = "center";
                    ctx.fillStyle = "#ffffff";
                    ctx.font = `700 14px ${selectedFontFamily}`;
                    ctx.fillText(feat.title, x + (cardW / 2) - 8, y + 42);
                });

                const footerHeight = 120;
                const footerY = canvas.height - footerHeight - 20;

                ctx.fillStyle = "rgba(12, 36, 97, 0.95)";
                ctx.fillRect(20, footerY, canvas.width - 40, footerHeight);
                ctx.fillStyle = colBorder;
                ctx.fillRect(20, footerY, canvas.width - 40, 4);

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                const dispShop = shopName || "مركز الخدمات والاتصالات المعتمد";
                ctx.font = `800 26px ${selectedFontFamily}`;
                ctx.fillStyle = colText1;
                ctx.fillText(dispShop, centerX, footerY + 40);

                const subDetails = [address ? "📍 " + address : "📍 التغطية متوفرة في كافة الأرجاء", phone ? "📞 " + phone : "📞 " + AppState.globalLinks.supportPhone].filter(Boolean).join("  |  ");
                ctx.font = `700 17px ${selectedFontFamily}`;
                ctx.fillStyle = colText2;
                ctx.fillText(subDetails, centerX, footerY + 82);

            } else {
                const hasFooterData = shopName || address || phone;
                const footerHeight = hasFooterData ? Math.max(90, AppState.loadedBaseImage.height * 0.14) : 0;
                canvas.width = AppState.loadedBaseImage.width; canvas.height = AppState.loadedBaseImage.height + footerHeight;
                ctx.drawImage(AppState.loadedBaseImage, 0, 0, AppState.loadedBaseImage.width, AppState.loadedBaseImage.height);

                if (hasFooterData) {
                    const footerY = AppState.loadedBaseImage.height;
                    ctx.fillStyle = colBg; ctx.fillRect(0, footerY, canvas.width, footerHeight);
                    ctx.fillStyle = colBorder; ctx.fillRect(0, footerY, canvas.width, 4);
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";

                    if (shopName) {
                        ctx.font = `800 ${footerHeight * 0.30}px ${selectedFontFamily}`;
                        ctx.fillStyle = colText1;
                        ctx.fillText(shopName, canvas.width / 2, footerY + (footerHeight * 0.34));
                    }
                    const subDetails = [address ? "📍 " + address : "", phone ? "📞 " + phone : ""].filter(Boolean).join("  |  ");
                    if (subDetails) {
                        ctx.font = `700 ${footerHeight * 0.22}px ${selectedFontFamily}`;
                        ctx.fillStyle = colText2;
                        ctx.fillText(subDetails, canvas.width / 2, footerY + (footerHeight * 0.74));
                    }
                }
            }

            const topBadgeHeight = canvas.height * 0.055;
            ctx.fillStyle = colBg; ctx.fillRect(0, 0, canvas.width, topBadgeHeight);
            ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = colText1;

            const currentDesignObj = AppState.designs.find(d => d.id == AppState.currentDesignId);
            const isNetworkSection = (AppState.activeCategory === 'cat_wifi_networks') || (currentDesignObj && currentDesignObj.categoryId === 'cat_wifi_networks');

            if (isNetworkSection) {
                ctx.font = `800 ${topBadgeHeight * 0.45}px ${selectedFontFamily}`;
                ctx.fillStyle = "#ffffff";
                ctx.fillText("يمكنكم شراء كروت الشبكة عبر تطبيق سكاي موبايل", canvas.width / 2, topBadgeHeight / 2);
            } else {
                ctx.font = `800 ${topBadgeHeight * 0.43}px ${selectedFontFamily}`;
                ctx.fillText("⭐ نقطة بيع معتمدة لتطبيق سكاي موبايل ⭐", canvas.width / 2, topBadgeHeight / 2);
            }

            if (netName || netCode) {
                if (styleType === "bubble") {
                    const diameter = canvas.width * 0.25; 
                    const radius = diameter / 2;
                    const centerX = canvas.width - radius - (canvas.width * 0.035);
                    const centerY = topBadgeHeight + radius + (canvas.height * 0.025);

                    ctx.save();
                    ctx.shadowColor = "rgba(0,0,0,0.55)";
                    ctx.shadowBlur = 12;
                    ctx.shadowOffsetY = 4;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(12, 36, 97, 0.97)";
                    ctx.fill();
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = colBorder;
                    ctx.stroke();
                    ctx.restore();

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius - 3, 0, Math.PI * 2);
                    ctx.clip();

                    const nameText = netName ? `📶 ${netName}` : "📶 الواي فاي";
                    const labelText = "رقم الشبكة";
                    const codeText = netCode ? `[ ${netCode} ]` : "[ -- ]";
                    const maxAllowedWidth = diameter * 0.80;

                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";

                    let nameFontSize = radius * 0.22;
                    ctx.font = `800 ${nameFontSize}px ${selectedFontFamily}`;
                    while (ctx.measureText(nameText).width > maxAllowedWidth && nameFontSize > 8) {
                        nameFontSize -= 1;
                        ctx.font = `800 ${nameFontSize}px ${selectedFontFamily}`;
                    }
                    ctx.fillStyle = "#ffffff";
                    ctx.fillText(nameText, centerX, centerY - (radius * 0.44));

                    let labelFontSize = radius * 0.16;
                    ctx.font = `700 ${labelFontSize}px ${selectedFontFamily}`;
                    ctx.fillStyle = "#cbd5e1";
                    ctx.fillText(labelText, centerX, centerY - (radius * 0.04));

                    let codeFontSize = radius * 0.22;
                    ctx.font = `800 ${codeFontSize}px ${selectedFontFamily}`;
                    while (ctx.measureText(codeText).width > maxAllowedWidth && codeFontSize > 8) {
                        codeFontSize -= 1;
                        ctx.font = `800 ${codeFontSize}px ${selectedFontFamily}`;
                    }
                    ctx.fillStyle = colText2;
                    ctx.fillText(codeText, centerX, centerY + (radius * 0.40));

                    ctx.restore();

                } else if (styleType === "barcode") {
                    const cardW = canvas.width * 0.33;
                    const cardH = canvas.height * 0.12;
                    const posX = canvas.width - cardW - (canvas.width * 0.03);
                    const posY = topBadgeHeight + (canvas.height * 0.02);

                    ctx.save();
                    ctx.shadowColor = "rgba(0,0,0,0.4)";
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.roundRect(posX, posY, cardW, cardH, 10);
                    ctx.fill();
                    ctx.strokeStyle = colBorder;
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                    ctx.restore();

                    ctx.textAlign = "center";
                    ctx.fillStyle = colBg;
                    ctx.font = `800 ${cardH * 0.16}px ${selectedFontFamily}`;
                    ctx.fillText(netName ? `📶 شبكة ${netName}` : "📶 كرت الشبكة", posX + (cardW / 2), posY + (cardH * 0.22));

                    if (netCode && typeof JsBarcode !== "undefined") {
                        const tempCanvas = document.createElement("canvas");
                        try {
                            JsBarcode(tempCanvas, netCode, {
                                format: "CODE128",
                                displayValue: false,
                                margin: 0,
                                background: "#ffffff",
                                lineColor: "#000000"
                            });
                            const bcW = cardW * 0.85;
                            const bcH = cardH * 0.40;
                            ctx.drawImage(tempCanvas, posX + ((cardW - bcW) / 2), posY + (cardH * 0.32), bcW, bcH);
                        } catch(e) {}
                    }

                    ctx.fillStyle = "#0c2461";
                    ctx.font = `800 ${cardH * 0.18}px ${selectedFontFamily}`;
                    ctx.fillText(`كود التسديد: ${netCode || '--'}`, posX + (cardW / 2), posY + (cardH * 0.88));

                } else {
                    const bannerHeight = canvas.height * 0.06;
                    const bannerY = topBadgeHeight;

                    ctx.fillStyle = "rgba(12, 36, 97, 0.92)";
                    ctx.fillRect(0, bannerY, canvas.width, bannerHeight);
                    ctx.fillStyle = colBorder;
                    ctx.fillRect(0, bannerY + bannerHeight - 3, canvas.width, 3);

                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    const netInfoText = `📶 شبكة: ${netName || 'عامة'}   |   رقم التسديد بالتطبيق: [ ${netCode || '--'} ]`;
                    
                    ctx.fillStyle = colText2;
                    ctx.font = `800 ${bannerHeight * 0.40}px ${selectedFontFamily}`;
                    ctx.fillText(netInfoText, canvas.width / 2, bannerY + (bannerHeight / 2));
                }
            }
        }

        // --- 6. UTILITIES & MODAL ACTIONS ---
        function openNetworkModal() {
            const modalSelect = document.getElementById('cNetSelect');
            if (modalSelect) {
                let optionsHtml = `<option value="" data-name="">اختر شبكتك المسجلة من القائمة</option>`;
                AppState.networkCodes.forEach(net => {
                    optionsHtml += `<option value="${net.code}" data-name="${net.name}">${net.name} - (رقم الشبكة: ${net.code})</option>`;
                });
                modalSelect.innerHTML = optionsHtml;
            }
            document.getElementById('networkConfigModal').style.display = 'flex';
        }

        function closeNetworkModal() {
            document.getElementById('networkConfigModal').style.display = 'none';
        }

        function autoMatchNetworkCode() {
            const codeInput = document.getElementById('cNetCode');
            const nameInput = document.getElementById('cNetName');
            const selectEl = document.getElementById('cNetSelect');
            if(!codeInput) return;
            const typedCode = codeInput.value.trim();
            if (typedCode) {
                const matched = AppState.networkCodes.find(n => n.code == typedCode);
                if (matched) {
                    if (nameInput) nameInput.value = matched.name;
                    if (selectEl) selectEl.value = matched.code;
                }
            }
            debouncedDraw();
        }

        function applySelectedNetworkCode() {
            const selectEl = document.getElementById('cNetSelect');
            const codeInput = document.getElementById('cNetCode');
            const nameInput = document.getElementById('cNetName');
            if (selectEl && selectEl.selectedIndex > 0) {
                const selectedOpt = selectEl.options[selectEl.selectedIndex];
                if (codeInput) codeInput.value = selectEl.value;
                if (nameInput) nameInput.value = selectedOpt.getAttribute('data-name') || "";
                debouncedDraw();
            }
        }

        function handleSearchInput(val) {
            AppState.searchQuery = val.trim().toLowerCase();
            let filtered = getFilteredDesigns();
            if (filtered.length > 0) {
                renderClientThumbnails(filtered[0].id);
                loadSelectedDesign(filtered[0]);
            }
        }

        function downloadImage() {
            const canvas = document.getElementById('previewCanvas');
            if(!canvas) return;
            if (typeof confetti === 'function') confetti({ particleCount: 50, spread: 50 });
            const link = document.createElement('a');
            link.download = `سكاي_موبايل_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png'); link.click();
        }

        function copyDesignLink() {
            const designUrl = `${window.location.origin}${window.location.pathname}?design=${encodeURIComponent(AppState.currentDesignId)}`;
            navigator.clipboard.writeText(`تصاميم مميزة صممت لأجلك:\n${designUrl}`); alert("✅ تم نسخ رابط التصميم!");
        }

        function shareToWhatsApp() {
            const designUrl = `${window.location.origin}${window.location.pathname}?design=${encodeURIComponent(AppState.currentDesignId)}`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(`تصاميم مميزة صممت لأجلك:\n${designUrl}`)}`, '_blank');
        }

        function sendNetworkAddRequestFromView() {
            const name = document.getElementById('reqNetNameView')?.value.trim();
            if(!name) { alert("أدخل اسم الشبكة!"); return; }
            window.open(`https://api.whatsapp.com/send?phone=967${AppState.globalLinks.supportPhone}&text=${encodeURIComponent(`طلب إضافة شبكة:\nاسم الشبكة: ${name}`)}`, '_blank');
        }

        function copyDirectLink() { navigator.clipboard.writeText(window.location.href); alert("تم نسخ رابط البوابة!"); }

        // --- 7. ADMIN PANEL ENGINE ---
        function renderLoginForm(container) {
            container.innerHTML = `
                <div class="admin-header"><h2>🔐 تسجيل دخول لوحة الإدارة</h2></div>
                <div class="admin-card">
                    <div class="client-input-card"><label>كلمة السر الإدارية:</label><input type="password" id="adminPassInput"></div>
                    <button class="btn-main" onclick="verifyPassword()">دخول</button>
                    <button class="btn-exit-admin" style="margin-top:8px;" onclick="exitAdminMode()">إلغاء والعودة</button>
                </div>`;
        }

        function verifyPassword() {
            const pass = document.getElementById('adminPassInput').value.trim();
            if (pass === AppState.currentAdminPass) {
                sessionStorage.setItem('sky_admin_authenticated', 'true');
                checkViewState();
            } else { alert('⚠️ كلمة السر خاطئة!'); }
        }

        function exitAdminMode() {
            sessionStorage.removeItem('sky_in_admin_mode');
            sessionStorage.removeItem('sky_admin_authenticated');
            checkViewState();
        }

        function renderAdminPanel(container) {
            let catSelectOptions = AppState.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            let designsRows = AppState.designs.filter(d => !d.isGenerated).map(d => `
                <tr>
                    <td><img src="${d.image}" loading="lazy" style="width:26px; height:26px; object-fit:cover; border-radius:4px;"></td>
                    <td>${d.title}</td>
                    <td><button class="btn-delete-item" onclick="deleteDesign('${d.id}')">حذف</button></td>
                </tr>`).join('');

            let catRows = AppState.categories.filter(c => c.id !== 'cat_wifi_networks').map(c => `
                <tr>
                    <td>${c.name}</td>
                    <td><button class="btn-delete-item" onclick="deleteCategory('${c.id}')">حذف</button></td>
                </tr>`).join('');

            let netRows = AppState.networkCodes.map(n => `
                <tr>
                    <td>${n.name}</td>
                    <td>${n.code}</td>
                    <td><button class="btn-delete-item" onclick="deleteNetwork('${n.code}')">حذف</button></td>
                </tr>`).join('');

            container.innerHTML = `
                <div class="admin-header"><h2>⚙️ لوحة إدارة سكاي موبايل المتكاملة</h2></div>
                <button class="btn-exit-admin" onclick="exitAdminMode()">🚪 الخروج من لوحة التحكم</button>

                <div class="admin-card">
                    <h3>🔗 إدارة الروابط والمعلومات العامة</h3>
                    <div class="client-input-card"><label>رابط التطبيق (Google Play):</label><input type="text" id="admAppUrl" value="${AppState.globalLinks.appUrl}"></div>
                    <div class="client-input-card"><label>رابط قناة الواتساب:</label><input type="text" id="admWaUrl" value="${AppState.globalLinks.whatsappUrl}"></div>
                    <div class="client-input-card"><label>رقم هاتف الدعم (بدون 967):</label><input type="text" id="admPhone" value="${AppState.globalLinks.supportPhone}"></div>
                    <button class="btn-main" onclick="saveGlobalLinks()">💾 حفظ الروابط</button>
                </div>

                <div class="admin-card">
                    <h3>📁 إدارة أقسام التصاميم</h3>
                    <div class="client-input-card"><label>اسم القسم الجديد:</label><input type="text" id="newCatName"></div>
                    <button class="btn-main" onclick="addNewCategory()">➕ إضافة قسم جديد</button>
                    <table class="item-list-table"><thead><tr><th>اسم القسم</th><th>إجراء</th></tr></thead><tbody>${catRows || '<tr><td colspan="2">لا توجد أقسام مخصصة</td></tr>'}</tbody></table>
                </div>

                <div class="admin-card">
                    <h3>📶 إدارة شبكات الواي فاي المسجلة</h3>
                    <div class="client-input-card"><label>اسم الشبكة:</label><input type="text" id="newNetName"></div>
                    <div class="client-input-card"><label>رقم/كود الشبكة:</label><input type="text" id="newNetCode"></div>
                    <button class="btn-main" onclick="addNewNetwork()">➕ إضافة شبكة</button>
                    <table class="item-list-table"><thead><tr><th>الشبكة</th><th>الكود</th><th>إجراء</th></tr></thead><tbody>${netRows || '<tr><td colspan="3">لا توجد شبكات مضافة</td></tr>'}</tbody></table>
                </div>

                <div class="admin-card">
                    <h3>🖼️ إضافة قالب تصميم جديد</h3>
                    <div class="client-input-card"><label>عنوان القالب:</label><input type="text" id="newDesignTitle"></div>
                    <div class="client-input-card"><label>القسم:</label><select id="newDesignCategory">${catSelectOptions}</select></div>
                    <div class="client-input-card">
                        <label>رابط الصورة أو ارفع ملف:</label>
                        <input type="text" id="newDesignImageUrl" style="margin-bottom:6px;">
                        <input type="file" id="newDesignFileInput" accept="image/*" onchange="convertAndCompressImage(this)">
                    </div>
                    <button class="btn-main" onclick="addNewDesign()">💾 حفظ القالب</button>
                    <table class="item-list-table"><thead><tr><th>صورة</th><th>العنوان</th><th>إجراء</th></tr></thead><tbody>${designsRows || '<tr><td colspan="3">لا توجد تصاميم مرفوعة</td></tr>'}</tbody></table>
                </div>`;
        }

        // --- 8. ADMIN ACTIONS ---
        function saveGlobalLinks() {
            if (!db) return;
            const appUrl = document.getElementById('admAppUrl').value.trim();
            const whatsappUrl = document.getElementById('admWaUrl').value.trim();
            const supportPhone = document.getElementById('admPhone').value.trim();
            
            db.ref('sky_data/links').set({ appUrl, whatsappUrl, supportPhone }).then(() => {
                alert("✅ تم حفظ الروابط والمعلومات بنجاح!");
                localStorage.removeItem('sky_mobile_data_cache');
                fetchFromFirebase();
            });
        }

        function addNewCategory() {
            if (!db) return;
            const name = document.getElementById('newCatName').value.trim();
            if (!name) return;
            const id = 'cat_' + Date.now();
            db.ref('sky_data/categories/' + id).set({ id, name }).then(() => {
                alert("✅ تم إضافة القسم!");
                localStorage.removeItem('sky_mobile_data_cache');
                fetchFromFirebase();
            });
        }

        function deleteCategory(id) {
            if (!db) return;
            if (confirm("هل أنت تأكد من حذف هذا القسم؟")) {
                db.ref('sky_data/categories/' + id).remove().then(() => {
                    localStorage.removeItem('sky_mobile_data_cache');
                    fetchFromFirebase();
                });
            }
        }

        function addNewNetwork() {
            if (!db) return;
            const name = document.getElementById('newNetName').value.trim();
            const code = document.getElementById('newNetCode').value.trim();
            if (!name || !code) return;
            const id = 'net_' + Date.now();
            db.ref('sky_data/networks/' + id).set({ id, name, code }).then(() => {
                alert("✅ تم إضافة الشبكة!");
                localStorage.removeItem('sky_mobile_data_cache');
                fetchFromFirebase();
            });
        }

        function deleteNetwork(code) {
            if (!db) return;
            if (confirm("تأكيد حذف الشبكة؟")) {
                db.ref('sky_data/networks').once('value').then(snap => {
                    const data = snap.val();
                    for(let key in data) {
                        if (data[key].code == code) {
                            db.ref('sky_data/networks/' + key).remove().then(() => {
                                localStorage.removeItem('sky_mobile_data_cache');
                                fetchFromFirebase();
                            });
                            break;
                        }
                    }
                });
            }
        }

        let uploadedBase64Temp = "";
        function convertAndCompressImage(fileInput) {
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; let width = img.width; let height = img.height;
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                        uploadedBase64Temp = canvas.toDataURL('image/jpeg', 0.6);
                        document.getElementById('newDesignImageUrl').value = "تم ضغط الصورة بنجاح ✓";
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function addNewDesign() {
            if (!db) return;
            const title = document.getElementById('newDesignTitle').value.trim();
            const categoryId = document.getElementById('newDesignCategory').value;
            let imageUrl = document.getElementById('newDesignImageUrl').value.trim();
            if (uploadedBase64Temp && imageUrl.includes("تم ضغط الصورة")) imageUrl = uploadedBase64Temp;
            if (!title || !imageUrl) return;
            const id = 'design_' + Date.now();
            db.ref('sky_data/designs/' + id).set({ id, title, categoryId, image: imageUrl, isGenerated: false }).then(() => {
                localStorage.removeItem('sky_mobile_data_cache');
                fetchFromFirebase();
            });
        }

        function deleteDesign(id) {
            if (!db) return;
            if (confirm("تأكيد الحذف؟")) {
                db.ref('sky_data/designs/' + id).remove().then(() => {
                    localStorage.removeItem('sky_mobile_data_cache');
                    fetchFromFirebase();
                });
            }
        }
    </script>
</body>
</html>
